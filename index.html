<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>KKYKC</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c96008">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KKYKC">
<style>
  :root { --oranje: #e8630a; --tekst: #1f2328; --zacht: #6a737d; --bg: #fff; --kader: #e5e7eb; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --tekst: #e6e6e6; --zacht: #9aa4ae; --bg: #16181c; --kader: #2c3036; } }
  :root[data-theme="dark"] { --tekst: #e6e6e6; --zacht: #9aa4ae; --bg: #16181c; --kader: #2c3036; }   /* B3e: themaknop in de balk */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* B2: ook voor a.hoofd (inline-block) */
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--tekst); background: var(--bg); }
  header { background: var(--oranje); color: #fff; padding: 14px 18px; font-weight: bold; font-size: 20px; letter-spacing: .5px; }
  main { max-width: 520px; margin: 0 auto; padding: 24px 18px; }
  .kaart { border: 1px solid var(--kader); border-radius: 12px; padding: 20px; }
  .zacht { color: var(--zacht); font-size: 14px; }
  .fout { color: #c62828; }
  button.lijn { margin-top: 16px; padding: 10px 18px; border-radius: 20px; border: 1px solid var(--kader); background: transparent; color: var(--tekst); font-size: 15px; cursor: pointer; }
  .chip { display: inline-block; padding: 3px 10px; margin: 2px 4px 2px 0; border-radius: 12px; background: var(--oranje); color: #fff; font-size: 13px; }
  #knop { margin-top: 14px; min-height: 44px; }
  a.hoofd { display: inline-block; margin-top: 12px; padding: 12px 20px; border-radius: 22px; background: var(--oranje); color: #fff; text-decoration: none; font-weight: bold; }
</style>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="api.js"></script>
</head>
<body>
<header>KKYKC</header>
<main>
  <div class="kaart" id="kaart">
    <div id="uit">
      <p>Meld je aan met je Google-account.</p>
      <p class="zacht">De app ziet enkel je naam en e-mailadres, geen bestanden.</p>
      <div id="knop"></div>
      <p id="melding"></p>
    </div>
    <div id="in" hidden>
      <p id="wie">Even geduld…</p>
      <p id="rollen"></p>
      <p class="zacht">Wissel van pagina met de balk bovenaan.</p>
      <div id="aanvraag" hidden><p id="aanvraagTekst" class="zacht"></p><p id="aanvraagForm" hidden><input id="aanvraagNaam" maxlength="60" placeholder="Je naam" style="padding:9px;border-radius:8px;border:1px solid var(--kader);width:100%;max-width:320px"> <button class="lijn" id="aanvraagKnop" style="margin-top:8px">Toegang aanvragen als trainer</button></p></div>
      <button class="lijn" id="afmelden">Afmelden</button>
    </div>
  </div>
  <p class="zacht" style="margin-top:18px">Testversie – nog niet verspreiden. · <a href="privacy.html" style="color:inherit">Privacy</a> · versie <span id="versie">c51dce3168</span></p>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var NAMEN = { hoofdtrainer: 'hoofdtrainer', trainer: 'trainer', sporter: 'sporter' };
  function tekst(el, t, fout) { el.textContent = t; el.className = fout ? 'fout' : ''; }
  function toon(aan) { $('uit').hidden = aan; $('in').hidden = !aan; }
  function laad() {
    toon(true); tekst($('wie'), 'Even geduld…'); $('rollen').textContent = '';
    KKYKC.api('wieBenIk').then(function (r) {
      var d = r.data;
      tekst($('wie'), 'Je bent ' + (d.naam || d.email) + (d.naam ? ' (' + d.email + ')' : '') + '.');
      var el = $('rollen'); el.textContent = '';
      if (!d.rollen.length) el.textContent = 'Nog geen rol gekoppeld aan dit account.';
      else { el.appendChild(document.createTextNode('Rol: ')); d.rollen.forEach(function (x) { var s = document.createElement('span'); s.className = 'chip'; s.textContent = NAMEN[x] || x; el.appendChild(s); }); }
      /* B3: Mijn trainingen enkel met een Koppeling (rol sporter), ook voor hoofdtrainers · Trainersportaal: trainers en hoofdtrainers ·
         Dashboard en Planner: enkel hoofdtrainers. De API controleert dit bij elke aanroep opnieuw. */
      /* B5: geen rol → eigen aanvraagstatus en toegang aanvragen als trainer (een hoofdtrainer keurt goed in Toegangsbeheer) */
      $('aanvraag').hidden = d.rollen.length > 0; if (!d.rollen.length) aanvraagToon();
      /* B3c: na het aanmelden meteen naar de startpagina van je rol (Mijn trainingen → dashboard → trainersportaal). Via 'Account' (?blijf=1) blijf je hier. */
      KKYKC.zetRollen(d.rollen);
      var start = KKYKC.startpagina(d.rollen); if (start && !/[?&]blijf=1/.test(location.search)) { location.replace(start); return; }
      KKYKC.balk();
    }, function (e) {
      if (e.code === 'token' || e.code === 'verlopen' || e.code === 'aud') { toon(false); $('knop').textContent = ''; KKYKC.knop($('knop')); tekst($('melding'), e.message, true); }
    });
  }
  var STATUS = { open: 'Je aanvraag is ontvangen. Een hoofdtrainer keurt ze goed of af; kom later terug.', afgewezen: 'Je aanvraag werd niet goedgekeurd. Contacteer een hoofdtrainer.' };
  function aanvraagToon() {
    $('aanvraagForm').hidden = true; tekst($('aanvraagTekst'), 'Even geduld…');
    KKYKC.api('mijnToegang').then(function (r) {
      var s = r.data.status; tekst($('aanvraagTekst'), STATUS[s] || 'Ben je trainer bij KKYKC? Vraag hier toegang aan tot het trainersportaal.'); $('aanvraagForm').hidden = !!STATUS[s];
    }, function (e) { tekst($('aanvraagTekst'), e.message, true); });
  }
  $('aanvraagKnop').onclick = function () {
    var b = $('aanvraagKnop'); b.disabled = true;
    KKYKC.api('vraagToegang', [$('aanvraagNaam').value]).then(function () { b.disabled = false; aanvraagToon(); }, function (e) { b.disabled = false; tekst($('aanvraagTekst'), e.message, true); });
  };
  if (!KKYKC.ingesteld()) { tekst($('uit').firstElementChild, 'De app is nog niet ingesteld (client-ID of API-adres ontbreekt).', true); return; }
  KKYKC.opAanmelden(function () { $('melding').textContent = ''; laad(); });
  $('afmelden').onclick = function () { KKYKC.afmelden(); toon(false); $('knop').textContent = ''; KKYKC.knop($('knop')); };
  if (KKYKC.aangemeld()) laad(); else KKYKC.knop($('knop'));
})();
</script>
</body>
</html>
