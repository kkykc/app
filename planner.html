<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="api.js"></script>
<title>KKYKC Planner</title>
<style>
:root{--or:#C96008;--or-ink:#9A4700;--geel:#FDE68A;--licht:#FFF3E0;--bg:#FFFFFF;--panel:#FFFBF6;--fg:#1C1712;--muted:#6E6257;--line:#E8DDD0;
  --ok:#2F7D3B;--ok-bg:#DCEFDD;--warn:#9A6A00;--warn-bg:#FCEBB6;--bad:#A32A1E;--bad-bg:#F8D7D2;--grijs-bg:#EEE8E1;--info:#2B5C8A;--info-bg:#DCE9F5;
  --z0:#B9B2AA;--z1:#7FB77E;--z2:#E3C14B;--z3:#E8893A;--z4:#D2483C;--z5:#8E2A6B;
  --font:Arial,"Helvetica Neue",Helvetica,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130F;--panel:#211B15;--fg:#F3ECE4;--muted:#B2A595;--line:#3A3027;--licht:#2A2018;
  --ok:#7FCB8A;--ok-bg:#1F3A24;--warn:#E9C25A;--warn-bg:#3D3112;--bad:#F08A7E;--bad-bg:#47201B;--grijs-bg:#2C2620;--or-ink:#F0A060;--info:#8DB8E2;--info-bg:#1C2C3C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130F;--panel:#211B15;--fg:#F3ECE4;--muted:#B2A595;--line:#3A3027;--licht:#2A2018;
  --ok:#7FCB8A;--ok-bg:#1F3A24;--warn:#E9C25A;--warn-bg:#3D3112;--bad:#F08A7E;--bad-bg:#47201B;--grijs-bg:#2C2620;--or-ink:#F0A060;--info:#8DB8E2;--info-bg:#1C2C3C;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4}
.band{background:var(--or);color:#fff}
.band-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.logo{height:44px;width:auto}.titel{flex:1;min-width:0}
.eyebrow{color:var(--geel);font-weight:bold;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.titel h1{margin:2px 0;font-size:20px}.wie{font-size:12px;opacity:.9}
.band-in .tknop+.tknop{margin-left:-6px}
.tknop{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.7);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.wrap{max-width:1400px;margin:0 auto;padding:10px 16px 60px}
button,select,textarea,input{font:inherit;color:inherit}
.btn{border:1px solid var(--or);background:var(--or);color:#fff;border-radius:8px;padding:8px 13px;cursor:pointer;min-height:38px}
.btn.rand{background:transparent;color:var(--or-ink)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.klein{padding:5px 9px;min-height:30px;font-size:13px}.btn.gevaar{background:var(--bad);border-color:var(--bad)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.bar select{padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.weekkop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 4px}
.weekkop h2{margin:0;font-size:18px}
.pil{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:bold;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-grijs{background:var(--grijs-bg);color:var(--muted)}.p-info{background:var(--info-bg);color:var(--info)}
.melding{padding:9px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);margin:8px 0}.melding.fout{background:var(--bad-bg);color:var(--bad)}
.melding.ok{background:var(--ok-bg);color:var(--ok)}.melding.info{background:var(--info-bg);color:var(--info)}
.groepknop{display:flex;gap:4px}.groepknop button{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:5px 13px;cursor:pointer}
.groepknop button[aria-pressed="true"]{background:var(--or);color:#fff;border-color:var(--or)}
.indeling{display:grid;grid-template-columns:1fr;gap:14px}
.indeling.metbib{grid-template-columns:minmax(0,1fr) 340px}
.groep{border:1px solid var(--line);border-radius:12px;margin:12px 0;background:var(--bg)}
.groep>header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);border-radius:12px 12px 0 0}
.groep>header h3{margin:0;font-size:16px}
.tot{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted)}.tot b{color:var(--fg)}
.zbalk{display:flex;height:10px;width:160px;border-radius:5px;overflow:hidden;background:var(--grijs-bg)}
.zbalk span{display:block;height:100%}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0}
.dag{border-right:1px solid var(--line);min-height:120px;padding:6px}.dag:last-child{border-right:0}
.dag.bevr{background:repeating-linear-gradient(45deg,transparent,transparent 8px,var(--grijs-bg) 8px,var(--grijs-bg) 9px)}
.dag.vandaag .dagkop{color:var(--or-ink)}
.dagkop{font-weight:bold;font-size:13px;margin-bottom:4px;display:flex;justify-content:space-between;gap:4px}
.dagkop .kal{font-weight:normal;font-size:11px;color:var(--info);text-align:right}
.slot{border:1px dashed transparent;border-radius:8px;padding:3px;margin:3px 0;min-height:34px}
.slot.drop{border-color:var(--or);background:var(--licht)}
.slotlabel{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.sjab{font-size:11.5px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:4px 6px;cursor:pointer;background:transparent;width:100%;text-align:left}
.sjab:hover{border-color:var(--or)}
.plus{border:0;background:transparent;color:var(--or-ink);cursor:pointer;font-size:15px;line-height:1;padding:0 4px}
.kaart{border:1px solid var(--line);border-left:5px solid var(--z1);background:var(--panel);border-radius:8px;padding:5px 7px;margin:3px 0;cursor:pointer;font-size:12.5px}
.kaart:hover{border-color:var(--or)}.kaart.concept{border-style:dashed;opacity:.92}.kaart.telt-niet{opacity:.55}
.kaart .inh{margin:3px 0;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.kaart .m{color:var(--muted);font-size:11.5px}
.doelchip{display:inline-block;padding:0 7px;border-radius:9px;font-size:11px;font-weight:bold;color:#222;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.ow{font-size:12px;color:var(--muted);cursor:pointer;border:1px dashed var(--line);border-radius:8px;padding:4px 8px;max-width:100%;text-align:left;background:transparent}
.eval{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:12px 0;background:var(--panel)}
.eval h3{margin:0 0 6px;font-size:15px}.eval ul{margin:0;padding-left:18px}.eval li{margin:3px 0;font-size:13.5px}
.bib{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
.bib h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.bib input,.bib select{width:100%;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:3px 0}
.bibitem{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:6px 0;background:var(--bg);font-size:12.5px;cursor:grab}
.bibitem .acties{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:18px 10px;z-index:50;overflow:auto}
.dlg{background:var(--bg);border:1px solid var(--line);border-top:4px solid var(--or);border-radius:10px;max-width:860px;width:100%;padding:12px 16px}
.dlg.smal{max-width:520px}
.dlg h2{margin:0 0 6px;font-size:17px}.dlg label{display:block;font-weight:bold;font-size:12.5px;margin:8px 0 3px}
.dlg input[type=text],.dlg input[type=number],.dlg input[type=date],.dlg select,.dlg textarea{width:100%;padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.dlg textarea{min-height:56px;resize:vertical}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.r4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.set{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:8px 0;background:var(--panel)}
.set .kop{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.set .kop label{margin:0}.set .kop input[type=number]{width:70px}
.deel{display:grid;grid-template-columns:62px 62px 88px 34px;gap:6px;align-items:center;margin:3px 0}
.deel input,.deel select,.tijd input,.tijd select{padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:100%}
.tijd{display:grid;grid-template-columns:62px 62px 88px;gap:6px;align-items:center}
.klein:not(.btn){font-size:12px;color:var(--muted)}
.prev{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:10px 0;background:var(--licht)}
/* F5a: voorstel (generator) */
.dlg.breed{max-width:980px;width:96vw}
.vs-week{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:10px 0}
.vs-week h3{margin:0 0 6px;font-size:15px}
.vs-g{margin:6px 0 2px;font-weight:bold}
.vs-tab{width:100%;border-collapse:collapse;font-size:13px}
.vs-tab td{border-top:1px solid var(--line);padding:4px 6px;vertical-align:top}
.vs-tab td.u{color:var(--muted,#666)}
.vs-mel li{margin:2px 0}
.kaart .uitl{font-size:11px;opacity:.8;margin-top:2px}
@media (max-width:600px){.vs-tab td:nth-child(4){display:none}}
.prev .tekst{font-weight:bold;word-break:break-word}
.knoppen{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:flex-end}
.fout{color:var(--bad);font-weight:bold}
.leeg{padding:30px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:80;font-size:14px}
#print{display:none}
body.jaarmodus .alleenweek{display:none!important}
.chk{display:flex!important;gap:6px;align-items:center;font-weight:normal!important;font-size:13.5px!important;margin:4px 0!important}
.jtab{width:100%;border-collapse:collapse;font-size:12.5px}
.jtab th,.jtab td{border-bottom:1px solid var(--line);padding:3px 5px;text-align:left;vertical-align:middle}
.jtab th{position:sticky;top:0;background:var(--panel);z-index:1;font-size:11.5px;color:var(--muted)}
.jtab td.n{text-align:right;white-space:nowrap}
.jtab select,.jtab input{padding:3px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:12.5px;width:100%}
.jtab input:disabled,.jtab select:disabled{border-color:transparent;background:transparent;opacity:1;color:var(--fg)}
.jtab tr.vuil td{background:var(--licht)}.jtab tr.nu td{box-shadow:inset 0 2px 0 var(--or)}
.jtab .wk{border:0;background:transparent;color:var(--or-ink);font-weight:bold;cursor:pointer;padding:0}
.kchip{display:inline-block;border:1px solid var(--line);border-radius:9px;padding:0 6px;margin:1px 2px 1px 0;font-size:11px;cursor:pointer;background:var(--panel);white-space:nowrap}
.kchip.wedstrijd{border-color:var(--info);color:var(--info)}.kchip.test{border-color:var(--ok);color:var(--ok)}.kchip.clubactiviteit{border-color:var(--or);color:var(--or-ink)}
.kchip.afdrukopmerking{border-style:dashed}
.jblok{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:12px 0;background:var(--bg)}
.jblok h3{margin:0 0 6px;font-size:15px}
.jgraf{width:100%;height:auto;display:block}
.jscroll{max-height:70vh;overflow:auto}
.let{border:2px solid #C96008;border-radius:2mm;padding:1.5mm 3mm;margin:0 0 3mm;font-weight:bold}
@media (max-width:1100px){.indeling.metbib{grid-template-columns:1fr}.bib{position:static;max-height:none}}
@media (max-width:760px){.jtab .opt{display:none}.week{grid-template-columns:1fr}.dag{border-right:0;border-bottom:1px solid var(--line);min-height:0}.r4{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr}
  .titel h1{font-size:18px}.logo{height:36px}.zbalk{width:110px}.kaart .inh{-webkit-line-clamp:6}}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;color:#000;font-size:10.5pt}
  .band,.wrap,.ovl,.toast{display:none!important}
  #print{display:block}
  .pblad{page-break-after:always;break-after:page}
  .pblad:last-child{page-break-after:auto;break-after:auto}
  .pblad h1{font-size:14pt;margin:0 0 2mm}.pblad .sub{font-size:9.5pt;margin-bottom:3mm}
  .pblad table{width:100%;border-collapse:collapse}
  .pblad th,.pblad td{border:1px solid #888;padding:1.2mm 2mm;vertical-align:top;font-size:9.5pt}
  .pblad th{background:#C96008;color:#fff;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pblad .doelchip{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pblad .leg{margin-top:3mm;font-size:8.5pt}.pblad .leg div{margin:.6mm 0}
}
</style></head>

/* ===================== KKYKC – gedeelde rekenkern (reken.js) =====================
   Eén bron voor: zoneminuten uit de setbouwer (sets_json), auto-tekst (kolom Q/C), doel automatisch (KX), km, duur, TSS en verwachte RPE.
   Gebruikt door Planning.gs (Apps Script, via bouw_reken.py als Reken.gs), de regressietest in node en (vanaf F2) de planner-pagina.
   Regels: geen dubbele slash buiten commentaarblokken, geen backslash-aanhalingsteken (HtmlService). Versie F1 – 14/11/2026.
   Bronformules (Schema 2026, geverifieerd op W47): D10 (zones), KL:KS (herhaalfactor), KD:KK (tekst per set), Q10, C10, C8, KX (Doelen.gs). */
var RK = (function () {
  'use strict';
  var ZONES = ['T0', 'T1', 'T2', 'T3', 'T4', 'TMAX'];
  var VERSIE = 'r1';

  /* ---------- waarden zoals de spreadsheet ze ziet ---------- */
  /* getal(): rekenen met + (leeg = 0, numerieke tekst telt mee, andere tekst = 0) */
  function getal(v) {
    if (v === null || v === undefined || v === '') return 0;
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    if (typeof v === 'boolean') return v ? 1 : 0;
    var s = String(v).trim().replace(',', '.');
    if (s === '') return 0;
    var x = Number(s);
    return isFinite(x) ? x : 0;
  }
  /* N(): enkel echte getallen (tekst = 0) */
  function N(v) { return typeof v === 'number' && isFinite(v) ? v : (v === true ? 1 : 0); }
  function isJa(v) { return String(v === null || v === undefined ? '' : v).trim().toLowerCase() === 'ja'; }
  function zoneGelijk(a, b) { return a !== null && a !== undefined && a !== '' && String(a).toLowerCase() === String(b).toLowerCase(); }
  /* getal als tekst zoals in een formule (max. 15 beduidende cijfers) */
  function numTekst(x) { var y = Number(Number(x).toPrecision(15)); return String(y); }
  /* TRIM van Sheets: spaties vooraan/achteraan weg en herhaalde spaties samen */
  function trimSheets(s) { return String(s).replace(/ {2,}/g, ' ').replace(/^ +| +$/g, ''); }

  /* ---------- sets_json ---------- */
  /* vorm: { invaren:{min,sec}, uitvaren:{min,sec}, sets:[{ herhaal, koppel, aantal, delen:[{min,sec,zone}], rust_tussen:{min,sec,zone}, rust_na:{min,sec,zone} }] }

  function leeg_(o) { return !o || (!getal(o.min) && !getal(o.sec) && !o.zone); }
  function tijdMin_(o) { return o ? getal(o.min) + getal(o.sec) / 60 : 0; }
  function tijdSec_(o) { return o ? getal(o.min) * 60 + getal(o.sec) : 0; }

  /* herhaalfactor per set (KL:KS): F1 = max(1, herhaal1); Fk = F(k-1) als koppel = ja, anders max(1, herhaalk) */
  function factoren(sj) {
    var sets = (sj && sj.sets) || [], F = [];
    for (var k = 0; k < sets.length; k++) {
      var s = sets[k] || {};
      F.push(k > 0 && s.koppel ? F[k - 1] : Math.max(1, N(s.herhaal)));
    }
    return F;
  }

  /* zoneminuten (D:I) van één rij, zonder de opwarming. Zelfde volgorde van optellen als de formule. */
  function zoneMin(sj) {
    sj = sj || {};
    var sets = sj.sets || [], F = factoren(sj), uit = [];
    var inv = getal((sj.invaren || {}).min) + getal((sj.invaren || {}).sec) / 60 + getal((sj.uitvaren || {}).min) + getal((sj.uitvaren || {}).sec) / 60;
    for (var zi = 0; zi < ZONES.length; zi++) {
      var z = ZONES[zi], tot = inv * (z === 'T0' ? 1 : 0);
      for (var k = 0; k < sets.length; k++) {
        var s = sets[k] || {}, n = N(s.aantal), delen = s.delen || [], som = 0;
        for (var p = 0; p < delen.length; p++) som += tijdMin_(delen[p]) * (zoneGelijk(delen[p] && delen[p].zone, z) ? 1 : 0);
        var rt = s.rust_tussen || {}, rn = s.rust_na || {};
        tot += F[k] * (n * som + tijdMin_(rt) * Math.max(0, n - 1) * (zoneGelijk(rt.zone, z) ? 1 : 0) + tijdMin_(rn) * (zoneGelijk(rn.zone, z) ? 1 : 0));
      }
      uit.push(tot);
    }
    return uit;
  }

  /* ---------- tekst ---------- */
  /* tijd in seconden -> 45"  3'  1'30"  (zoals de formule) */
  function tijdTekst(t) {
    if (t < 60) return numTekst(t) + '"';
    var m = Math.floor(t / 60), r = t - 60 * m;
    if (r === 0) return m + "'";
    var rr = Math.round(r);
    return m + "'" + (rr < 10 ? '0' : '') + rr + '"';
  }
  /* tekst van set k (KD:KK) */
  function setTekst(sj, k, F) {
    var sets = sj.sets || [], s = sets[k] || {}, n = N(s.aantal), delen = s.delen || [];
    var stukken = [];
    for (var p = 0; p < delen.length; p++) {
      var t = tijdSec_(delen[p]);
      if (t > 0) stukken.push(tijdTekst(t) + ' ' + (delen[p].zone == null ? '' : String(delen[p].zone)));
    }
    if (n === 0 || stukken.length === 0) return '';
    var volgende = sets[k + 1] || {}, laatste = k === 7;
    var tekst = '';
    if (F[k] > 1 && !s.koppel) tekst += numTekst(F[k]) + 'x (';
    if (n > 1) tekst += numTekst(n) + 'x (';
    tekst += stukken.join(' + ');
    if (n > 1) tekst += ')';
    var rt = s.rust_tussen || {}, trt = tijdSec_(rt);
    if (trt > 0 && n > 1) tekst += ' met ' + tijdTekst(trt) + ' ' + (rt.zone == null ? '' : String(rt.zone)) + ' tussen';
    var rn = s.rust_na || {}, trn = tijdSec_(rn);
    if (trn > 0) tekst += ' + ' + tijdTekst(trn) + ' ' + (rn.zone == null ? '' : String(rn.zone));
    /* set 8 sluit altijd (in het blad staat TRUE i.p.v. de koppel van set 9); daarna: sluiten als de volgende set niet gekoppeld is */
    if (F[k] > 1 && (laatste || !volgende.koppel)) tekst += ')';
    return tekst;
  }
  /* auto-tekst (kolom Q): invaren + opwarming + sets + uitvaren */
  function autoTekst(sj, opwarming) {
    sj = sj || {};
    var F = factoren(sj), delen = [], ti = tijdSec_(sj.invaren), tu = tijdSec_(sj.uitvaren);
    if (ti > 0) delen.push(tijdTekst(ti) + ' invaren');
    if (opwarming) delen.push('opwarming');
    for (var k = 0; k < (sj.sets || []).length; k++) { var t = setTekst(sj, k, F); if (t !== '') delen.push(t); }
    if (tu > 0) delen.push(tijdTekst(tu) + ' uitvaren');
    return delen.join(' + ');
  }
  /* inhoud (kolom C): auto-tekst | extra tekst (KA), getrimd zoals TRIM() */
  function inhoud(q, extra) {
    q = q || ''; extra = extra || '';
    if (q === '' && extra === '') return '';
    return trimSheets(q + (q !== '' && extra !== '' ? ' | ' : '') + extra);
  }
  /* inhoud van de opwarmingsrij (C8/C26): + ' (= 11'40")' met de totale duur */
  function inhoudOpwarming(q, extra, totMin) {
    var c = inhoud(q, extra);
    if (c === '') return '';
    var sec = Math.round(totMin * 60);
    return totMin > 0 ? c + ' (= ' + tijdTekst(sec) + ')' : c;
  }

  /* ---------- doel automatisch (KX, Doelen.gs) ---------- */
  var DREMPELS_STD = { DOEL_T3_MIN: 5, DOEL_T2_MIN: 8, DOEL_SNEL_MIN: 1.5, DOEL_OU_T2_MIN: 6, DOEL_OU_T3_MIN: 4 };
  var LANDDOEL = { 'kracht zaal': 'Kracht', 'core-stability': 'Core & stabiliteit', 'core': 'Core & stabiliteit', 'loop tempo': 'Tempo', 'loop rustig': 'Alternatieve duur', 'fietsen': 'Alternatieve duur' };
  /* o = { keuze, inh (kolom C), z (zoneminuten van de rij zonder opwarming), lm (KT), lt (KU), groep } */
  function doelAuto(o, dr) {
    dr = dr || DREMPELS_STD;
    var d = function (k) { return dr[k] === undefined || dr[k] === null || dr[k] === '' ? DREMPELS_STD[k] : Number(dr[k]); };
    var keuze = String(o.keuze || '');
    if (keuze !== '') return keuze;
    var C = String(o.inh || ''), L = C.toLowerCase();
    var t = function (re) { return re.test(L); };
    if (o.groep === 'C') {
      if (C === '' || t(/^geen training|^rust$/)) return '';
      if (t(/km-test|m-test/)) return 'Test';
      if (t(/wedstrijd/)) return 'Wedstrijd';
      if (t(/leie|toer/)) return 'Aerobe basis';
      if (t(/met rem/)) return 'Krachtuithouding (rem)';
      if (t(/over-under|over\/under|overunder/)) return 'Over-under';
      if (t(/racetempo|race pace|verzuring/)) return 'Racetempo';
      if (t(/startladder|starts/)) return 'Starts & techniek';
      if (t(/techniek/)) return 'Starts & techniek';
      if (t(/herstel|recuperatie/)) return 'Herstel';
      return '';
    }
    var z = o.z || [0, 0, 0, 0, 0, 0], som = z[0] + z[1] + z[2] + z[3] + z[4] + z[5];
    if (t(/^geen training|^rust$/) || (som === 0 && N(o.lm) === 0 && C === '')) return '';
    if (t(/km-test|m-test/)) return 'Test';
    if (t(/wedstrijd/)) return 'Wedstrijd';
    if (t(/leie|toer/)) return 'Aerobe basis';
    if (t(/met rem/)) return 'Krachtuithouding (rem)';
    if (t(/over-under|over\/under|overunder/) || (z[2] >= d('DOEL_OU_T2_MIN') && z[3] >= d('DOEL_OU_T3_MIN') && /T2 \+ [^()]*T3|T3 \+ [^()]*T2/.test(C))) return 'Over-under';
    if (t(/racetempo|race pace|verzuring/)) return 'Racetempo';
    if (t(/startladder|starts/)) return 'Starts & techniek';
    if (som === 0) return LANDDOEL[String(o.lt || '').toLowerCase()] || '';
    if (z[3] >= d('DOEL_T3_MIN')) return 'VO2max';
    if (z[2] >= d('DOEL_T2_MIN')) return 'Tempo';
    if (z[4] + z[5] >= d('DOEL_SNEL_MIN')) return 'Snelheid';
    if (t(/techniek/)) return 'Starts & techniek';
    if (t(/herstel|recuperatie/)) return 'Herstel';
    return 'Aerobe basis';
  }

  /* ---------- km, belasting, TSS ---------- */
  var SNELHEID_STD = { T0: 7, T1: 10.5, T2: 12, T3: 13, T4: 14, TMAX: 16 };
  function km(z, snelheid) {
    snelheid = snelheid || SNELHEID_STD;
    var s = 0; for (var i = 0; i < ZONES.length; i++) s += (z[i] || 0) * snelheid[ZONES[i]] / 60;
    return s;
  }
  /* oude AU-belasting (enkel nog voor het veld 'load' van het plan-object; de planner rekent in TSS) */
  function belastingAU(z, lm, lt, weging, landweging, kv) {
    var w = 0; for (var i = 0; i < ZONES.length; i++) w += (z[i] || 0) * (ZONES[i] in (weging || {}) ? weging[ZONES[i]] : 1);
    var l = kv !== null && kv !== undefined ? kv : (lm || 0) * (lt in (landweging || {}) ? landweging[lt] : 1);
    return w + l;
  }
  var TSS_STD = {
    rpe_per_uur: { '0': 0, '1': 20, '2': 30, '3': 40, '4': 50, '5': 60, '6': 70, '7': 80, '8': 100, '9': 120, '10': 140 },
    zone_rpe: { T0: 1, T1: 2.5, T2: 5, T3: 6, T4: 7.5, TMAX: 9 },
    land_rpe: { 'Loop rustig': 3, 'Loop tempo': 6, 'Fietsen': 2.5, 'Core-stability': 3, 'Kracht zaal': 5, 'Overig': 3 },
    rem_rpe: 1.0, rem_zones: ['T1', 'T2', 'T3', 'T4', 'TMAX']
  };
  function tssCfg_(t) { var o = {}, k; for (k in TSS_STD) o[k] = TSS_STD[k]; for (k in (t || {})) o[k] = t[k]; return o; }
  function tssUur(rpe, t) {
    var tab = tssCfg_(t).rpe_per_uur, r = Math.max(0, Math.min(10, rpe)), a = Math.floor(r), b = Math.min(10, a + 1);
    return tab[a] + (tab[b] - tab[a]) * (r - a);
  }
  function rpeVanTssUur(x, t) {
    var tab = tssCfg_(t).rpe_per_uur;
    for (var r = 0; r < 10; r++) if (x <= tab[r + 1]) return r + (x - tab[r]) / ((tab[r + 1] - tab[r]) || 1);
    return 10;
  }
  function metRem(inh, ext) { return /\bmet\s+rem\b/i.test((inh || '') + ' ' + (ext || '')); }
  /* zelfde als planTss() in het dashboard: z = zoneminuten mét opwarming */
  function tss(p, t) {
    var c = tssCfg_(t), rem = metRem(p.inh, p.ext) ? (c.rem_rpe || 0) : 0, s = 0;
    for (var i = 0; i < ZONES.length; i++) {
      var z = ZONES[i], r = (c.zone_rpe[z] !== undefined ? c.zone_rpe[z] : 3) + ((c.rem_zones || []).indexOf(z) >= 0 ? rem : 0);
      s += ((p.z && p.z[i]) || 0) / 60 * tssUur(r, t);
    }
    if (p.lm) { var lr = c.land_rpe[p.lt]; if (lr === undefined) lr = c.land_rpe.Overig !== undefined ? c.land_rpe.Overig : 3; s += p.lm / 60 * tssUur(lr, t); }
    return s;
  }
  function rpeVerwacht(p, t) { return p.duur > 0 && p.cat !== 'overig' ? rpeVanTssUur(tss(p, t) / (p.duur / 60), t) : null; }

  /* ---------- setbouwer lezen (blad -> sets_json) ----------
     get(kolomletters) geeft de ruwe celwaarde van de rij. Kolommen: R:S invaren · U + 33 per set (8 sets) · JY:JZ uitvaren. */
  var SET_START = ['U', 'BB', 'CI', 'DP', 'EW', 'GD', 'HK', 'IR'];
  function kolNr(l) { var n = 0; for (var i = 0; i < l.length; i++) n = n * 26 + l.charCodeAt(i) - 64; return n; }
  function kolLetter(n) { var s = ''; while (n > 0) { var r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; }
  function cel_(v) { return v === undefined ? null : v; }
  function tijdUit_(get, cMin, cSec, cZone) {
    var o = { min: getal(get(kolLetter(cMin))), sec: getal(get(kolLetter(cSec))) };
    if (cZone) { var z = get(kolLetter(cZone)); o.zone = z === null || z === undefined ? '' : String(z); }
    return o;
  }
  function leesSetbouwer(get) {
    var sj = { invaren: tijdUit_(get, kolNr('R'), kolNr('S')), uitvaren: tijdUit_(get, kolNr('JY'), kolNr('JZ')), sets: [] };
    for (var k = 0; k < SET_START.length; k++) {
      var c0 = kolNr(SET_START[k]), s = { herhaal: N(cel_(get(kolLetter(c0)))), koppel: isJa(get(kolLetter(c0 + 1))), aantal: N(cel_(get(kolLetter(c0 + 2)))), delen: [] };
      for (var p = 0; p < 8; p++) s.delen.push(tijdUit_(get, c0 + 3 + 3 * p, c0 + 4 + 3 * p, c0 + 5 + 3 * p));
      s.rust_tussen = tijdUit_(get, c0 + 27, c0 + 28, c0 + 29);
      s.rust_na = tijdUit_(get, c0 + 30, c0 + 31, c0 + 32);
      /* ruwe tekst-aantal bewaren voor de waarschuwing (N() = 0, maar de trainer bedoelde iets) */
      var ruw = get(kolLetter(c0 + 2)); if (typeof ruw === 'string' && ruw.trim() !== '') s.aantal_tekst = ruw;
      sj.sets.push(s);
    }
    return compact(sj);
  }
  /* lege delen achteraan en lege sets achteraan weglaten (posities binnenin blijven) */
  function compact(sj) {
    var o = { invaren: { min: getal((sj.invaren || {}).min), sec: getal((sj.invaren || {}).sec) }, uitvaren: { min: getal((sj.uitvaren || {}).min), sec: getal((sj.uitvaren || {}).sec) }, sets: [] };
    var sets = (sj.sets || []).map(function (s) {
      s = s || {};
      var d = (s.delen || []).map(function (x) { return { min: getal(x && x.min), sec: getal(x && x.sec), zone: (x && x.zone) ? String(x.zone) : '' }; });
      while (d.length && leeg_(d[d.length - 1])) d.pop();
      var r = { herhaal: N(s.herhaal), koppel: !!s.koppel, aantal: N(s.aantal), delen: d };
      var rt = s.rust_tussen || {}, rn = s.rust_na || {};
      if (!leeg_(rt)) r.rust_tussen = { min: getal(rt.min), sec: getal(rt.sec), zone: rt.zone ? String(rt.zone) : '' };
      if (!leeg_(rn)) r.rust_na = { min: getal(rn.min), sec: getal(rn.sec), zone: rn.zone ? String(rn.zone) : '' };
      if (s.aantal_tekst) r.aantal_tekst = String(s.aantal_tekst);
      return r;
    });
    var isLeeg = function (s) { return !s.herhaal && !s.koppel && !s.aantal && !s.delen.length && !s.rust_tussen && !s.rust_na && !s.aantal_tekst; };
    while (sets.length && isLeeg(sets[sets.length - 1])) sets.pop();

    return o;
  }
  function isLeegSj(sj) { var c = compact(sj || {}); return !c.sets.length && !tijdSec_(c.invaren) && !tijdSec_(c.uitvaren); }

  /* waarschuwingen bij het bouwen van een sessie (eigenaardigheden van de setbouwer, voor de planner) */
  function waarschuwingen(sj) {
    var w = [], sets = (sj && sj.sets) || [];
    sets.forEach(function (s, k) {
      var heeftDelen = (s.delen || []).some(function (d) { return tijdSec_(d) > 0; });
      if (N(s.aantal) === 0 && s.rust_na && tijdSec_(s.rust_na) > 0) w.push('Set ' + (k + 1) + ': aantal 0, maar de rust na telt mee (' + tijdTekst(tijdSec_(s.rust_na)) + ').');
      if (N(s.aantal) === 0 && heeftDelen) w.push('Set ' + (k + 1) + ': delen ingevuld maar aantal leeg of 0 – de set telt niet mee.');
      if (s.aantal_tekst) w.push('Set ' + (k + 1) + ': aantal "' + s.aantal_tekst + '" is tekst, geen getal.');
      (s.delen || []).forEach(function (d, p) { if (tijdSec_(d) > 0 && ZONES.indexOf(String(d.zone || '').toUpperCase()) < 0) w.push('Set ' + (k + 1) + ', deel ' + (p + 1) + ': geen geldige zone.'); });
      if (k === 0 && s.koppel) w.push('Set 1 kan niet gekoppeld worden.');

    return w;
  }

  return {
    VERSIE: VERSIE, ZONES: ZONES, getal: getal, N: N, factoren: factoren, zoneMin: zoneMin, tijdTekst: tijdTekst, setTekst: setTekst,
    autoTekst: autoTekst, inhoud: inhoud, inhoudOpwarming: inhoudOpwarming, trimSheets: trimSheets, doelAuto: doelAuto,
    DREMPELS_STD: DREMPELS_STD, SNELHEID_STD: SNELHEID_STD, TSS_STD: TSS_STD, km: km, belastingAU: belastingAU,
    tssUur: tssUur, rpeVanTssUur: rpeVanTssUur, metRem: metRem, tss: tss, rpeVerwacht: rpeVerwacht,
    leesSetbouwer: leesSetbouwer, compact: compact, isLeegSj: isLeegSj, waarschuwingen: waarschuwingen, kolNr: kolNr, kolLetter: kolLetter
  };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = RK;

</script>

const PAGINA_WIE = "";   /* KKYKC-app */

const PAGINA_START = (function () { var q = new URLSearchParams(location.search), g = function (k, re) { var v = q.get(k) || ""; return re.test(v) ? v : ""; };   /* KKYKC-app: zoals plannerStart_ */
  var t = [g("jaar", /^\d{4}$/), g("week", /^\d{1,2}$/), g("groep", /^[ABC]$/), g("sessie", /^[A-Za-z0-9_-]{1,60}$/)]; return t.length === 4 ? { jaar: Number(t[0]) || null, week: Number(t[1]) || null, groep: t[2], sessie: t[3] } : {}; })();

  Z3:{ernst:"laag", oms:"Aandeel T3+ van de zonetijd hoger dan het maximum van de fase"},
  B1:{ernst:"laag", waarde:15, oms:"Geplande TSS week-op-week (% stijging)"},
  B3:{ernst:"middel", waarde:1.5, oms:"Geplande ACWR te hoog"},

function evRegel(id){ const m = (S.inst.regels || {})[id] || {}, s = EV_STD[id] || {}; return { aan: m.aan !== false, waarde: m.waarde != null ? m.waarde : s.waarde, ernst: m.ernst || s.ernst, oms: m.omschrijving || s.oms }; }

  const kand = [w.fase_analyse, w.fase].filter(Boolean).map(f => /^p-\d+$/i.test(f) ? "P-n" : /^piek/i.test(f) ? "Piek" : f);

  return null;
}
function evalueer(lijst){

  (S.d.kalender || []).forEach(k => { if (/wedstrijd|test/i.test(k.soort + " " + k.type)) for (let n = dnIso(k.van); n <= dnIso(k.tot); n++) evDag.add(isoDn(n)); });

    ss.forEach(s => {

      if (b.doel === "Test" || b.doel === "Wedstrijd") evDag.add(s.datum);
      RK.waarschuwingen(b.sets).forEach(t => add("SB", plaats + ": " + t, "laag", s.id));
      if (act("S5")) (b.sets.sets || []).forEach((st, k) => { const dl = (st.delen || []).filter(x => x && (Number(x.min) || Number(x.sec))); if (dl.length >= 2 && st.aantal > 1 && dl[0].zone && dl[0].zone === dl[1].zone && dl[0].zone !== "T0") add("S5", plaats + `: set ${k+1} werk en rust beide in ${dl[0].zone}.`, null, s.id); });
      if (act("Z1") && b.doel !== "Test"){ const gr = Number(evRegel("Z1").waarde) || 45; (b.sets.sets || []).forEach((st, k) => (st.delen || []).forEach(x => { const sec = (Number(x.min) || 0) * 60 + (Number(x.sec) || 0); if (String(x.zone).toUpperCase() === "T4" && sec > gr) add("Z1", plaats + `: T4-blok van ${RK.tijdTekst(sec)} in set ${k+1} (> ${gr} s).`, null, s.id); })); }

}

function confirmInline(knop, tekst){ if (knop.dataset.zeker === "1") return true; knop.dataset.zeker = "1"; const oud = knop.textContent; knop.textContent = tekst; setTimeout(() => { knop.dataset.zeker = ""; knop.textContent = oud; }, 4000); return false; }

/* ---------------- schalen (kopie naar een andere groep: herhalingen/duur kleiner, intensiteit gelijk) ---------------- */
function schaal(x, f){
  x = JSON.parse(JSON.stringify(x || {})); if (f === 1 || !x.sets) return x;
  const r5 = s => Math.max(5, Math.round(s / 5) * 5);
  x.sets.forEach(st => {
    if (st.aantal >= 2) st.aantal = Math.max(1, Math.round(st.aantal * f));
    else if (st.herhaal >= 2 && !st.koppel) st.herhaal = Math.max(1, Math.round(st.herhaal * f));
    else (st.delen || []).forEach(d => { if (/^T[01]$/i.test(d.zone)){ const sec = r5(((Number(d.min) || 0) * 60 + (Number(d.sec) || 0)) * f); d.min = Math.floor(sec / 60); d.sec = sec % 60; } });
  });
  return x;
}
function kopieVan(s, doel, f){
  const n = { jaar: S.jaar, week: S.week, groep: doel.groep, datum: doel.datum, dagdeel: doel.dagdeel != null ? doel.dagdeel : s.dagdeel, categorie: s.categorie === "opwarming" ? "opwarming" : (s.categorie === "geen" ? "" : ""),
    status: "concept", sets_json: s.sets_json ? JSON.stringify(schaal(sj(s), f)) : "", opwarming: s.opwarming, land_min: s.land_min === "" ? "" : Math.round((Number(s.land_min) || 0) * f / 5) * 5 || "",
    land_type: s.land_type, inhoud_extra: s.inhoud_extra, tekst_vast: f === 1 ? s.tekst_vast : "", doel_keuze: s.doel_keuze, waarom_nu: s.waarom_nu, bib_id: s.bib_id || "", bib_versie: s.bib_versie || "",
    venster_van: "", venster_tot: "", flex_doelgroep: s.flex_doelgroep || "" };
  if (s.venster_van){ const off = dnIso(doel.datum) - dnIso(s.datum); n.venster_van = isoDn(dnIso(s.venster_van) + off); n.venster_tot = isoDn(dnIso(s.venster_tot || s.venster_van) + off); }
  if (doel.groep === "C"){ n.tekst_vast = s.tekst_vast || bereken(s).inh; n.sets_json = ""; n.land_min = ""; n.land_type = ""; n.opwarming = ""; n.categorie = ""; }
  return n;
}

function afdrukken(groepen, opm, extra){

/* ---------------- F3: richtwaarden, doel-TSS (Jaarplan.gs) ---------------- */
const DAG_SOORTEN = ["wedstrijd","test","clubactiviteit"];
const FASE_KLEUR = { "Overgang":"#B9B2AA", "Basis 1":"#9CC79B", "Basis 2":"#6FAE6E", "Basis 3":"#3F8A47", "Specifiek (P-n)":"#E3A33B", "Taper (P-1)":"#E07B39",
  "Wedstrijdblok":"#C9502C", "Piek":"#8E2A6B", "Uitloop":"#7A9CC6", "Kerst":"#D8CFC4" };
const KSOORT_L = { wedstrijd:"wedstrijd", test:"test", vakantie:"vakantie", examens:"examens", clubactiviteit:"clubactiviteit", afdrukopmerking:"afdrukopmerking" };
function faseNorm(f){ return !f ? "" : /^p-\d+$/i.test(f) ? "Specifiek (P-n)" : /^piek/i.test(f) ? "Piek" : f; }
function jpRw(fase){ const jp = S.jp, f = faseNorm(fase); if (!jp || !f) return null; return (jp.rw || []).find(r => r.fase.toLowerCase() === f.toLowerCase()) || null; }
function heeftExamens(ma, kal){ if (!ma) return false; const zo = isoDn(dnIso(ma) + 6); return (kal || []).some(k => k.soort === "examens" && k.van <= zo && k.tot >= ma); }
function doelTss(w, g, kal){
  if (!S.jp || !w || g === "C") return null;
  const r = jpRw(w.fase_analyse || w.fase); if (!r || r.index_min == null) return null;
  const ji = S.jp.ji || {}, idx = (r.index_min + (r.index_max != null ? r.index_max : r.index_min)) / 2, bd = (w.belastingdoel || "++").replace("−", "-");
  let f = r.zonder_factor ? 1 : (ji["factor_" + bd] != null ? ji["factor_" + bd] : 1);
  if (heeftExamens(w.maandag, kal)) f *= ji.examenfactor || 1;
  let t = (ji.ref_tss_A || 280) * idx / 100 * f; if (g === "B") t *= ji.verhouding_B || 0.7;
  return t;
}
function doelPil(tss, doel){
  if (!doel) return "";
  const r = tss / doel, kl = !tss ? "p-grijs" : (r >= 0.9 && r <= 1.1) ? "p-ok" : (r >= 0.8 && r <= 1.2) ? "p-warn" : "p-bad";
  return `<span class="pil ${kl}" title="Doel-TSS uit fase, belastingdoel en richtwaarden (±10 % = groen)">doel ${fmt(doel, 0)}${tss ? " · " + fmt(r * 100, 0) + " %" : ""}</span>`;
}

/* ---------------- F3: jaarplan ---------------- */
function jMa(jaar, week){ const j4 = Date.UTC(jaar, 0, 4) / 864e5, dw = (new Date(Date.UTC(jaar, 0, 4)).getUTCDay() + 6) % 7; return isoDn(j4 - dw + (week - 1) * 7); }
async function laadJaar(jaar){
  S.view = "jaar"; document.body.classList.add("jaarmodus"); $("#jaarknop").setAttribute("aria-pressed", "true"); melding("");
  $("#hoofd").innerHTML = '<div class="leeg">Jaarplan laden…</div>';

    S.jd = d; S.jdirty = {}; S.jp = { rw: d.rw, ji: d.ji }; S.jaar = d.jaar;
    const jr = new Set((S.d && S.d.jaren || []).concat([d.jaar - 1, d.jaar, d.jaar + 1]));

}
function jWeek(w){   /* weekrij met de niet-bewaarde wijzigingen */
  const r = (S.jd.weken || []).find(x => x.week === w), ma = r ? r.maandag : jMa(S.jd.jaar, w);
  return Object.assign({ week: w, maandag: ma, fase: "", fase_analyse: "", belastingdoel: "", focus: "", wedstrijd: "", eigenaar: "", gepubliceerd: "", gewijzigd_op: "", bestaat: !!r }, r || {}, S.jdirty[w] || {});
}
function jBewerkbaar(w){ const x = jWeek(w); return (!x.bestaat || x.eigenaar === "webapp") && isoDn(dnIso(x.maandag) + 6) >= S.jd.grens; }
function jKal(ma){ const zo = isoDn(dnIso(ma) + 6); return (S.jd.kalender || []).filter(k => k.van <= zo && k.tot >= ma); }
function jTot(w, g, vorig){ const T = (vorig ? S.jd.vorig : S.jd.totalen) || {}; return T[w] && T[w][g] ? T[w][g] : null; }
function toonJaar(){

  toonJaar_();
  document.querySelectorAll("#hoofd .jscroll").forEach((x, i) => { if (scr[i]) x.scrollTop = scr[i]; }); if (wy) window.scrollTo(0, wy);
}
function toonJaar_(){
  const d = S.jd, N = d.aantal_weken, nd = Object.keys(S.jdirty).length, vandaag = d.vandaag;
  let h = `<div class="weekkop"><h2>Jaarplan ${d.jaar}</h2>
    <button class="btn" id="j-bewaar" ${nd ? "" : "disabled"}>Bewaren${nd ? " (" + nd + " week" + (nd > 1 ? "en" : "") + ")" : ""}</button>

    <a class="btn rand klein" style="text-decoration:none;display:inline-flex;align-items:center" target="_blank" rel="noopener" href="${esc(d.planning_url)}">Planning KKYKC (Richtwaarden, Jaarinstellingen)</a>
    ${d.rw_geinstalleerd ? "" : `<span class="pil p-warn">standaard-richtwaarden: voer jaarplanInstalleren uit</span>`}</div>
    <div class="klein">Doel-TSS = ${fmt(d.ji.ref_tss_A, 0)} TSS × TSS-index van de fase × factor van het belastingdoel (− ${fmt(d.ji["factor_-"], 2)} · + ${fmt(d.ji["factor_+"], 2)} · ++ ${fmt(d.ji["factor_++"], 2)} · +++ ${fmt(d.ji["factor_+++"], 2)}; niet bij Taper, Piek, Kerst) × ${fmt(d.ji.examenfactor, 2)} in examenweken · B = ${fmt(d.ji.verhouding_B * 100, 0)} % van A. Gepland = gepubliceerd + concepten (c).</div>`;

  h += `<div class="jblok"><h3>Weken</h3><div class="jscroll"><table class="jtab"><thead><tr><th>Week</th><th>Fase</th><th>Bel.</th><th class="opt">Focus</th><th class="opt">Wedstrijd (titel)</th><th>Kalender</th><th class="n">A gepland / doel</th><th class="n">B gepland / doel</th><th class="n opt">C</th><th class="opt">Status</th></tr></thead><tbody>`;
  for (let w = 1; w <= N; w++){

    const cel = g => { const t = jTot(w, g), dt = doelTss(x, g, d.kalender); return `${t && t.n ? fmt(t.tss, 0) + (t.conc ? " (c)" : "") : "–"} ${dt ? doelPil(t ? t.tss : 0, dt) : ""}`; };
    const tc = jTot(w, "C");
    const st = !x.bestaat ? `<span class="pil p-grijs">nieuw</span>` : x.eigenaar === "sheet" ? `<span class="pil p-warn">Schema</span>` : x.gepubliceerd ? `<span class="pil p-ok">gepubliceerd</span>` : `<span class="pil p-bad">niet gepubl.</span>`;
    h += `<tr class="${S.jdirty[w] ? "vuil" : ""} ${x.maandag <= vandaag && vandaag <= zo ? "nu" : ""}">
      <td><button class="wk" data-jnaar="${w}" title="Open de week">W${w}</button> <span class="klein">${ddmm(x.maandag)}</span></td>
      <td><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${FASE_KLEUR[faseNorm(x.fase_analyse || x.fase)] || "transparent"}"></span>
        <select data-jw="${w}" data-veld="fase" ${dis} style="width:auto;max-width:150px"><option value=""></option>${d.fasen.concat(d.fasen.indexOf(x.fase) < 0 && x.fase ? [x.fase] : []).map(f => `<option ${f === x.fase ? "selected" : ""}>${esc(f)}</option>`).join("")}</select></td>
      <td><select data-jw="${w}" data-veld="belastingdoel" ${dis} style="width:auto">${["","-","+","++","+++"].map(v => `<option value="${v}" ${v === (x.belastingdoel || "").replace("−", "-") ? "selected" : ""}>${v.replace("-", "−") || "–"}</option>`).join("")}</select></td>
      <td class="opt"><input type="text" data-jw="${w}" data-veld="focus" maxlength="120" value="${esc(x.focus)}" ${dis}></td>
      <td class="opt"><input type="text" data-jw="${w}" data-veld="wedstrijd" maxlength="120" value="${esc(x.wedstrijd)}" ${dis}></td>
      <td>${jKal(x.maandag).map(k => `<span class="kchip ${esc(k.soort)}" data-kal="${esc(k.id)}" title="${esc(KSOORT_L[k.soort] || k.soort)}${k.groepen ? " · " + esc(k.groepen) : ""} · ${ddmm(k.van)}${k.tot !== k.van ? "–" + ddmm(k.tot) : ""}${k.opmerking ? " · " + esc(k.opmerking) : ""}">${k.soort === "afdrukopmerking" ? "🖨 " : ""}${esc(k.soort === "afdrukopmerking" ? (k.type || "opmerking") : k.naam)}${k.soort !== "afdrukopmerking" && k.van >= x.maandag && k.van <= zo && k.van === k.tot ? " " + DAGK[dnIso(k.van) - dnIso(x.maandag)] : ""}</span>`).join("")}</td>
      <td class="n">${cel("A")}</td><td class="n">${cel("B")}</td><td class="n opt">${tc && tc.n ? tc.n + " s." : "–"}</td><td class="opt">${st}</td></tr>`;
  }
  h += `</tbody></table></div><div class="klein">Weken uit Schema ${d.jaar} en weken ouder dan 7 dagen zijn enkel te lezen. Fase, belastingdoel en wedstrijd sturen de doel-TSS, de sjablonen en de evaluatie (Z3) in de weekweergave.</div></div>`;
  h += jAnalyse();
  h += jKalBlok();
  $("#hoofd").innerHTML = h;

function jGrafiek(){
  const d = S.jd, N = d.aantal_weken, W = 1000, H = 190, L = 34, R = 6, T = 8, B = 30, bw = (W - L - R) / N;
  const vals = []; for (let w = 1; w <= N; w++){ const x = jWeek(w); ["A","B"].forEach(g => { const t = jTot(w, g); vals.push(t ? t.tss : 0, doelTss(x, g, d.kalender) || 0); }); }
  const max = Math.max(100, ...vals) * 1.08, y = v => T + (H - T - B) * (1 - v / max);
  let s = `<svg class="jgraf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Geplande TSS en doel-TSS per week, groep A en B">`;
  for (let v = 0; v <= max; v += 100){ s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 4}" y="${y(v) + 3}" font-size="9" text-anchor="end" fill="var(--muted)">${v}</text>`; }
  for (let w = 1; w <= N; w++){

  if (st.groep && S.groepen && !S.groepen[st.groep]) S.groepen[st.groep] = true;
  await laad(st.jaar, st.week, true);
  if (st.sessie && S.d && S.d.sessies){ const s = S.d.sessies.find(x => x.id === st.sessie); if (s) openEditor(s); else melding("Deze sessie staat niet (meer) in week " + S.week + ".", ""); }
}
/* ---------- KKYKC-app (B3, 19/11/2026 – ingevoegd door bouw_app.py, bron: app/bron_b3/app_pagina.js) ----------
   Dashboard en planner (enkel hoofdtrainers): aanmelden met Google (api.js) en de API i.p.v. de Apps Script-aanroep.
   Niets van de gegevens wordt op het toestel bewaard (geen browsercache: PAGINA_WIE is leeg). Enkel thema/jaar/periode blijven in de browser.
   Afmelden = aanmeldbewijs weg + naar de startpagina: de gegevens verdwijnen met de pagina uit het geheugen. */
var APP_PAGINA = { gestart: false };
(function(){
  var st = document.createElement("style");
  st.textContent = "#appKaart{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}" +
    " #appKaart>div{max-width:440px;width:100%;background:var(--panel,#fff);color:var(--fg,#222);border-radius:12px;padding:20px;font-family:Arial,Helvetica,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.3)}" +
    " #appKaart h2{margin-top:0} #appKaart .mu{color:var(--muted,#666);font-size:14px} #appKaart .fout{color:#c62828}";
  document.head.appendChild(st);
})();
function appKaartBasis(){
  var k = document.getElementById("appKaart");
  if (!k){ k = document.createElement("div"); k.id = "appKaart"; k.setAttribute("role", "dialog"); k.setAttribute("aria-modal", "true"); document.body.appendChild(k); }
  return k;
}
var APP_LINKS = "<p class='mu'><a href='index.html' style='color:inherit'>Start</a> · <a href='privacy.html' style='color:inherit'>Privacy</a></p>";
/* aanmelden (eerste keer of na verlopen aanmelding: de pagina blijft staan, daarna opnieuw proberen) */
function appKaart(tekst){
  var k = appKaartBasis();
  k.innerHTML = "<div><h2>Aanmelden</h2><p>Meld je aan met je Google-account (hoofdtrainer).</p>" +
    "<p class='mu'>De app ziet enkel je naam en e-mailadres, geen bestanden.</p><div id='appGknop' style='min-height:44px;margin:12px 0'></div>" +
    "<p class='fout' role='alert'></p>" + APP_LINKS + "</div>";
  k.querySelector(".fout").textContent = tekst || "";
  KKYKC.knop(document.getElementById("appGknop"));
}
function appGeenToegang(tekst){
  var k = appKaartBasis();
  k.innerHTML = "<div><h2>Geen toegang</h2><p class='fout' role='alert'></p><p class='mu'>Deze pagina is enkel voor hoofdtrainers.</p>" + APP_LINKS + "</div>";
  k.querySelector(".fout").textContent = tekst || "Geen toegang tot deze pagina.";
}
/* foutcodes van api.js: token/verlopen/aud → opnieuw aanmelden · test/rol → geen toegang */
function appFoutAanmelden(code, tekst){
  if (code === "token" || code === "verlopen" || code === "aud"){ appKaart(tekst || "Meld je opnieuw aan."); return true; }
  if (code === "test" || code === "rol"){ appGeenToegang(tekst); return true; }
  return false;
}
function appAfmelden(){ KKYKC.afmelden(); location.replace("index.html"); }
function appAfknop(naastId, klasse){
  var n = document.getElementById(naastId); if (!n) return;
  var b = document.createElement("button"); b.type = "button"; b.id = "appAf"; b.className = klasse; b.textContent = "Afmelden"; b.onclick = appAfmelden;
  n.parentNode.insertBefore(b, n.nextSibling);
}
function appStart(f){
  if (!KKYKC.ingesteld()){ appGeenToegang("De app is nog niet ingesteld."); return; }
  KKYKC.opAanmelden(function(){ var k = document.getElementById("appKaart"); if (k) k.remove(); if (!APP_PAGINA.gestart){ APP_PAGINA.gestart = true; f(); } });
  if (KKYKC.aangemeld()){ APP_PAGINA.gestart = true; f(); } else appKaart("");
}
/* ---------- planner (B3, bron: app/bron_b3/planner_app.js) ----------
   Schrijft rechtstreeks in Planning KKYKC (dezelfde Sheet als de oude planner). Week overnemen (2026-weekbladen) en S7-meldingen: enkel in de oude planner. */
appAfknop("thema", "tknop");
appStart(plannerStart);
</script>
