<title>KKYKC Trainersportaal</title>
<style>

:root[data-theme="dark"]{--bg:#17130F;--panel:#211B15;--fg:#F3ECE4;--muted:#B2A595;--line:#3A3027;--licht:#2A2018;--beige:#4A3B2E;
  --ok:#7FCB8A;--ok-bg:#1F3A24;--warn:#E9C25A;--warn-bg:#3D3112;--oranje:#F0A060;--oranje-bg:#43280F;--bad:#F08A7E;--bad-bg:#47201B;--grijs-bg:#2C2620;--or-ink:#F0A060;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45}
.band{background:var(--or);color:#fff}

.wrap{max-width:900px;margin:0 auto;padding:12px 16px 40px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
button,select,textarea,input{font:inherit;color:inherit}
.btn{border:1px solid var(--or);background:var(--or);color:#fff;border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px}
.btn.rand{background:transparent;color:var(--or-ink)}.btn:disabled{opacity:.45;cursor:not-allowed}

.weekkop{display:flex;align-items:center;gap:8px;flex:1;justify-content:center;font-weight:bold;text-align:center}
.sub{color:var(--muted);font-size:12.5px;font-weight:normal}

.kaart.st-tebev-k{border-left:5px solid var(--warn)}

.km.opmk{display:block;font-weight:bold}
.notitie{border-left:4px solid var(--warn);background:var(--warn-bg);padding:6px 10px;border-radius:0 6px 6px 0;margin:6px 0;font-size:13.5px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:10px 0}
.bkaart{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;cursor:pointer;color:inherit;font:inherit}
.bkaart:hover{outline:1px solid var(--or)}.bkaart.stil{cursor:default}.bkaart.stil:hover{outline:0}
.chips{flex-wrap:wrap;margin:4px 0}.chips button{padding:5px 12px;font-size:13px}
#bZoek{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:0;flex:1;max-width:260px}
.bimg{max-width:100%;height:auto;border-radius:6px;display:block;margin:6px 0;background:#fff}.bimg:not([src]){min-height:40px;background:var(--grijs-bg)}
.bimg.duim{max-height:90px;width:auto;margin:0}.bimg.groot{max-height:420px;width:auto}
.dlg.breed{max-width:860px}
.pkop{display:flex;justify-content:space-between;align-items:center}
.pblok{margin:12px 0;border-top:1px solid var(--line);padding-top:8px}.pblok h3{margin:0 0 6px;font-size:15px}
details.pblok summary{cursor:pointer;list-style:none}details.pblok summary h3{display:inline}details.pblok summary::before{content:"▸ ";color:var(--or)}details[open].pblok summary::before{content:"▾ "}
.otab{width:100%;border-collapse:collapse;font-size:14px}.otab td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}.otab .vol{white-space:nowrap;text-align:right;color:var(--or-ink);font-weight:bold;width:1%}

.matlijst{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px}.matlijst label{display:flex;gap:8px;align-items:center;font-size:14px}
.oefveld{margin:8px 0}.oefveld b{display:block;font-size:12px;text-transform:uppercase;color:var(--muted)}

.eknop{display:flex;gap:2px}.medlijst{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.medit{display:flex;align-items:flex-start}
.uploadknop{display:inline-flex;align-items:center;cursor:pointer}
.linklijst{display:flex;flex-wrap:wrap;gap:8px}.linklijst a,.pblok a.btn{text-decoration:none}

  body.drukplan .dlg{border:0;max-width:none;padding:0}.noprint{display:none!important}.pblok{break-inside:avoid}}
footer{margin-top:30px;text-align:center;font-style:italic;color:var(--muted);font-size:12px}
@media (max-width:520px){.rij2{grid-template-columns:1fr}.titel h1{font-size:18px}.logo{height:40px}}
.opw{margin:6px 0;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--panel)}.opw summary{cursor:pointer;font-weight:bold;font-size:13.5px;padding:4px 0}
.acctwaarsch{background:#fde2e1;color:#7a1a14;border:1px solid #e9a39d;border-radius:8px;padding:10px 12px;margin:8px 0}
.org{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px 0 18px}.org .rij{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}

#cachebalk{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 12px;border-radius:8px;margin:8px 0;font-size:13px;background:rgba(128,128,128,.12);color:inherit;border:1px solid rgba(128,128,128,.25)}

<script>
/* Thema en weergave: keuze per toestel (enkel deze voorkeuren in de browser; geen sportergegevens) */
(function(){ var t=null; try{ t=localStorage.getItem("kkykc-thema"); }catch(e){}
  if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t); })();
function themaHuidig(){ var t=document.documentElement.getAttribute("data-theme");
  if(t==="light"||t==="dark") return t;
  return (window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"; }
function themaKnop(){ var b=document.getElementById("btnThema"); if(!b) return;
  var d=themaHuidig()==="dark"; b.textContent=d?"☀ Licht":"☾ Donker";
  b.setAttribute("aria-pressed",d?"true":"false"); b.title=d?"Overschakelen naar lichte modus":"Overschakelen naar donkere modus"; }
function themaWissel(){ var n=themaHuidig()==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",n); try{ localStorage.setItem("kkykc-thema",n); }catch(e){} themaKnop(); }

<script>
"use strict";

const dn = (y,m,d) => Math.round(Date.UTC(y,m-1,d)/864e5), dnIso = s => { const [y,m,d] = s.split("-").map(Number); return dn(y,m,d); };

const REDENEN = {weer:"Weer (wind, onweer, kou)", water:"Water (te laag/hoog, stroming, drijfvuil)", opkomst:"Te weinig sporters", ziek_blessure:"Ziekte of blessure (algemeen, zonder namen)", materiaal:"Materiaal, boten of lokaal", te_zwaar:"Te zwaar voor de groep", te_licht:"Te licht voor de groep", tijd:"Tijdgebrek of later gestart", evenement:"Evenement of wedstrijd", keuze:"Keuze van de trainer", andere:"Andere (opmerking verplicht)"};

   (anders kan iets dubbel bewaard worden). */

    e => { if (!klaar){ klaar = true; clearTimeout(t); appFoutAanmelden(e && e.code, e && e.message); nok({code:"server", message:(e && e.message) || String(e)}); } });   /* KKYKC-app: API */
}
const gs = (fn, ...args) => new Promise((ok, nok) => {
  if (!KKYKC.aangemeld()){ appFoutAanmelden("verlopen", "Je aanmelding is verlopen. Meld je opnieuw aan."); return nok(new Error("Meld je opnieuw aan.")); }

/* ============================== v8 (11/11/2026): eerst de laatst geladen gegevens tonen ==============================
   De pagina bewaart de serverantwoorden in deze browser (IndexedDB, per Google-account, max. 14 dagen) en toont die meteen bij het openen.
   Daarna één snelle aanroep (getStempels): is er iets gewijzigd in de bronnen, dan verschijnt bovenaan 'Nieuwe gegevens beschikbaar' + Vernieuwen.
   Geen IndexedDB, ander account of te oud → gewoon laden zoals vroeger. */
const KC = (() => {
  const V = "c1", MAX_DAGEN = 14;
  const LABEL = {v:"nieuwe versie van de app", dag:"nieuwe dag", jaar:"jaar", schema:"schema", tlog:"trainerslog", bib:"bibliotheek", not:"notities", data:"logboek", test:"testtijden", ctl:"te controleren", wed:"wedstrijden", planning:"planning (Planning KKYKC)", opm:"opmerkingen sporters", "?":"onbekend"};

    const t = setTimeout(() => nok(new Error("IndexedDB antwoordt niet")), 2500);
    try {
      const r = indexedDB.open("kkykc-cache", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("c");
      r.onsuccess = () => { clearTimeout(t); ok(r.result); };
      r.onerror = () => { clearTimeout(t); nok(r.error); };
    } catch(e){ clearTimeout(t); nok(e); }
  }));
  const tx = (modus, f) => open().then(db => new Promise((ok, nok) => {
    const t = db.transaction("c", modus), r = f(t.objectStore("c"));
    t.oncomplete = () => ok(r && r.result); t.onerror = t.onabort = () => nok(t.error);
  }));
  const wie = () => String(PAGINA_WIE || "").toLowerCase();
  const actief = () => wie().indexOf("@") > 0 && typeof indexedDB !== "undefined";
  const sleutel = p => p + "|" + wie() + "|" + V;
  const twee = n => String(n).padStart(2, "0");
  const wanneer = t => {
    const d = new Date(t), nu = new Date(), u = twee(d.getHours()) + ":" + twee(d.getMinutes());
    const dag = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(), v = Math.round((dag(nu) - dag(d)) / 864e5);
    return v === 0 ? "vandaag " + u : v === 1 ? "gisteren " + u : ["zo","ma","di","wo","do","vr","za"][d.getDay()] + " " + twee(d.getDate()) + "/" + twee(d.getMonth() + 1) + " " + u;
  };
  return {
    actief,
    async lees(p){
      if (!actief()) return null;
      try { const c = await tx("readonly", s => s.get(sleutel(p))); return c && c.t && Date.now() - c.t < MAX_DAGEN * 864e5 ? c : null; } catch(e){ return null; }
    },
    async bewaar(p, c){ if (!actief() || !c) return; try { await tx("readwrite", s => s.put(c, sleutel(p))); } catch(e){} },
    async wis(){ try { await tx("readwrite", s => s.clear()); } catch(e){} },
    /* sleutels waarin de stempels verschillen ([] = alles actueel) */
    verschil(oud, nieuw){ if (!oud || !nieuw) return ["?"]; return Object.keys(nieuw).filter(k => String(oud[k]) !== String(nieuw[k])); },
    kopie(x){ try { return typeof structuredClone === "function" ? structuredClone(x) : JSON.parse(JSON.stringify(x)); } catch(e){ return JSON.parse(JSON.stringify(x)); } },
    wanneer,
    /* melding bovenaan: controle · actueel · nieuw · fout · bezig · klaar · misl */
    balk(staat, t, extra, actie){
      let d = document.getElementById("cachebalk");
      if (!d){ d = document.createElement("div"); d.id = "cachebalk"; d.setAttribute("role", "status"); const m = document.getElementById("meldingen"); m.parentNode.insertBefore(d, m); }
      clearTimeout(tm);
      const w = t ? wanneer(t) : "", delen = Array.isArray(extra) ? [...new Set(extra.map(k => LABEL[k] || k))].join(", ") : esc(extra || "");

        controle: `Getoond: gegevens van <b>${w}</b> · nagaan of er nieuwe gegevens zijn…`,
        actueel: `Gegevens zijn up-to-date (geladen ${w}).`,
        nieuw: `<span><b>Nieuwe gegevens beschikbaar</b> (${delen}). Getoond: gegevens van <b>${w}</b>.</span>`,
        fout: `<span>Kon niet nagaan of er nieuwe gegevens zijn${delen ? " (" + delen + ")" : ""}. Getoond: gegevens van <b>${w}</b>.</span>`,
        bezig: `Nieuwe gegevens laden…`,
        klaar: `Gegevens bijgewerkt.`,
        misl: `<span><b>Vernieuwen mislukt</b>${delen ? " (" + delen + ")" : ""}. Getoond: gegevens van <b>${w}</b>.</span>`
      }[staat] || "";
      d.className = "cb-" + staat;
      d.innerHTML = txt + (actie ? `<button type="button" id="cbKnop">Vernieuwen</button>` : "");

})();

const ST_TXT = {ok:"Zoals gepland", aangepast:"Aangepast", nd:"Niet doorgegaan", tebev:"Nog te bevestigen", gepland:"Gepland", vrij:"Geen bevestiging nodig (donderdag)"};

function kalender(){
  const ws = Object.keys(S.meta.weken).map(Number).sort((a,b)=>a-b), i = ws.indexOf(S.wnr), toon = ws.slice(i, i+2);
  let k = `<div class="tkal"><div></div>${DAGEN.map(d => `<div class="kh">${d}</div>`).join("")}`;
  toon.forEach(w => {
    const s0 = weekStart(w), lijst = sessies(S.groep, w), wi = (S.meta.weekinfo||{})[w] || {};

/* ---------- weekbriefing (bovenaan Planning) ---------- */
function briefing(){
  if (!S.meta) return "";
  const w = S.wnr, wi = (S.meta.weekinfo||{})[w] || {}, lijst = sessies(S.groep, w);
  const min = lijst.reduce((a,p) => a + (p.duur||0), 0), water = lijst.filter(p => p.cat === "water").length, land = lijst.filter(p => p.cat === "land").length;
  const doelen = {}; lijst.forEach(p => { if (p.doel) doelen[p.doel] = (doelen[p.doel]||0) + 1; });
  const speciaal = lijst.filter(p => /2 ?km-test|200 ?m-test|\btest\b|wedstrijd|leievaren|afvaart|tocht/i.test((p.inh||"")+" "+(p.type||"")));
  const gekop = lijst.map(p => ({p, k:koppelVan(p.cel)})).filter(x => x.k && B.bib && B.bib.plannen[x.k.plan]);
  const nots = openNot(S.groep);
  const r = [];
  r.push(`<b>Week ${w} · groep ${esc(S.groep)}</b>${wi.fase ? " · fase "+esc(wi.fase) : ""}${wi.focus ? " · focus: "+esc(wi.focus) : ""}`);
  r.push(`${lijst.length} training${lijst.length===1?"":"en"} (${water} water, ${land} land${lijst.length-water-land ? ", "+(lijst.length-water-land)+" overig" : ""})${min ? " · ± "+fmt(min/60,1)+" u gepland" : ""}`);
  if (Object.keys(doelen).length) r.push("Doelen: " + Object.entries(doelen).map(([d,n]) => `<span class="doelchip" style="background:${doelKleur(d)};padding-right:9px">${esc(d)} ×${n}</span>`).join(" "));
  if (speciaal.length) r.push("Let op: " + speciaal.map(p => `${DAGEN[wd(p.dn)]} ${ddmm(p.dn)} – ${esc((p.inh||p.type).slice(0,70))}`).join(" · "));
  if (gekop.length) r.push("Plannen: " + gekop.map(x => `<button type="button" class="planchip" data-plan="${esc(x.k.plan)}" style="background:${SOORT_KLEUR[B.bib.plannen[x.k.plan].soort]||"#eee"}">📋 ${DAGEN[wd(x.p.dn)].slice(0,2)} ${ddmm(x.p.dn)} · ${esc(B.bib.plannen[x.k.plan].titel)}</button>`).join(" "));
  r.push(opmBrief(S.groep));
  r.push(nots.length ? `<button type="button" class="linkknop" id="briefNot">📝 ${nots.length} open notitie${nots.length===1?"":"s"} voor groep ${esc(S.groep)}</button>` : `<button type="button" class="linkknop" id="briefNot">📝 Notitie voor de volgende trainer</button>`);
  return `<div class="briefing">${r.map(x => `<div>${x}</div>`).join("")}</div>`;
}

/* ---------- Opmerkingen van sporters (15/11/2026) ---------- */
async function laadOpm(){ try { return await gs("getOpmerkingen"); } catch(e){ return {items:[], fout:/getOpmerkingen|not found|niet gevonden/i.test(e.message) ? "servercode nog niet bijgewerkt" : e.message}; } }
function pasOpmToe(r){ r = r || {}; O.items = r.items || []; O.bijgewerkt = r.bijgewerkt || ""; O.van = r.van || ""; O.tot = r.tot || ""; O.fout = r.fout || ""; O.ingekort = !!r.ingekort; }
const opmGrens = dagen => isoDn(VANDAAG() - dagen + 1);
const opmVan = cel => cel ? O.items.filter(o => o.cel === cel) : [];
const opmErnst = l => l.some(o => (o.l||[]).some(k => k === "pijn" || k === "ziek")) ? "ob-bad" : l.some(o => (o.l||[]).includes("zwaar")) ? "ob-warn" : "";
function opmBadge(p){
  const l = opmVan(p.cel);
  return l.length ? `<button type="button" class="opmbadge ${opmErnst(l)}" data-act="opm" title="Opmerkingen van sporters bij deze training">💬 ${l.length} opmerking${l.length===1?"":"en"}</button>` : "";
}
function opmBrief(groep){
  if (O.fout && !O.items.length) return `<span class="meta">💬 Opmerkingen van sporters niet beschikbaar (${esc(O.fout)}).</span>`;
  const g = opmGrens(14), l = O.items.filter(o => o.g === groep && o.d >= g);
  if (!l.length) return `<span class="meta">💬 Geen opmerkingen van sporters in groep ${esc(groep)} (laatste 14 dagen).</span>`;
  const tel = {}; l.forEach(o => (o.l||[]).forEach(k => { if (k !== "ander") tel[k] = (tel[k]||0) + 1; }));
  const pils = Object.entries(tel).sort((a,b) => b[1]-a[1]).map(([k,n]) => `<span class="pil ${OPM_KLAS[k]}">${esc(OPM_LAB[k])} ×${n}</span>`).join(" ");
  return `<button type="button" class="linkknop" id="briefOpm">💬 ${l.length} opmerking${l.length===1?"":"en"} van sporters in groep ${esc(groep)} (laatste 14 d)</button> ${pils}`;
}
function opmItem(o){
  const p = o.cel ? sessieVan(o.cel) : null;
  const tr = o.cel ? (p ? `<button type="button" class="linkknop" data-opmopen="${esc(o.cel)}">${esc(o.ty || p.type)}</button>` : esc(o.ty || "training")) : `<i>geen geplande training gekoppeld</i>`;
  const extra = [o.soort, o.gv && "gevoel "+o.gv, o.rpe && "RPE "+o.rpe].filter(Boolean).map(esc).join(" · ");
  return `<div class="opm ${opmErnst([o])}"><div><b>${esc(o.n)}</b> · groep ${esc(o.g)} · ${DAGEN[wd(dnIso(o.d))].slice(0,2)} ${ddmm(dnIso(o.d))}${o.dd && !o.cel ? " "+esc(o.dd) : ""} · ${tr} ${(o.l||[]).filter(k => k !== "ander").map(k => `<span class="pil ${OPM_KLAS[k]}">${esc(OPM_LAB[k])}</span>`).join(" ")}</div>
    <div class="ot">${esc(o.t)}</div>${extra ? `<div class="hist">${extra}</div>` : ""}</div>`;
}
function opmDialoog(f){
  f = f || {}; if (f.groep !== undefined) O.groep = f.groep;
  const p = f.cel ? sessieVan(f.cel) : null;
  const o = dlg(`<div id="opmIn"></div>`);
  const teken = () => {
    let l = O.items;
    if (f.cel) l = l.filter(x => x.cel === f.cel);
    else { const g = opmGrens(O.dagen); l = l.filter(x => x.d >= g && (!O.groep || x.g === O.groep) && (!O.label || (x.l||[]).includes(O.label))); }
    const chip = (attr, v, cur, t) => `<button type="button" ${attr}="${v}" aria-pressed="${cur===v}">${t}</button>`;
    const filters = f.cel ? "" : `<div class="tabs chips" role="group" aria-label="Groep">${chip("data-og", "", O.groep, "Alle groepen")}${["A","B","C"].map(g => chip("data-og", g, O.groep, "Groep "+g)).join("")}</div>
      <div class="tabs chips" role="group" aria-label="Periode">${[7,14,21].map(n => chip("data-od", String(n), String(O.dagen), "laatste "+n+" d")).join("")}</div>
      <div class="tabs chips" role="group" aria-label="Label">${chip("data-ol", "", O.label, "Alle")}${Object.keys(OPM_LAB).map(k => chip("data-ol", k, O.label, OPM_LAB[k])).join("")}</div>`;
    const kop = p ? `<h2>💬 Opmerkingen · ${esc(p.type)}${p.dd ? " · "+esc(p.dd) : ""} · ${DAGEN[wd(p.dn)]} ${ddmm(p.dn)} · groep ${esc(p.groep)}</h2>` : `<h2>💬 Opmerkingen van sporters</h2>`;
    o.querySelector("#opmIn").innerHTML = `${kop}<p class="meta">Uit het trainingsformulier en de logboeken${O.bijgewerkt ? ", bijgewerkt "+esc(O.bijgewerkt.replace("T"," ")) : ""} (elke 15 min). Labels zijn trefwoorden, geen interpretatie. Vertrouwelijk: niet doorsturen of kopiëren naar andere kanalen.</p>
      ${filters}<div>${l.length ? l.map(opmItem).join("") : `<p class="meta">Geen opmerkingen${f.cel ? " bij deze training" : " voor deze keuze"}.</p>`}</div>${O.ingekort ? `<p class="meta">Lijst ingekort (te veel tekst); de oudste opmerkingen ontbreken.</p>` : ""}
      <div id="fout" class="fout" role="alert"></div><div class="acties">${B.kan ? `<button class="btn rand" id="oV" title="Enkel hoofdtrainers: nu opnieuw uit de logboeken lezen (± 20 s)">↻ Nu opnieuw lezen</button>` : ""}<button class="btn rand" id="x">Sluiten</button></div>`;
    o.querySelector("#x").onclick = o.sluit;
    o.querySelectorAll("[data-og]").forEach(b => b.onclick = () => { O.groep = b.dataset.og; teken(); });
    o.querySelectorAll("[data-od]").forEach(b => b.onclick = () => { O.dagen = Number(b.dataset.od); teken(); });
    o.querySelectorAll("[data-ol]").forEach(b => b.onclick = () => { O.label = b.dataset.ol; teken(); });
    o.querySelectorAll("[data-opmopen]").forEach(b => b.onclick = () => { o.sluit(); openKaart(b.dataset.opmopen); });
    if (o.querySelector("#oV")) o.querySelector("#oV").onclick = async () => { const b = o.querySelector("#oV"); b.disabled = true; b.textContent = "Bezig…";
      try { pasOpmToe(await gs("vernieuwOpmerkingen")); teken(); if (B.tab === "planning" && S.meta) render(); } catch(e){ o.querySelector("#fout").textContent = e.message; b.disabled = false; b.textContent = "↻ Nu opnieuw lezen"; } };
  };
  teken(); o.querySelector("#x").focus();
}

async function inplanDialoog(id){
  const p = B.bib.plannen[id];

  o.querySelector("#x").onclick = o.sluit;
  let kand = [];
  const toon = async () => {
    const d = o.querySelector("#iD").value; if (!d) return; const n = dnIso(d);

    o.querySelector("#ok").disabled = !kand.length;
  };
  o.querySelector("#iD").onchange = toon; toon();

function verklein(file, max){
  return new Promise((ok, nok) => {
    const r = new FileReader(); r.onerror = () => nok(new Error("Bestand lezen mislukt."));
    r.onload = () => { const im = new Image(); im.onerror = () => nok(new Error("Geen geldige afbeelding."));
      im.onload = () => { const f = Math.min(1, max / im.width), c = document.createElement("canvas"); c.width = Math.round(im.width*f); c.height = Math.round(im.height*f);
        const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(im, 0, 0, c.width, c.height);
        let q = 0.78, d = c.toDataURL("image/jpeg", q); while (d.length > 300000 && q > 0.4){ q -= 0.1; d = c.toDataURL("image/jpeg", q); } ok(d); };
      im.src = r.result; };
    r.readAsDataURL(file);
  });
}
async function upload(input){
  const f = input.files && input.files[0]; if (!f) return null;
  const d = await verklein(f, 900), id = await gs("bewaarMedia", d, f.name); B.media[id] = d; return id;
}

  const T = JSON.parse(JSON.stringify(B.bib.team || {rollen:[], opm:"", bronnen:[]}));
  const o = dlg(`<h2>Trainersstructuur bewerken</h2><div id="te"></div><div id="fout" class="fout" role="alert"></div><div class="acties"><button class="btn" id="ok">Opslaan</button><button class="btn rand" id="x">Annuleren</button></div>`);
  o.querySelector(".dlg").classList.add("breed");
  const lees = () => { const q = s => o.querySelector(s);
    T.rollen.forEach((r, ri) => { r.rol = q(`[data-rr="${ri}"]`).value; r.uitleg = q(`[data-ru="${ri}"]`).value;
      r.personen.forEach((p, pi) => ["naam","groepen","taken","contact"].forEach(k => p[k] = q(`[data-p${k}="${ri}-${pi}"]`).value)); });
    T.opm = q("#tO").value; T.bronnen = q("#tB").value.split("\n").map(l => l.split("|").map(s => s.trim())).filter(a => a[0] && a[1]).map(a => ({titel:a[0], url:a[1]})); };
  const teken = () => {
    o.querySelector("#te").innerHTML = T.rollen.map((r, ri) => `<fieldset class="eblok"><legend>Rol ${ri+1}</legend><div class="rij2"><div><label>Rol</label><input type="text" data-rr="${ri}" maxlength="60" value="${esc(r.rol)}"></div><div><label>Uitleg</label><input type="text" data-ru="${ri}" maxlength="600" value="${esc(r.uitleg)}"></div></div>
      ${r.personen.map((p, pi) => `<div class="eitem"><input type="text" data-pnaam="${ri}-${pi}" maxlength="60" value="${esc(p.naam)}" placeholder="naam (voornaam)" aria-label="Naam"><input type="text" data-pgroepen="${ri}-${pi}" maxlength="60" value="${esc(p.groepen)}" placeholder="groep(en)" aria-label="Groepen">
        <input type="text" data-ptaken="${ri}-${pi}" maxlength="400" value="${esc(p.taken)}" placeholder="taken" aria-label="Taken"><input type="text" data-pcontact="${ri}-${pi}" maxlength="120" value="${esc(p.contact)}" placeholder="contact (optioneel)" aria-label="Contact">
        <span class="eknop"><button type="button" class="linkknop" data-pweg="${ri}-${pi}" aria-label="Verwijderen">✕</button></span></div>`).join("")}
      <div class="acties"><button type="button" class="btn rand klein" data-pplus="${ri}">+ Persoon</button><button type="button" class="btn rand klein" data-rweg="${ri}">✕ Rol</button></div></fieldset>`).join("")
      + `<div class="acties"><button type="button" class="btn rand klein" id="rPlus">+ Rol</button></div>
      <label for="tO">Opmerking bovenaan</label><textarea id="tO" maxlength="2000">${esc(T.opm||"")}</textarea>
      <label for="tB">Documenten (één per regel: titel | https:&#47;&#47;…)</label><textarea id="tB" style="min-height:56px">${esc((T.bronnen||[]).map(l => l.titel+" | "+l.url).join("\n"))}</textarea>
      <p class="priv">Contactgegevens enkel van trainers zelf en met hun akkoord.</p>`;
    const q = o.querySelector("#te"), her = f => () => { lees(); f(); teken(); };
    q.querySelectorAll("[data-pplus]").forEach(b => b.onclick = her(() => T.rollen[b.dataset.pplus].personen.push({naam:"", groepen:"", taken:"", contact:""})));
    q.querySelectorAll("[data-pweg]").forEach(b => b.onclick = her(() => { const [r,p] = b.dataset.pweg.split("-").map(Number); T.rollen[r].personen.splice(p,1); }));
    q.querySelectorAll("[data-rweg]").forEach(b => b.onclick = her(() => T.rollen.splice(Number(b.dataset.rweg),1)));
    q.querySelector("#rPlus").onclick = her(() => T.rollen.push({rol:"", uitleg:"", personen:[]}));
  };
  teken();
  o.querySelector("#x").onclick = o.sluit;
  o.querySelector("#ok").onclick = async () => { lees(); o.querySelector("#ok").disabled = true;
    try { bibNa(await gs("bewaarTeam", T)); o.sluit(); renderTeam(); melding("Opgeslagen."); } catch(e){ o.querySelector("#fout").textContent = e.message; o.querySelector("#ok").disabled = false; } };
}

/* ---------- Info ---------- */
function autoBlok(a){
  if (a === "zones"){ const z = S.meta && S.meta.zones || []; return z.length ? `<div class="meta">Zones in het schema: ${z.map(esc).join(" · ")}</div>` : ""; }
  if (a === "doelen"){ const d = Object.entries((S.meta||{}).doelen||{}).sort((x,y) => (x[1].volgorde||0)-(y[1].volgorde||0));
    return d.map(([n,x]) => `<details class="doeluitleg"><summary><span class="doelchip" style="background:${doelKleur(n)};padding-right:9px">${esc(n)}</span> <span class="meta">${esc(x.vakterm||"")}</span></summary>${x.wat ? `<p><b>Wat:</b> ${esc(x.wat)}</p>` : ""}${x.waarom ? `<p><b>Waarom:</b> ${esc(x.waarom)}</p>` : ""}${x.voelt ? `<p><b>Hoe voelt het:</b> ${esc(x.voelt)}</p>` : ""}</details>`).join(""); }
  return "";
}
function renderInfo(){
  const v = document.getElementById("v-info");
  if (!B.bib){ v.innerHTML = `<div class="melding fout">Niet beschikbaar: ${esc(B.fout || "laden…")}</div>`; return; }
  const links = (B.bib.links||[]).filter(l => B.kan || !l.enkelHoofd);
  v.innerHTML = `<div class="bar"><h2 style="margin:0;flex:1">Info voor trainers</h2>${B.kan ? `<button class="btn klein" id="iE">✎ Bewerken</button>` : ""}</div>
    ${links.length ? `<section class="pblok"><h3>Links</h3><div class="linklijst">${links.map(l => `<a class="btn rand klein" href="${esc(l.url)}" target="_blank" rel="noopener" title="${esc(l.uitleg||"")}">${esc(l.titel)}${l.enkelHoofd ? " 🔒" : ""}</a>`).join("")}</div></section>` : ""}
    ${(B.bib.info||[]).map(b => `<details class="pblok infoblok" ${b.id==="bevestigen"?"open":""}><summary><h3>${esc(b.titel)}</h3></summary><div class="inh">${tekst(b.tekst)}</div>${autoBlok(b.auto)}</details>`).join("")}`;
  if (v.querySelector("#iE")) v.querySelector("#iE").onclick = infoEditor;
}
function infoEditor(){
  const I = JSON.parse(JSON.stringify(B.bib.info || [])), L = JSON.parse(JSON.stringify(B.bib.links || []));
  const o = dlg(`<h2>Info bewerken</h2><div id="ie"></div><div id="fout" class="fout" role="alert"></div><div class="acties"><button class="btn" id="ok">Opslaan</button><button class="btn rand" id="x">Annuleren</button></div>`);
  o.querySelector(".dlg").classList.add("breed");
  const lees = () => { I.forEach((b, i) => { b.titel = o.querySelector(`[data-it="${i}"]`).value; b.tekst = o.querySelector(`[data-ix="${i}"]`).value; b.auto = o.querySelector(`[data-ia="${i}"]`).value; });
    const ls = o.querySelector("#iL").value.split("\n").map(l => l.split("|").map(s => s.trim())).filter(a => a[0] && a[1]);
    L.length = 0; ls.forEach(a => L.push({titel:a[0], url:a[1], uitleg:a[2]||"", enkelHoofd:/^h(oofd)?$/i.test(a[3]||"")})); };
  const teken = () => {
    o.querySelector("#ie").innerHTML = `<label for="iL">Links (één per regel: titel | https:&#47;&#47;… | uitleg | h = enkel hoofdtrainers)</label><textarea id="iL" style="min-height:90px">${esc(L.map(l => [l.titel, l.url, l.uitleg||"", l.enkelHoofd?"h":""].join(" | ")).join("\n"))}</textarea>`
      + I.map((b, i) => `<fieldset class="eblok"><legend>Blok ${i+1}</legend><div class="rij2"><div><label>Titel</label><input type="text" data-it="${i}" maxlength="100" value="${esc(b.titel)}"></div>
        <div><label>Automatisch aanvullen met</label><select data-ia="${i}"><option value="">—</option><option value="zones" ${b.auto==="zones"?"selected":""}>zones uit het schema</option><option value="doelen" ${b.auto==="doelen"?"selected":""}>doelen uit het schema</option></select></div></div>
        <label>Tekst</label><textarea data-ix="${i}" maxlength="5000">${esc(b.tekst)}</textarea>
        <div class="acties"><button type="button" class="btn rand klein" data-iop="${i}">↑</button><button type="button" class="btn rand klein" data-iweg="${i}">✕ Blok</button></div></fieldset>`).join("")
      + `<div class="acties"><button type="button" class="btn rand klein" id="iPlus">+ Blok</button></div>`;
    const q = o.querySelector("#ie"), her = f => () => { lees(); f(); teken(); };
    q.querySelectorAll("[data-iop]").forEach(b => b.onclick = her(() => { const i = Number(b.dataset.iop); if (i) [I[i-1], I[i]] = [I[i], I[i-1]]; }));
    q.querySelectorAll("[data-iweg]").forEach(b => b.onclick = her(() => I.splice(Number(b.dataset.iweg), 1)));
    q.querySelector("#iPlus").onclick = her(() => I.push({id:"", titel:"", tekst:"", auto:""}));
  };
  teken();
  o.querySelector("#x").onclick = o.sluit;
  o.querySelector("#ok").onclick = async () => { lees(); o.querySelector("#ok").disabled = true;
    try { bibNa(await gs("bewaarInfo", I, L)); o.sluit(); renderInfo(); melding("Opgeslagen."); } catch(e){ o.querySelector("#fout").textContent = e.message; o.querySelector("#ok").disabled = false; } };
}
document.addEventListener("click", e => { const b = e.target.closest && e.target.closest("[data-plan]"); if (b && B.bib){ e.preventDefault(); planDetail(b.dataset.plan); } });
document.querySelectorAll("#htabs button").forEach(b => b.onclick = () => toonTab(b.dataset.t));

function huidigeWeek(){
  const nu = VANDAAG(); let best = null;
  for (const [w, st] of Object.entries(S.meta.weken)){ const s = dnIso(st); if (nu >= s && nu <= s+6) return Number(w); if (nu >= s) best = Number(w); }
  return best ?? Math.min(...Object.keys(S.meta.weken).map(Number));
}
function naarWeek(delta){ const ws = Object.keys(S.meta.weken).map(Number).sort((a,b)=>a-b), i = ws.indexOf(S.wnr)+delta; if (i >= 0 && i < ws.length){ S.wnr = ws[i]; render(); window.scrollTo({top:0}); } }
/* ---- laden: v8 eerst de bewaarde gegevens (KC), dan nagaan of ze nog actueel zijn ---- */
const EIGEN_STEMPELS = ["tlog", "not", "bib", "opm"];   // wat dit portaal zelf wijzigt (na een eigen wijziging niet als 'nieuw' melden)
let CACHE = null, naT = null;
const lokaalVandaag = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
function pasToe(r, tl){ S.meta = r.meta; S.jaar = r.meta.jaar; S.plan = (r.plan||[]).map(x => ({...x, dn:dnIso(x.d)})); S.items = tl.items || {}; S.vandaag = tl.vandaag; }
function cacheStaat(){ return KC.kopie({r:{meta:S.meta, plan:S.plan.map(({dn, ...x}) => x)}, tl:{items:S.items, vandaag:S.vandaag}, bib:{bib:B.bib, kanBewerken:B.kan, wie:B.wie, notities:B.notities, fout:B.fout}, om:{items:O.items, bijgewerkt:O.bijgewerkt, van:O.van, tot:O.tot, fout:O.fout, ingekort:O.ingekort}}); }
async function haalAlles(){
  const jaren = await gs("getJaren"); if (!jaren.length) throw new Error("Geen jaar ingesteld.");
  const j = Number(jaren[0]?.jaar ?? jaren[0]);
  const stP = Promise.resolve(null);   /* KKYKC-app: geen browsercache */   // tegelijk: vingerafdruk van wat we nu ophalen
  B.fout = "";
  const [r, tl, , om] = await Promise.all([gs("getPlanning", j, false, true), gs("getTrainerslog", j), laadBib(), laadOpm()]);
  pasToe(r, tl); pasOpmToe(om); B.volPlan = null;
  const st = await stP;
  CACHE = {t:Date.now(), st, ...cacheStaat()};
  if (st && !B.fout) KC.bewaar("portaal", CACHE);
}
async function controleer(){
  KC.balk("controle", CACHE.t);
  let st;
  try { st = null; }   /* KKYKC-app: niet gebruikt (geen browsercache) */
  catch(e){ return KC.balk("fout", CACHE.t, /not found|niet gevonden|getStempels/i.test(e.message) ? "servercode nog niet bijgewerkt" : e.message, vernieuw); }
  const d = KC.verschil(CACHE.st, st);
  if (!d.length) KC.balk("actueel", CACHE.t); else KC.balk("nieuw", CACHE.t, d, () => vernieuw(d));
}
async function vernieuw(delen){
  KC.balk("bezig");
  const oudeWeek = S.wnr;
  try {
    await haalAlles();
    S.wnr = (delen||[]).includes("dag") || !S.meta.weken[oudeWeek] ? huidigeWeek() : oudeWeek;
    toonTab(B.tab); KC.balk("klaar");
  } catch(e){ KC.balk("misl", CACHE && CACHE.t, e.message, () => vernieuw(delen)); }
}
/* na een eigen wijziging (bevestiging, notitie, bibliotheek …): bewaarde gegevens + stempels van die onderdelen bijwerken */
function naSchrijf(){
  clearTimeout(naT);
  naT = setTimeout(async () => {
    if (!CACHE || !S.meta) return;
    let st = null;   /* KKYKC-app */
    const nst = {...(CACHE.st||{})}; if (st) EIGEN_STEMPELS.forEach(k => nst[k] = st[k]);
    CACHE = {...CACHE, ...cacheStaat(), st:nst}; KC.bewaar("portaal", CACHE);
  }, 1500);
}
async function start(){
  const c = await KC.lees("portaal");
  if (c){
    try {
      pasToe(c.r, c.tl); pasBibToe(c.bib); pasOpmToe(c.om); CACHE = c;
      if (S.vandaag < lokaalVandaag()) S.vandaag = lokaalVandaag();   // 'vandaag' van de bewaarde gegevens kan voorbij zijn
      S.wnr = huidigeWeek(); toonTab(B.tab);
      controleer();
      return;
    } catch(e){ CACHE = null; }   // bewaarde gegevens onbruikbaar → gewoon laden
  }
  try { await haalAlles(); S.wnr = huidigeWeek(); toonTab(B.tab); }
  catch(e){ $("#app").innerHTML = `<div class="melding fout">Laden mislukt: ${esc(e.message)}</div>`; }
}
$("#vorige").onclick = () => naarWeek(-1); $("#volgende").onclick = () => naarWeek(1); $("#vandaagKnop").onclick = () => { if (S.meta){ S.wnr = huidigeWeek(); render(); } };
/* ---------- KKYKC-app (B2, 18/11/2026 – ingevoegd door bouw_app.py, bron: app/bron_b2/trainers_app.js) ----------
   Aanmelden met Google (api.js) en de API i.p.v. de Apps Script-aanroep. Niets van de gegevens wordt op het toestel bewaard
   (geen browsercache: PAGINA_WIE is leeg, dus KC staat uit). Enkel de keuze thema/weergave blijft in de browser. */
(function(){
  var st = document.createElement("style");
  st.textContent = "body.appuit #htabs, body.appuit .wrap > section, body.appuit #appAf, body.appuit #naarDashboard{display:none}" +
    " #appAanmeld{max-width:520px;margin:24px auto;padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}" +
    " #appAanmeld .mu{color:var(--muted);font-size:14px} #appAf{color:#fff;font-size:13px;margin-left:10px}";
  document.head.appendChild(st);
  var af = document.createElement("a"); af.id = "appAf"; af.href = "#"; af.textContent = "Afmelden";
  af.onclick = function(e){ e.preventDefault(); appAfmelden(); };
  var nd = document.getElementById("naarDashboard"); nd.parentNode.insertBefore(af, nd.nextSibling);
})();
function appAanmeldKaart(tekst){
  document.body.classList.add("appuit");
  $("#wie").textContent = "";
  var k = document.getElementById("appAanmeld");
  if (!k){ k = document.createElement("div"); k.id = "appAanmeld"; $(".wrap").insertBefore(k, $("#meldingen")); }
  k.hidden = false;
  k.innerHTML = "<h2>Aanmelden</h2><p>Meld je aan met het Google-account waarmee je toegang kreeg tot het trainersportaal.</p>" +
    "<p class=\u0022mu\u0022>De app ziet enkel je naam en e-mailadres, geen bestanden.</p><div id=\u0022gknop\u0022 style=\u0022min-height:44px;margin:12px 0\u0022></div>" +
    (tekst ? "<p id=\u0022appmelding\u0022 class=\u0022fout\u0022 role=\u0022alert\u0022>" + esc(tekst) + "</p>" : "") +
    "<p class=\u0022mu\u0022><a href=\u0022index.html\u0022 style=\u0022color:inherit\u0022>Start</a> · <a href=\u0022privacy.html\u0022 style=\u0022color:inherit\u0022>Privacy</a></p>";
  KKYKC.knop(document.getElementById("gknop"));
}
/* foutcodes van api.js: token/verlopen/aud → opnieuw aanmelden */
function appFoutAanmelden(code, tekst){
  if (code === "token" || code === "verlopen" || code === "aud"){ appAanmeldKaart(tekst); return true; }
  return false;
}
function appAfmelden(){
  KKYKC.afmelden();
  S.meta = null; S.plan = []; S.items = {}; B.bib = null; B.notities = []; O.items = []; CACHE = null;   /* gegevens uit het geheugen */
  $("#app").innerHTML = ""; $("#briefing").innerHTML = ""; $("#tebev").innerHTML = "";
  appAanmeldKaart("");
}
function appLaad(){
  document.body.classList.remove("appuit");
  var k = document.getElementById("appAanmeld"); if (k) k.hidden = true;
  $("#app").innerHTML = "<div class=\u0022leeg\u0022>Planning laden…</div>";
  start();
}
function appStart(){
  if (!KKYKC.ingesteld()){ $("#app").innerHTML = "<div class=\u0022melding fout\u0022>De app is nog niet ingesteld.</div>"; return; }
  KKYKC.opAanmelden(appLaad);
  if (KKYKC.aangemeld()) appLaad(); else appAanmeldKaart("");
}
appStart();
</script></body></html>
