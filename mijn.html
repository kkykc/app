<script>
/* Thema en weergave worden per toestel bewaard; sinds 11/11/2026 ook de laatst geladen gegevens van JOUW account (max. 14 dagen), om sneller te openen */
(function(){ var t = null; try { t = localStorage.getItem('kkykc-mt-thema'); } catch (e) {}
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); })();
</script>
<style>
:root{--or:#C96008;--or-ink:#9A4700;--geel:#FDE68A;--bg:#fff;--fg:#1C1712;--mu:#6E6257;--ln:#E8DDD0;--kaart:#FFFBF6;--beige:#E2D3C3;--grijs:#ECE7E1;
  --ok:#2F7D3B;--ok-bg:#DCEFDD;--warn:#9A6A00;--warn-bg:#FCEBB6;--oranje:#B4560B;--oranje-bg:#FAD9BC;--blauw:#2F6B8F;--blauw-bg:#DCEAF3;--bad:#A8261B;--bad-bg:#F6CFC9;--ctl:#2F6B8F;--atl:#C2185B;--tsb:#C96008;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130F;--fg:#F3ECE4;--mu:#B2A595;--ln:#3A3027;--kaart:#211B15;--beige:#4A3B2E;--grijs:#2C2620;--or-ink:#F0A060;
  --ok:#7FCB8A;--ok-bg:#1F3A24;--warn:#E9C25A;--warn-bg:#3D3112;--oranje:#F0A060;--oranje-bg:#43280F;--blauw:#7DB3D6;--blauw-bg:#1C2D3A;--bad:#F08A7E;--bad-bg:#47201B;--ctl:#7DB3D6;--atl:#F48FB1;--tsb:#F0A060;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130F;--fg:#F3ECE4;--mu:#B2A595;--ln:#3A3027;--kaart:#211B15;--beige:#4A3B2E;--grijs:#2C2620;--or-ink:#F0A060;
  --ok:#7FCB8A;--ok-bg:#1F3A24;--warn:#E9C25A;--warn-bg:#3D3112;--oranje:#F0A060;--oranje-bg:#43280F;--blauw:#7DB3D6;--blauw-bg:#1C2D3A;--bad:#F08A7E;--bad-bg:#47201B;--ctl:#7DB3D6;--atl:#F48FB1;--tsb:#F0A060;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--fg);font-size:15px}
header{background:var(--or);color:#fff;padding:12px 16px}
.hin{max-width:900px;margin:auto;display:flex;gap:10px;align-items:center}.hin>div{flex:1;min-width:0}
header h1{margin:0;font-size:20px}header #wie{font-size:13px;opacity:.9}
.tknop{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.75);border-radius:6px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
main{padding:12px 16px 30px;max-width:900px;margin:auto}
h2{font-size:17px;margin:20px 0 8px;border-bottom:2px solid var(--or);padding-bottom:4px}
.dag{background:var(--kaart);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;margin:8px 0}
.dag b{display:block;margin-bottom:4px}.inh{white-space:pre-wrap;font-size:14px}.mu{color:var(--mu);font-size:13px}
.chip{display:inline-block;padding:2px 8px;border-radius:12px;font-size:13px;font-weight:bold;color:#222;margin:4px 6px 4px 0;cursor:pointer;border:0;font-family:inherit}
.chip span{display:inline-block;margin-left:6px;background:#fff8;border-radius:50%;width:17px;text-align:center}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--ln);padding:6px 4px;text-align:left;vertical-align:top}
.knop{display:inline-block;background:var(--or);color:#fff;text-decoration:none;padding:10px 16px;border-radius:8px;font-weight:bold;margin:8px 0;border:0;font:inherit;font-weight:bold;cursor:pointer}
.balk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.weergave{display:flex;gap:4px}.weergave button{border:1px solid var(--ln);background:var(--kaart);color:var(--fg);border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.weergave button[aria-pressed="true"]{background:var(--or);color:#fff;border-color:var(--or)}
#pop{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:16px;z-index:9}
#pop .k{background:var(--bg);color:var(--fg);border-radius:10px;max-width:480px;width:100%;padding:16px;max-height:85vh;overflow:auto;border-top:4px solid var(--or)}
details.ex{margin:6px 0;border:1px solid var(--li,#ddd);border-radius:8px;padding:4px 10px}details.ex summary{cursor:pointer;font-weight:bold;font-size:14px;padding:4px 0}details.ex h4{margin:8px 0 2px;font-size:14px}details.ex ul{margin:4px 0 4px 18px;padding:0}details.ex li{margin:3px 0}
#pop h3{margin:0 0 2px}#pop .blok{margin-top:10px}#pop .blok b{display:block;color:var(--or-ink)}
.scroll{overflow-x:auto}
/* kalender */
.kal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.kal .kh{font-size:11px;font-weight:bold;color:var(--mu);text-align:center;padding:2px 0}
.kal .wkk{grid-column:1/-1;font-size:12px;color:var(--mu);margin-top:8px;border-top:2px solid var(--beige);padding-top:3px}
.kal .wkk b{color:var(--fg)}
.kd{border:1px solid var(--ln);background:var(--kaart);border-radius:6px;min-height:58px;padding:3px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kd.vandaag{outline:2px solid var(--or)}.kd.weg{opacity:.45}
.kd .dnr{font-size:10.5px;color:var(--mu)}
.wo{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--mu);background:var(--grijs);color:var(--fg);border-radius:4px;padding:3px 4px;font:inherit;font-size:11px;line-height:1.25;cursor:pointer;overflow-wrap:anywhere}
.wo b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wo .dl{display:block;height:4px;border-radius:2px;margin-top:2px}
.wo .lang{display:none}
.c-groen{border-color:var(--ok);background:var(--ok-bg)}.c-geel{border-color:var(--warn);background:var(--warn-bg)}
.c-oranje{border-color:var(--oranje);background:var(--oranje-bg)}.c-extra{border-color:var(--blauw);background:var(--blauw-bg)}
.c-niet{border-color:var(--mu);background:transparent;opacity:.75}
.c-gepland{border:1px dashed var(--beige);border-left:4px solid var(--beige);background:transparent}
.c-weg{border-color:var(--bad);background:transparent;opacity:.8}.c-weg b{text-decoration:line-through}   /* B8: niet doorgegaan (trainer) */
.legende{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mu);margin:4px 0 8px}
.legende i{display:inline-block;width:12px;height:10px;border-left:4px solid;margin-right:4px;vertical-align:middle;border-radius:2px}
.vgl{width:100%;font-size:14px;margin-top:6px}.vgl th{color:var(--mu);font-weight:normal;width:34%}
.kd-t{width:100%;font-size:13.5px;margin-top:4px}.kd-t th,.kd-t td{padding:5px 6px}.kd-t thead th{font-size:12px;color:var(--mu);border-bottom:2px solid var(--or)}
.kd-t tbody th{color:var(--mu);font-weight:normal;white-space:nowrap}
.kd-z{width:auto;margin-top:6px}.kd-z th,.kd-z td{padding:2px 8px;border:1px solid var(--ln);font-size:12px;text-align:center}
.pil{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:bold;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-grijs{background:var(--grijs);color:var(--mu)}
#pop .k{max-width:560px}
@media (max-width:480px){.kd-t th,.kd-t td{padding:4px 3px;font-size:12.5px}}
@media (min-width:700px){.kal{gap:4px}.kd{min-height:84px;padding:4px}.wo{font-size:12px;padding:4px 6px}.wo b{font-size:12px}.wo .lang{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}.kal .kh{font-size:12px}}
.p-blauw{background:var(--blauw-bg);color:var(--blauw)}.p-bad{background:var(--oranje-bg);color:var(--oranje)}
h3{margin:14px 0 6px}
#mtbalk{max-width:900px;margin:10px auto 0;padding:8px 12px;border-radius:8px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:var(--grijs);border:1px solid var(--ln)}
#mtbalk[hidden]{display:none}
#mtbalk.nieuw{background:var(--oranje-bg);border-color:var(--oranje)}#mtbalk.ok{background:var(--ok-bg);border-color:var(--ok)}
#mtbalk button{margin-left:auto;background:var(--or);color:#fff;border:0;border-radius:6px;padding:6px 14px;font:inherit;font-size:13px;font-weight:bold;cursor:pointer}
@media (max-width:930px){#mtbalk{margin:10px 12px 0}}
/* B7 (22/11/2026, app): trainingsstatus, compliance, grafiek zoals het dashboard */
.tegels{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:8px 0}
.tegel{background:var(--kaart);border:1px solid var(--ln);border-radius:8px;padding:8px 10px}.tegel .k{font-size:12px;color:var(--mu)}.tegel .v{font-size:22px;font-weight:bold;margin:2px 0}.tegel .f{font-size:12px;color:var(--mu)}
svg.pmc text{fill:var(--mu);font-family:Arial,Helvetica,sans-serif;font-size:11px}svg.pmc .grid{stroke:var(--ln)}
.legende i.bol{width:9px;height:9px;border:0;border-radius:50%}
details.ex{border-color:var(--ln)}
</style></head>
<body>
<header><div class="hin"><div><h1>Mijn trainingen</h1><div id="wie">Laden…</div></div>
  </div></header>
<div id="mtbalk" role="status" hidden></div>
<main id="inhoud"><p class="mu">Je gegevens worden geladen…</p></main>
<div id="pop" onclick="if(event.target===this)sluit()"><div class="k" id="popk" role="dialog" aria-modal="true"></div></div>
<script>
var D = null, DAGEN = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'], DK = ['ma','di','wo','do','vr','za','zo'];
var WEERGAVE = 'kalender', KAL = [];
try { var w0 = localStorage.getItem('kkykc-mt-weergave'); if (w0 === 'lijst' || w0 === 'kalender') WEERGAVE = w0; } catch (e) {}
function themaHuidig(){ var t = document.documentElement.getAttribute('data-theme'); if (t === 'light' || t === 'dark') return t;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
function themaKnop(){ var b = document.getElementById('btnThema'), d = themaHuidig() === 'dark'; if (!b) return;
  b.textContent = d ? '☀ Licht' : '☾ Donker'; b.setAttribute('aria-pressed', d ? 'true' : 'false'); b.title = d ? 'Lichte modus' : 'Donkere modus'; }
function themaWissel(){ var n = themaHuidig() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n);
  try { localStorage.setItem('kkykc-mt-thema', n); } catch (e) {} themaKnop(); }
themaKnop();
function esc(s){ return String(s == null ? '' : s).replace(/[&<>'"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]; }); }
function dnr(d){ var p = d.split('-'); return Math.round(Date.UTC(+p[0], +p[1]-1, +p[2]) / 864e5); }
function ddmm(n){ var x = new Date(n * 864e5); return x.getUTCDate() + '/' + (x.getUTCMonth() + 1); }
function wdag(n){ return ((n % 7) + 10) % 7; }   /* ma = 0 */
function datum(d){ var p = d.split('-'), x = new Date(Date.UTC(+p[0], +p[1]-1, +p[2])); return DAGEN[x.getUTCDay()] + ' ' + (+p[2]) + '/' + (+p[1]); }
function isoWeek(n){ var thu = n - wdag(n) + 3, j1 = Math.round(Date.UTC(new Date(thu * 864e5).getUTCFullYear(), 0, 1) / 864e5); return Math.floor((thu - j1) / 7) + 1; }
function getal(s){ var m = /(\d+(?:[.,]\d+)?)/.exec(String(s || '')); return m ? Number(m[1].replace(',', '.')) : null; }
function minuten(s){   /* zelfde lezing als het dashboard: u:mm, 1u15, 75', 75 min, 1,5u */
  var t = String(s || '').trim().toLowerCase(), m;
  if (!t) return null;
  if ((m = /^(\d+):(\d{1,2}):(\d{1,2})$/.exec(t))) return +m[1] <= 6 ? +m[1] * 60 + +m[2] + m[3] / 60 : null;
  if ((m = /^(\d+):(\d{1,2})$/.exec(t))) return +m[1] <= 6 ? +m[1] * 60 + +m[2] : null;
  if ((m = /^(\d+)[.,](\d+)\s*(u|uur|h)$/.exec(t))) return Number(m[1] + '.' + m[2]) * 60;
  if ((m = /^(?:(\d+)\s*(?:u|uur|h)\s*)?(?:(\d+)\s*(?:min|m|minuten|')?)?\s*(?:(\d+)\s*(?:s|sec|"))?$/.exec(t)) && (m[1] || m[2])) {
    if (!m[1] && /^\d+$/.test(t) && +m[2] <= 5) return null;
    return (+m[1] || 0) * 60 + (+m[2] || 0) + (+m[3] || 0) / 60;
  }
  return null;
}
function kleur(n){ var k = (D.doelen[n] || {}).kleur || '#eeeeee'; return /^#[0-9a-f]{3,8}$/i.test(k) ? k : '#eeeeee'; }
function chip(i){ var p = D.plan[i]; if (!p.doel) return '';
  return '<button class="chip" style="background:' + kleur(p.doel) + '" onclick="toon(' + i + ')">' + esc(p.doel) + '<span>?</span></button>'; }
function toon(i){
  var p = D.plan[i], d = D.doelen[p.doel] || {}, wi = D.weekinfo[p.w] || {}, h = '';
  h += '<h3><span class="chip" style="background:' + kleur(p.doel) + '">' + esc(p.doel) + '</span></h3>';
  if (d.vakterm) h += '<div class="mu">' + esc(d.vakterm) + '</div>';
  [['Wat', d.wat], ['Waarom', d.waarom], ['Hoe voelt het', d.voelt]].forEach(function(x){ if (x[1]) h += '<div class="blok"><b>' + x[0] + '</b>' + esc(x[1]) + '</div>'; });
  if (p.waarom) h += '<div class="blok"><b>Waarom nu</b>' + esc(p.waarom) + '</div>';
  h += '<div class="blok mu">Week ' + p.w + (wi.fase ? ' · fase ' + esc(wi.fase) : '') + (wi.focus ? ' · focus: ' + esc(wi.focus) : '') + (p.doel_auto ? '<br>(automatisch toegekend)' : '') + '</div>';
  h += '<p><button class="knop" onclick="sluit()">Sluiten</button></p>';
  popup(h);
}
function popup(h){ document.getElementById('popk').innerHTML = h; document.getElementById('pop').style.display = 'flex'; }
function sluit(){ document.getElementById('pop').style.display = 'none'; }
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') sluit(); });
function toonFout(t){ document.getElementById('wie').textContent = ''; document.getElementById('inhoud').innerHTML = '<p>' + esc(t) + '</p>'; }

/* ---------- rekenen zoals het dashboard (TSS-schaal, verwachte RPE, categorie, tijd/afstand lezen) ----------
   Parameters uit het schema (D.rek, door de backend meegestuurd); TSS_STD = zelfde standaard als kkykc_dashboard.html. */
var TSS_STD = {
  rpe_per_uur: {'0':0,'1':20,'2':30,'3':40,'4':50,'5':60,'6':70,'7':80,'8':100,'9':120,'10':140},
  zone_rpe: {T0:1, T1:2.5, T2:5, T3:6, T4:7.5, TMAX:9},
  land_rpe: {'Loop rustig':3, 'Loop tempo':6, 'Fietsen':2.5, 'Core-stability':3, 'Kracht zaal':5, 'Overig':3},
  soort_rpe: {kayak:3, kajak:3, lopen:3.5, loop:3.5, fietsen:2.5, fiets:2.5, hometrainer:2.5, kracht:5, chup:5, core:3, houding:2, ergo:4, zwemmen:3.5, wandelen:1, rolschaatsen:2.5, _standaard:3},
  rem_rpe: 1.0, rem_zones: ['T1','T2','T3','T4','TMAX'], delta_rpe: 1.5
};
function R(){ return (D && D.rek) || {}; }
function T(){ var t = {}, k, x = R().tss || {}; for (k in TSS_STD) t[k] = TSS_STD[k]; for (k in x) t[k] = x[k]; return t; }
function fmt(x, nd){ if (nd == null) nd = 1; return x == null || !isFinite(x) ? '–' : x.toFixed(nd).replace('.', ','); }
function sgnN(x, nd){ if (nd == null) nd = 1; if (x == null || !isFinite(x)) return '–'; var v = Number(x.toFixed(nd)); return v === 0 ? fmt(0, nd) : (v > 0 ? '+' : '') + fmt(v, nd); }
function sgnPct(u, g){ if (u == null || !g) return '–'; var q = u / g - 1; return (q > 0 ? '+' : '') + Math.round(q * 100) + ' %'; }
function tssUur(rpe){ var t = T().rpe_per_uur, r = Math.max(0, Math.min(10, rpe)), a = Math.floor(r), b = Math.min(10, a + 1); return t[a] + (t[b] - t[a]) * (r - a); }
function rpeVanTssUur(x){ var t = T().rpe_per_uur; for (var r = 0; r < 10; r++) if (x <= t[r + 1]) return r + (x - t[r]) / ((t[r + 1] - t[r]) || 1); return 10; }
/* kolom KA (extra uitleg) staat in het schema meestal al achteraan in de inhoud (na ' | '): enkel tonen als ze er nog niet in zit */
function normTxt(t){ return String(t || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
function extraTekst(p){ var x = normTxt(p.ext); return x && normTxt(p.inh).indexOf(x) < 0 ? p.ext : ''; }
function metRem(p){ return /\bmet\s+rem\b/i.test((p.inh || '') + ' ' + (p.ext || '')); }
function planTss(p){
  var t = T(), rem = metRem(p) ? (t.rem_rpe || 0) : 0, tss = 0;
  (R().zones || []).forEach(function(z, i){
    var r = (t.zone_rpe[z] != null ? t.zone_rpe[z] : 3) + ((t.rem_zones || []).indexOf(z) >= 0 ? rem : 0);
    tss += ((p.z && p.z[i]) || 0) / 60 * tssUur(r);
  });
  if (p.lm) tss += p.lm / 60 * tssUur(t.land_rpe[p.lt] != null ? t.land_rpe[p.lt] : (t.land_rpe.Overig != null ? t.land_rpe.Overig : 3));
  return tss;
}
function soortRpe(soort, c){
  var m = T().soort_rpe, s = String(soort || '').toLowerCase(), ks = Object.keys(m).sort(function(a, b){ return b.length - a.length; });
  for (var i = 0; i < ks.length; i++) if (ks[i][0] !== '_' && s.indexOf(ks[i]) >= 0) return [m[ks[i]], ks[i]];
  return c === 'water' ? [m.kayak != null ? m.kayak : 3, 'water (T1)'] : [m._standaard != null ? m._standaard : 3, 'standaard'];
}
function categorie(soort){   /* zoals het dashboard: exacte soort, daarna deelwoord (> 2 tekens); anders de oude trefwoorden */
  var s = String(soort || '').trim().toLowerCase(), map = R().soort_naar_categorie || {}, c, i;
  if (!s) return '';
  for (c in map) if ((map[c] || []).indexOf(s) >= 0) return c;
  for (c in map){ var w = (map[c] || []).slice().sort(function(a, b){ return b.length - a.length; });
    for (i = 0; i < w.length; i++) if (w[i].length > 2 && s.indexOf(w[i]) >= 0) return c; }
  return cat(s);
}
function gevoelScore(gv){
  var g = R().gevoel_schaal || {}, k = String(gv || '').replace(/️/g, '').trim(), e;
  if (!k) return null;
  var kk = /^[\x00-\x7f]*$/.test(k) ? k.toUpperCase() : k;
  if (g[kk] != null) return g[kk];
  for (e in g) if (e.toLowerCase() === k.toLowerCase()) return g[e];
  for (e in g) if (!/^[\x00-\x7f]*$/.test(e) && k.indexOf(e) === 0) return g[e];
  var w = k.toLowerCase().replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim();
  for (e in g) if (e.toLowerCase() === w) return g[e];
  return null;
}
/* planning: verwachte belasting en RPE (worden pas getoond als de sporter de training invulde) */
function bereidPlan(){
  D.plan.forEach(function(p){
    if (!p.cat) p.cat = cat((p.type || '') + ' ' + (p.inh || '')) || 'overig';   /* C-groep: enkel tekst */
    p.tss = (p.z || p.lm) ? planTss(p) : null;
    p.rpeExp = p.tss != null && p.duur > 0 && p.cat !== 'overig' ? rpeVanTssUur(p.tss / (p.duur / 60)) : null;
  });
}
/* logboek: tijd, afstand, RPE, gevoel en categorie lezen met dezelfde grenzen als het dashboard */
function bereidLogboek(){
  var dr = R().drempels || {}, tmin = dr.tijd_min || 5, tmax = dr.tijd_max || 480, vmin = dr.snelheid_water_min_kmu || 3, vmax = dr.snelheid_water_max_kmu || 17;
  D.logboek.forEach(function(e){
    e.min = minuten(e.tijd); if (e.min != null && !(e.min >= tmin && e.min <= tmax)) e.min = null;

/* vooruitzicht (projectie() van het dashboard): plan van de komende weken × eigen uitvoering van de laatste 28 dagen */

/* ---------- B8 (22/11/2026): aanpassingen van de trainer (trainersportaal) op kalender, lijst en detail ----------

function tlReden(p){ var r = p && p.tl && TL_REDEN_TXT[p.tl.r]; return r ? ' · ' + r : ''; }

    if (o.km != null && p.km != null && Math.abs(p.km - o.km) >= 0.05) w.push('afstand ' + fmt(o.km, 1) + ' → ' + fmt(p.km, 1) + ' km');
  }
  var t = p.tl.s === 'n' ? 'Deze training ging niet door' + (p.tl.r ? ' (' + (TL_REDEN_TXT[p.tl.r] || '') + ')' : '') + '.'
        : p.tl.s === 'a' ? 'De trainer paste deze training aan' + (p.tl.r ? ' (' + (TL_REDEN_TXT[p.tl.r] || '') + ')' : '') + '.' : 'De trainer bevestigde: zoals gepland.';
  return '<div class="blok" style="border-left:4px solid var(--' + (p.tl.s === 'n' ? 'bad' : p.tl.s === 'a' ? 'warn' : 'ok') + ');padding-left:8px"><b>Trainer</b>' + esc(t) +
    (p.tl.inh ? '<div class="inh">Gedaan: ' + esc(p.tl.inh) + '</div>' : '') + (w.length ? '<div class="mu">' + esc(w.join(' · ')) + '. De vergelijking hieronder gebruikt de aangepaste waarden.</div>' : '') + '</div>';
}

/* ---------- laden: v8 (11/11/2026) eerst de laatst geladen gegevens, dan de nieuwe op de achtergrond ----------
   De ophaling langs de backend duurt enkele seconden. Daarom: bewaarde gegevens (per account, deze browser) meteen tonen,
   intussen opnieuw ophalen; verschillen ze, dan bovenaan 'Nieuwe gegevens beschikbaar' + Vernieuwen. */
var MT_WIE = '';   /* KKYKC-app: niets bewaren op het toestel */   /* ingevuld door doGet (Front_Code.gs) */
var MT_SLEUTEL = MT_WIE.indexOf('@') > 0 ? 'kkykc-mt-cache|' + MT_WIE.toLowerCase() + '|c1' : null;
var MT_CACHE = null, MT_NIEUW = null;
function twee(n){ return (n < 10 ? '0' : '') + n; }
function lokaalVandaag(){ var d = new Date(); return d.getFullYear() + '-' + twee(d.getMonth() + 1) + '-' + twee(d.getDate()); }
function wanneer(t){
  var d = new Date(t), nu = new Date(), u = twee(d.getHours()) + ':' + twee(d.getMinutes());
  var v = Math.round((new Date(nu.getFullYear(), nu.getMonth(), nu.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  return v === 0 ? 'vandaag ' + u : v === 1 ? 'gisteren ' + u : d.getDate() + '/' + (d.getMonth() + 1) + ' ' + u;
}
function mtLees(){ if (!MT_SLEUTEL) return null; try { var c = JSON.parse(localStorage.getItem(MT_SLEUTEL) || 'null'); return c && c.t && c.d && Date.now() - c.t < 14 * 864e5 ? c : null; } catch (e) { return null; } }
function mtBewaar(t){ if (!MT_SLEUTEL) return; try { localStorage.setItem(MT_SLEUTEL, JSON.stringify({ t: Date.now(), d: t })); MT_CACHE = { t: Date.now(), d: t }; } catch (e) {} }
function mtWis(){ if (!MT_SLEUTEL) return; try { localStorage.removeItem(MT_SLEUTEL); } catch (e) {} }
function balk(h, soort){ var b = document.getElementById('mtbalk'); if (!h){ b.hidden = true; b.innerHTML = ''; return; } b.className = soort || ''; b.innerHTML = h; b.hidden = false; }
/* geeft een foutboodschap terug, of null als het getoond is */
function toonData(t, uitCache){
  var x; try { x = JSON.parse(t); } catch (e) { return 'Onverwacht antwoord van de server.'; }
  if (x.fout) return x.fout;
  D = x; D.logboek = D.logboek || []; D.rek = D.rek || {};
  if (uitCache && D.vandaag && D.vandaag < lokaalVandaag()) D.vandaag = lokaalVandaag();   /* 'vandaag' van de bewaarde gegevens kan voorbij zijn */
  bereidPlan(); bereidLogboek(); teken();
  return null;
}
function toonNieuw(){
  var f = toonData(MT_NIEUW, false); if (f) return toonFout(f);
  mtBewaar(MT_NIEUW); MT_NIEUW = null;
  balk('Gegevens bijgewerkt.', 'ok'); setTimeout(function(){ balk(null); }, 4000);
}
MT_CACHE = mtLees();
if (MT_CACHE){
  try { if (toonData(MT_CACHE.d, true)) MT_CACHE = null; } catch (e) { MT_CACHE = null; }
  if (MT_CACHE) balk('<span>Getoond: je gegevens van <b>' + wanneer(MT_CACHE.t) + '</b> · nagaan of er nieuwe zijn…</span>');
  else mtWis();
}
/* F1 (14/11/2026): tijdslimiet + opnieuw proberen, zoals dashboard en portaal (soms start Google de aanroep niet en bleef de pagina hangen).
   Lezen mag veilig herhaald worden: max. 3 pogingen van 60 s. */
var MT_LIMIET = 60000, MT_POGINGEN = 3;
function mtHaal(n){
  var klaar = false;
  var t = setTimeout(function(){
    if (klaar) return; klaar = true;
    if (n < MT_POGINGEN){
      if (!MT_CACHE) balk('<span>De server antwoordt traag, opnieuw proberen (' + (n + 1) + '/' + MT_POGINGEN + ')…</span>');
      return mtHaal(n + 1);
    }
    mtNietGelukt('geen antwoord van de server na ' + (MT_LIMIET / 1000) + ' s');
  }, MT_LIMIET);
  KKYKC.gs('mijnData').then(function(r){ if (klaar) return; klaar = true; clearTimeout(t); mtOntvangen(JSON.stringify(r)); },
    function(e){ if (klaar) return; klaar = true; clearTimeout(t); if (appFoutAanmelden(e)) return; mtNietGelukt(e && e.message ? e.message : e); });
}
function mtOntvangen(t){
  var x = null; try { x = JSON.parse(t); } catch (e) {}
  if (!MT_CACHE || (x && x.fout)){   /* geen bewaarde gegevens, of geen toegang meer → gewoon tonen wat de server zegt */
    balk(null); var f = toonData(t, false);
    if (f){ mtWis(); return toonFout(f); }
    return mtBewaar(t);
  }
  if (!x){ return balk('<span>Kon niet nagaan of er nieuwe gegevens zijn. Getoond: je gegevens van <b>' + wanneer(MT_CACHE.t) + '</b>.</span><button type="button" onclick="location.reload()">Opnieuw proberen</button>', 'nieuw'); }
  if (t === MT_CACHE.d){ mtBewaar(t); balk('Je gegevens zijn up-to-date.', 'ok'); return setTimeout(function(){ balk(null); }, 4000); }
  MT_NIEUW = t;
  balk('<span><b>Nieuwe gegevens beschikbaar.</b> Getoond: je gegevens van <b>' + wanneer(MT_CACHE.t) + '</b>.</span><button type="button" onclick="toonNieuw()">Vernieuwen</button>', 'nieuw');
}
function mtNietGelukt(m){
  if (!MT_CACHE){ balk(null); return toonFout('Laden mislukt: ' + m); }
  balk('<span>Kon niet nagaan of er nieuwe gegevens zijn (' + esc(m) + '). Getoond: je gegevens van <b>' + wanneer(MT_CACHE.t) + '</b>.</span><button type="button" onclick="location.reload()">Opnieuw proberen</button>', 'nieuw');
}
/* ---------- KKYKC-app (B1, 18/11/2026 – ingevoegd door bouw_app.py, bron: app/bron_b1/mijn_app.js) ----------
   Aanmelden met Google (api.js) en de API (mijnData) i.p.v. de Apps Script-aanroep. B3i: je eigen gegevens op het toestel (zie onder). */
/* B3i: je eigen gegevens max. 14 dagen op dit toestel (meteen tonen, daarna gecontroleerd; gewist bij Afmelden) */
KKYKC.toestel({ fns: ['mijnData'], dagen: 14 });
function appAanmeldKaart(melding){
  document.getElementById('wie').textContent = '';
  document.getElementById('inhoud').innerHTML = '<h2>Aanmelden</h2><p>Meld je aan met het Google-account waarmee je het trainingsformulier invult.</p>' +
    '<p class="mu">De app ziet enkel je naam en e-mailadres, geen bestanden.</p><div id="gknop" style="min-height:44px;margin:12px 0"></div>' +
    (melding ? '<p id="appmelding" style="color:var(--oranje)">' + esc(melding) + '</p>' : '') +
    '<p class="mu"><a href="index.html" style="color:inherit">Start</a> · <a href="privacy.html" style="color:inherit">Privacy</a></p>';
  KKYKC.knop(document.getElementById('gknop'));
}
function appFoutAanmelden(e){
  if (e && (e.code === 'token' || e.code === 'verlopen' || e.code === 'aud')) { balk(null); appAanmeldKaart(e.message); return true; }
  if (e && (e.code === 'test' || e.code === 'rol')) { if (!window.kkykcNaarAanvraag){ window.kkykcNaarAanvraag = true; location.replace("index.html?blijf=1"); } return true; }   /* B3h: geen tester of geen Koppeling → aanvraag/uitleg op de startpagina */
  return false;
}
function appAfmelden(){ KKYKC.afmelden(); D = null; balk(null); appAanmeldKaart(''); }
function appLaad(){
  document.getElementById('wie').textContent = 'Laden…';
  document.getElementById('inhoud').innerHTML = '<p class="mu">Je gegevens worden geladen…</p>';
  mtHaal(1);
}
function appStart(){
  if (!KKYKC.ingesteld()) return toonFout('De app is nog niet ingesteld.');
  KKYKC.opAanmelden(appLaad);
  if (KKYKC.aangemeld()) appLaad(); else appAanmeldKaart('');
}
appStart();
</script>
