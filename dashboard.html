  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), "Week per sporter");
  const dag = []; for (const x of Object.values(A.sp)) if (x.inv.length) x.reeks.forEach(r=>dag.push({Sporter:x.s, Datum:isoDn(r.dn), TSS:Math.round(r.L*10)/10, CTL:Math.round(r.ctl*10)/10, ATL:Math.round(r.atl*10)/10, TSB:Math.round(r.tsb*10)/10}));
  add("Dagbelasting", dag);
  const data = XLSX.write(wb, {type:"array", bookType:"xlsx"});
  try { await dl.save({filename:`KKYKC tabellen ${S.jaar} W${A.hw} ${isoDn(VANDAAG)}.xlsx`, data}); }
  catch(e){ if (e?.code!=="cancelled" && e?.code!=="declined") melding("Downloaden mislukt ("+esc(e?.code||"fout")+").","fout"); }
}

/* ============================== toegangsbeheer (trainersportaal) ============================== */
function toegangTeller(t){
  const n = (t && t.aanvragen ? t.aanvragen : []).filter(x => x.status === "open").length;
  $("#btnToegang").innerHTML = "Toegangsbeheer" + (n ? `<span class="tg-tel">${n}</span>` : "");
}
function toegangRijen(t){
  const rijen = (t.aanvragen||[]).map(x => ({...x}));
  const gekend = new Set(rijen.map(x => x.email));
  (t.trainers||[]).concat(t.hoofd||[]).forEach(e => { if (!gekend.has(e)){ gekend.add(e); rijen.push({email:e, naam:"", tijd:"", status:"goedgekeurd", zonder:true}); } });
  rijen.forEach(x => { x.isHoofd = (t.hoofd||[]).includes(x.email); });   /* 15/11/2026: extra hoofdtrainers (zonder codewijziging) */
  const volgorde = {open:0, goedgekeurd:1, afgewezen:2};
  rijen.sort((a,b) => (volgorde[a.status]??3) - (volgorde[b.status]??3) || String(b.tijd).localeCompare(String(a.tijd)));
  return rijen;
}
function toegangKnoppen(x){
  const e = esc(x.email), k = (b, tekst, cls) => `<button type="button" class="${cls}" data-tg="${b}" data-mail="${e}">${tekst}</button>`;
  if (x.status === "open") return k("goedgekeurd","Goedkeuren","tg-g") + k("afgewezen","Afwijzen","tg-r");
  if (x.isHoofd) return k("geen_hoofd","Geen hoofdtrainer meer","tg-r");
  if (x.status === "goedgekeurd") return k("hoofd","Hoofdtrainer maken","") + k("afgewezen","Intrekken","tg-r") + (x.zonder ? k("verwijderd","Verwijderen","") : "");
  return k("goedgekeurd","Alsnog goedkeuren","tg-g") + k("verwijderd","Verwijderen","");
}
function toegangTeken(o, t){
  const rijen = toegangRijen(t), vast = t.vast || {};
  const pil = st => `<span class="tg-pil ${st==="open"?"tg-open":st==="goedgekeurd"?"tg-ok":"tg-af"}">${esc(st)}</span>`;
  const tabel = rijen.length
    ? `<table class="tg-t"><thead><tr><th>Naam</th><th>E-mail</th><th>Aangevraagd</th><th>Status</th><th>Actie</th></tr></thead><tbody>${
        rijen.map(x => `<tr><td>${esc(x.naam||"–")}</td><td>${esc(x.email)}</td><td>${esc(String(x.tijd||"").replace("T"," ")||"–")}</td><td>${x.isHoofd ? `<span class="tg-pil tg-ok">hoofdtrainer</span>` : pil(x.status)}${x.door?`<div class="muted">door ${esc(x.door)}</div>`:""}</td><td class="tg-act">${toegangKnoppen(x)}</td></tr>`).join("")
      }</tbody></table>`
    : `<p class="muted">Geen aanvragen.</p>`;
  const lijst = a => (a && a.length) ? a.map(esc).join(", ") : "–";
  o.querySelector("#toegInh").innerHTML = tabel +
    `<div class="tg-nieuw" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0"><input id="tgMail" type="email" placeholder="e-mailadres (Google-account)" style="flex:1;min-width:220px;padding:6px 8px"><button type="button" id="tgHoofd" class="tg-g">Als hoofdtrainer toevoegen</button></div>
    <p class="muted">Een hoofdtrainer ziet alles (dashboard, logboeken, planner) en kan zelf hoofdtrainers toevoegen of weghalen. Geef daarna in Drive ook <b>bewerkrecht op de map 5. Trainingen</b>, anders krijgt die "geen toegang" bij het laden.</p>
    <p class="muted">Vast in de code (niet hier te wijzigen): hoofdtrainers ${lijst(vast.hoofd)} · enkel portaal ${lijst(vast.trainers)}.</p>`;
  toegangTeller(t);
}
async function toegangDialoog(){
  document.getElementById("toegDlg")?.remove();
  const o = document.createElement("div");
  o.id = "toegDlg"; o.className = "kd-ovl";
  o.innerHTML = `<div class="kd" role="dialog" aria-modal="true" aria-labelledby="toegT">
    <div class="kd-kop"><div><h3 id="toegT">Toegangsbeheer</h3>
      <div class="muted">Goedgekeurd = enkel het trainersportaal (planning, bevestigen, notities en de opmerkingen van sporters met voornaam; geen logboeken). Kijkrecht op Schema 2026 geef je zelf in Drive, nooit op Trainingsdata.</div></div>
      <button type="button" class="kd-x" aria-label="Sluiten">×</button></div>
    <div id="toegInh" class="muted">Laden…</div></div>`;
  document.body.appendChild(o);
  const sluit = () => o.remove();
  o.onclick = async ev => {
    if (ev.target === o) return sluit();
    const n = ev.target.closest && ev.target.closest("#tgHoofd");
    if (n){ const m = String(o.querySelector("#tgMail").value||"").trim().toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/.test(m)) return melding("Vul een geldig e-mailadres in.", "fout");
      n.disabled = true; try { toegangTeken(o, await gs("beslisToegang", m, "hoofd")); melding(esc(m) + " is hoofdtrainer. Vergeet het bewerkrecht op de map 5. Trainingen niet."); } catch(e){ n.disabled = false; melding("Toevoegen mislukt ("+esc(e?.message||"fout")+").", "fout"); } return; }
    const b = ev.target.closest && ev.target.closest("button[data-tg]"); if (!b) return;
    const rij = b.closest("tr"); rij.querySelectorAll("button").forEach(x => x.disabled = true);
    try { toegangTeken(o, await gs("beslisToegang", b.dataset.mail, b.dataset.tg)); }
    catch(e){ rij.querySelectorAll("button").forEach(x => x.disabled = false); melding("Toegangsbeheer mislukt ("+esc(e?.message||e?.code||"fout")+").", "fout"); sluit(); }
  };
  o.querySelector(".kd-x").onclick = sluit;
  o.addEventListener("keydown", ev => { if (ev.key === "Escape") sluit(); });
  o.querySelector(".kd-x").focus();
  try { toegangTeken(o, await gs("getToegang")); }
  catch(e){ o.querySelector("#toegInh").textContent = "Laden mislukt ("+(e?.message||e?.code||"fout")+")."; }
}

/* ---------- KKYKC-app (B3, 19/11/2026 – ingevoegd door bouw_app.py, bron: app/bron_b3/app_pagina.js) ----------

(function(){

  document.head.appendChild(st);
})();
function appKaartBasis(){
  var k = document.getElementById("appKaart");
  if (!k){ k = document.createElement("div"); k.id = "appKaart"; k.setAttribute("role", "dialog"); k.setAttribute("aria-modal", "true"); document.body.appendChild(k); }

}
var APP_LINKS = "<p class='mu'><a href='index.html' style='color:inherit'>Start</a> · <a href='privacy.html' style='color:inherit'>Privacy</a></p>";
/* aanmelden (eerste keer of na verlopen aanmelding: de pagina blijft staan, daarna opnieuw proberen) */
function appKaart(tekst){

  k.innerHTML = "<div><h2>Aanmelden</h2><p>Meld je aan met je Google-account (hoofdtrainer).</p>" +
    "<p class='mu'>De app ziet enkel je naam en e-mailadres, geen bestanden.</p><div id='appGknop' style='min-height:44px;margin:12px 0'></div>" +
    "<p class='fout' role='alert'></p>" + APP_LINKS + "</div>";

  KKYKC.knop(document.getElementById("appGknop"));
}
function appGeenToegang(tekst){
  var k = appKaartBasis();
  k.innerHTML = "<div><h2>Geen toegang</h2><p class='fout' role='alert'></p><p class='mu'>Deze pagina is enkel voor hoofdtrainers.</p>" + APP_LINKS + "</div>";
  k.querySelector(".fout").textContent = tekst || "Geen toegang tot deze pagina.";
}
/* foutcodes van api.js: token/verlopen/aud → opnieuw aanmelden · test/rol → geen toegang */
function appFoutAanmelden(code, tekst){
  if (code === "token" || code === "verlopen" || code === "aud"){ appKaart(tekst || "Meld je opnieuw aan."); return true; }
  if (code === "test" || code === "rol"){ appGeenToegang(tekst); return true; }
  return false;
}
function appAfmelden(){ KKYKC.afmelden(); location.replace("index.html"); }
function appStart(f){
  if (!KKYKC.ingesteld()){ appGeenToegang("De app is nog niet ingesteld."); return; }
  KKYKC.opAanmelden(function(){ var k = document.getElementById("appKaart"); if (k) k.remove(); if (!APP_PAGINA.gestart){ APP_PAGINA.gestart = true; f(); } });
  if (KKYKC.aangemeld()){ APP_PAGINA.gestart = true; f(); } else appKaart("");
}
