  h += `<h3>Fitheid, vermoeidheid en vorm (${esc(P.lbl)}${P.tot>=VANDAAG?' + 2 weken vooruit':''})</h3>${pmcGrafiek(x)}
   <div class="f">Belasting in TSS (100 = 1 uur op drempel). Gepland: Σ zoneminuten × TSS/uur van de zone. Uitgevoerd: duur × TSS/uur van de gemelde RPE; zonder RPE de geplande TSS × uitgevoerde/geplande duur. Zie tab Berekening.</div>`;
  h += progressieHtml(x);
  h += `<h3>Ervaren zwaarte t.o.v. plan (${esc(P.lbl)})</h3>${rpeGrafiek(x)}
   <div class="f">Verwachte RPE = de RPE waarbij de geplande TSS per uur hoort (bij ‘met rem’ +${fmt(T().rem_rpe,1)} RPE op T1–TMAX). ΔRPE = gemelde − verwachte RPE. Vanaf ±${fmt(T().delta_rpe,1)} wijkt de training duidelijk af van wat gepland was.</div>`;
  h += `<h3>Weekbelasting gepland vs uitgevoerd (${esc(P.lbl)})</h3>${weekTssGrafiek(x, hw)}`;
  // kalender
  const kEind = P.tot >= VANDAAG ? VANDAAG + 7 : P.tot, eindW = kEind - wd(kEind), startW = Math.max(P.van - wd(P.van), eindW - 7*15);
  const KAL = []; S.kal = KAL;   // items voor de detailweergave (klik op een training)
  let k = `<div class="kal"><div></div>${DAGEN.map(d=>`<div class="kh">${d}</div>`).join("")}`;

    for (let n=ws;n<ws+7;n++){

   <td class="num">${w.gelogd?complPil(w.compl,`${w.uitgevoerd} / (${w.uitgevoerd} + ${w.gemist})`):"–"}</td>
   <td class="num" title="Σ geplande duur tot vandaag / Σ ingevulde tijd (incl. extra)">${uur(w.plMin)} / ${w.gelogd?uur(w.uMin):"–"}</td>

   <td class="num" title="Σ geplande TSS / Σ uitgevoerde TSS (incl. extra)">${fmt(w.plLoad,0)} / ${w.gelogd?fmt(w.uLoad,0):"–"}</td>
   <td class="num" title="Σ uitgev. min / Σ gepland min − 1, enkel afgewerkte trainingen met tijd">${sgn(w.afwDuur)}</td>
   <td class="num" title="Σ km / Σ geplande km − 1, enkel afgewerkte watertrainingen">${sgn(w.afwKm)}</td>
   <td class="num">${w.extra||""}</td><td class="num" title="gemiddeld gevoel 1–5">${fmt(w.gevoel)}</td>
   <td class="num" title="gekoppelde trainingen met RPE: gemiddelde verwachte RPE / gemelde RPE (RPE ingevuld bij ${w.nRpe} van ${w.nInv} invoeren)">${w.rpeExp!=null?fmt(w.rpeExp)+" / "+fmt(w.rpeK):(w.rpe!=null?"– / "+fmt(w.rpe):"–")}</td>
   <td>${w.gelogd?dRpePil(w.dRpe, "gemiddeld gemelde − verwachte RPE"):"–"}</td>
   <td class="num" title="TSS van de week / gemiddelde TSS van die en de 3 vorige weken">${fmt(w.acwr,2)}</td></tr>`).join("")}</tbody></table></div>`;
  const rt = pa.inv.filter(e=>e.rpe!=null || e.gevoel!=null || e.nota).sort((a,b)=>b.dn-a.dn).slice(0,30);
  if (rt.length) h += `<h3>Laatste trainingen: gevoel en RPE</h3><div class="scroll"><table><thead><tr><th>Datum</th><th>Training</th><th class="num">Gepland</th><th class="num">Uitgevoerd</th><th class="num">RPE verw. / gemeld</th><th>ΔRPE</th><th>Gevoel</th><th class="num">TSS plan / uitg.</th><th>Opmerking</th></tr></thead><tbody>
   ${rt.map(e=>{ const p = e.match; return `<tr><td>${DAGK[wd(e.dn)]} ${ddmm(e.dn)}</td><td title="${esc(p?.inh||"")}">${esc(p?p.type:(e.soort||e.cat)+" (extra)")} ${doelChip(p)}</td>

    <td class="num">${p?.rpeExp!=null?fmt(p.rpeExp):"–"} / ${e.rpe!=null?fmt(e.rpe,0):"–"}</td><td>${e.dRpe!=null?dRpePil(e.dRpe,"gemeld − verwacht"):"–"}</td>
    <td>${esc(e.gevoelRuw)||"–"}</td><td class="num" title="${esc(e.loadF)}">${p?fmt(p.tss,0):"–"} / ${fmt(e.load,0)} <span class="muted">${esc(e.tssBron)}</span></td><td class="nota-t">${e.nota?esc(e.nota)+" "+notaPils(e.tags):"–"}</td></tr>`; }).join("")}</tbody></table></div>`;

/* ---- kalender: detail gepland ↔ uitgevoerd ---- */
function kalDetail(it, bron){
  if (!it) return;
  document.getElementById("kalDlg")?.remove();
  const p = it.p || it.e?.match && S.plan.find(q=>q.cel===it.e.match.cel) || null;
  const r = it.r || null, e = it.e || r?.e || null, n = it.n;
  const [cls, uitleg] = r ? tpKleur(r) : e ? ["c-extra","extra / niet gekoppeld"] : ["c-gepland", n < VANDAAG ? "geen koppeling" : "nog niet uitgevoerd"];
  const pil = {"c-groen":"p-ok","c-geel":"p-warn","c-oranje":"p-warn","c-rood":"p-bad","c-nl":"p-grijs","c-gepland":"p-grijs","c-extra":"p-grijs"}[cls] || "p-grijs";
  const snel = (km, mi) => km && mi ? km/(mi/60) : null;
  const verschilPct = (u, g) => u!=null && g ? sgn(u/g - 1) : "–";
  const leeg = e ? null : (p && n >= VANDAAG ? "nog niet uitgevoerd" : r?.status==="niet gelogd" ? "week niet gelogd" : "niet ingevuld");
  let eersteU = true, eersteG = true;   // label enkel op de eerste rij, daarna een streepje
  const U = v => leeg ? `<span class="muted">${eersteU ? (eersteU = false, leeg) : "–"}</span>` : v;
  const G = v => p ? v : `<span class="muted">${eersteG ? (eersteG = false, "niet gepland") : "–"}</span>`;
  const rijen = [
    ["Dagdeel", G(esc(p?.dd||"–")), U(esc(e?.dd||"–")), ""],
    ["Soort", G(esc(p ? p.type : "")), U(esc([e?.soort, e?.cat && `(${e.cat})`].filter(Boolean).join(" ")||"–")), ""],
    ["Duur", G(p?.duur ? fmt(p.duur,0)+" min" : "–"), U(e?.min ? Math.round(e.min)+" min" : "–"), p && e ? verschilPct(e.min, p.duur) : ""],
    ["Afstand", G(p?.km ? fmt(p.km)+" km" : "–"), U(e?.km ? fmt(e.km)+" km" : "–"), p && e ? verschilPct(e.km, p.km) : ""],
    ["Gem. snelheid", G(snel(p?.km, p?.duur) ? fmt(snel(p.km, p.duur))+" km/u" : "–"), U(snel(e?.km, e?.min) ? fmt(snel(e.km, e.min))+" km/u" : "–"), ""],
    ["Belasting", G(p ? fmt(p.tss,0)+" TSS" : "–"), U(e ? fmt(e.load,0)+" TSS"+(e.tssBron?` <span class="muted">(${esc(e.tssBron)})</span>`:"") : "–"), p && e ? verschilPct(e.load, p.tss) : ""],
    ["RPE", G(p?.rpeExp!=null ? "≈ "+fmt(p.rpeExp,1)+' <span class="muted">(verwacht)</span>' : "–"), U(e?.rpe!=null ? fmt(e.rpe,0) : "–"), e?.dRpe!=null ? dRpePil(e.dRpe, "gemeld − verwacht") : ""],
    ["Gevoel", G("–"), U(e?.gevoelRuw ? esc(e.gevoelRuw)+(e.gevoel!=null?` <span class="muted">(${fmt(e.gevoel,0)}/5)</span>`:"") : "–"), ""],
    ["Opmerking", G("–"), U(e?.nota ? "💬 "+esc(e.nota)+" "+notaPils(e.tags) : "–"), ""]
  ];
  const zones = S.meta.zones || [];
  const zTab = p && p.z && p.z.some(v=>v) ? `<table class="kd-z"><thead><tr>${zones.map(z=>`<th class="num">${esc(z)}</th>`).join("")}<th class="num">Totaal</th></tr></thead>
    <tbody><tr>${zones.map((z,i)=>`<td class="num">${p.z[i] ? fmt(p.z[i],0)+"'" : "–"}</td>`).join("")}<td class="num"><b>${fmt(p.z.reduce((a,b)=>a+(b||0),0),0)}'</b></td></tr></tbody></table>` : "";
  const land = p && p.lm ? `<div class="f">Land: ${fmt(p.lm,0)} min ${esc(p.lt||"")}</div>` : "";
  const ruw = e ? [["Afstand", e.afstandRuw], ["Tijd", e.tijdRuw], ["RPE", e.rpeRuw], ["Gevoel", e.gevoelRuw]].filter(x=>x[1]).map(x=>`${x[0]}: <b>${esc(x[1])}</b>`).join(" · ") : "";
  const opm = [r?.opm, e?.opm].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);
  const logLink = e?.cel ? sheetLink(e.cel) : null;
  const titel = `${DAGEN[wd(n)]} ${ddmm(n)}${p?.dd ? " · "+p.dd : e?.dd ? " · "+e.dd : ""} – ${esc(p ? p.type : (e?.soort||e?.cat||"training")+" (extra)")}`;
  const d = document.createElement("div");
  d.id = "kalDlg"; d.className = "kd-ovl";
  d.innerHTML = `<div class="kd" role="dialog" aria-modal="true" aria-labelledby="kdT">
    <div class="kd-kop"><div><div class="muted">${esc(it.sporter)}</div><h3 id="kdT">${titel}</h3>
      <span class="pil ${pil}">${esc(r?.status || (e ? "extra" : n < VANDAAG ? "–" : "gepland"))}</span> <span class="muted">${esc(uitleg)}</span> ${doelChip(p)} ${afwChip(p)}</div>
      <button type="button" class="kd-x" aria-label="Sluiten">×</button></div>
    ${afwBlok(p)}
    <table class="kd-t"><thead><tr><th></th><th>Gepland</th><th>Uitgevoerd</th><th>Verschil</th></tr></thead>
      <tbody>${rijen.map(x=>`<tr><th scope="row">${x[0]}</th><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]||""}</td></tr>`).join("")}</tbody></table>
    ${p ? `<h4>Geplande inhoud</h4><div class="kd-inh">${esc(p.inh||"–")}${extraTekst(p) ? `<div class="muted">${esc(extraTekst(p))}</div>` : ""}</div>${zTab}${land}` : ""}
    ${e ? `<h4>Ingevuld in het logboek</h4><div>${ruw || '<span class="muted">geen gegevens</span>'}</div>${e.loadF ? `<div class="f">Belasting: ${esc(e.loadF)}</div>` : ""}` : ""}
    ${opm.length ? `<div class="f">Opmerking: ${opm.map(esc).join(" · ")}</div>` : ""}
    <div class="f">Bron: ${p ? `schema ${esc(p.cel)}` : ""}${p && e ? " · " : ""}${e ? (logLink ? `logboek <a href="${esc(logLink)}" target="_blank" rel="noopener">${esc(e.cel)} ↗</a>` : `logboek ${esc(e.cel)}`) : ""}</div>
  </div>`;
  const sluit = () => { d.remove(); document.removeEventListener("keydown", esc_); bron?.focus(); };
  const esc_ = ev => { if (ev.key==="Escape") sluit(); };
  d.addEventListener("click", ev => { if (ev.target===d) sluit(); });
  d.querySelector(".kd-x").onclick = sluit;
  document.addEventListener("keydown", esc_);
  document.body.append(d);
  d.querySelector(".kd-x").focus();
}

/* ---- tabblad Opmerkingen ---- */
function renderOpmerkingen(){
  const A = S.afgeleid, P = periode();
  const alle = A.invoer.filter(e=>e.nota).concat(A.notities||[]).filter(e=>e.dn>=P.van && e.dn<=P.tot)
    .sort((a,b)=>b.dn-a.dn || a.sporter.localeCompare(b.sporter));
  const f = S.notaFilter || "alle", tel = {};
  alle.forEach(e=>e.tags.forEach(k=>tel[k]=(tel[k]||0)+1));
  const knoppen = ["alle", ...Object.keys(NOTA_LAB).filter(k=>tel[k])].map(k=>`<button type="button" class="${f===k?"actief":""}" data-f="${k}" aria-pressed="${f===k}">${k==="alle"?"Alle ("+alle.length+")":esc(NOTA_LAB[k])+" ("+tel[k]+")"}</button>`).join("");
  const toon = f==="alle" ? alle : alle.filter(e=>e.tags.includes(f));
  const training = e => { if (!("soort" in e)) return `<span class="muted">geen training ingevuld</span>`;
    const p = e.match; return `<span title="${esc(p?.inh||"")}">${esc(p ? p.type+(p.dd?" · "+p.dd:"") : (e.soort||e.cat)+" (extra)")}</span>`; };
  let h = `<h2>Opmerkingen van de sporters</h2>
   <p class="muted">Periode: ${esc(P.lbl)} (${P.kort}). Vrije tekst uit de rij ‘Opmerking’ van het logboek (Google Form of rechtstreeks in de Sheet). De labels komen uit eenvoudige trefwoorden (zie tab Berekening): lees altijd de tekst zelf. Bevat gezondheidsinfo van sporters, ook minderjarigen: niet doorsturen.</p>
   <div class="filters" role="group" aria-label="Filter op label">${knoppen}</div>`;
  h += `<div class="scroll"><table><thead><tr><th>Datum</th><th>Sporter</th><th>Training</th><th class="num">RPE verw. / gemeld</th><th>Gevoel</th><th>Opmerking</th><th>Label</th></tr></thead><tbody>${toon.map(e=>{
    const lnk = sheetLink(e.cel);
    return `<tr><td>${DAGK[wd(e.dn)]} ${ddmm(e.dn)}${e.dd?" "+esc(e.dd):""}</td><td><a href="#sporter-${esc(e.sporter)}"><b>${esc(e.sporter)}</b></a> <span class="muted">${esc(e.groep)}</span></td>
     <td>${training(e)}</td><td class="num">${e.match?.rpeExp!=null?fmt(e.match.rpeExp):"–"} / ${e.rpe!=null?fmt(e.rpe,0):"–"}${e.dRpe!=null?" "+dRpePil(e.dRpe,"gemeld − verwacht"):""}</td>
     <td>${esc(e.gevoelRuw||"")||"–"}</td><td class="nota-t">${esc(e.nota)}${lnk?` <a href="${esc(lnk)}" target="_blank" rel="noopener" title="Open de cel in de Sheet">↗</a>`:""}</td><td>${notaPils(e.tags)}</td></tr>`; }).join("") || `<tr><td colspan="7">Geen opmerkingen in deze periode${f!=="alle"?" met dit label":""}.</td></tr>`}</tbody></table></div>`;
  // per geplande training: wat zegt de groep over dezelfde sessie?
  const perSessie = {};
  A.invoer.filter(e=>e.nota && e.match && e.dn>=P.van && e.dn<=P.tot).forEach(e => (perSessie[e.groep+"|"+e.match.cel] ||= []).push(e));
  const sessies = Object.values(perSessie).filter(l => l.length>=2 || l.some(e=>e.tags.includes("zwaar") || e.tags.includes("licht")))
    .sort((a,b)=>b[0].dn-a[0].dn);
  if (sessies.length){
    h += `<h3>Per geplande training</h3><p class="muted">Sessies met minstens twee opmerkingen of een opmerking ‘te zwaar’/‘te licht’. Handig om het schema voor de hele groep bij te sturen.</p>
    <div class="scroll"><table><thead><tr><th>Datum</th><th>Groep</th><th>Training</th><th class="num">RPE verwacht</th><th class="num">RPE gemeld (gem.)</th><th>Opmerkingen</th></tr></thead><tbody>${sessies.map(l=>{ const p = l[0].match;
      const zw = l.filter(e=>e.tags.includes("zwaar")).length, li = l.filter(e=>e.tags.includes("licht")).length;
      return `<tr><td>${DAGK[wd(l[0].dn)]} ${ddmm(l[0].dn)}${p.dd?" "+esc(p.dd):""}</td><td>${esc(l[0].groep)}</td><td title="${esc(p.inh||"")}">${esc(p.type)} ${doelChip(p)}<div class="f">${esc(kortTekst(p.inh||"",90))}</div></td>
       <td class="num">${p.rpeExp!=null?fmt(p.rpeExp):"–"}</td><td class="num">${fmt(avg(l.map(e=>e.rpe)))}</td>
       <td class="nota-t">${zw?`<span class="pil p-warn">${zw}× te zwaar</span> `:""}${li?`<span class="pil p-grijs">${li}× te licht</span> `:""}${l.map(e=>`<div><b>${esc(e.sporter)}</b>: ${esc(e.nota)}</div>`).join("")}</td></tr>`; }).join("")}</tbody></table></div>`;
  }
  $("#app").innerHTML = h;
  $("#app").querySelectorAll(".filters button").forEach(b => b.onclick = () => { S.notaFilter = b.dataset.f; renderOpmerkingen(); });
}

/* ---- ‘Te controleren’: voorgestelde acties per probleem ---- */
function voorstellen(c){
  const p = c.probleem, A = [], sm = /^onbekende soort '(.*)'$/.exec(p);
  const neg = {id:"negeer", lbl:"Niet meetellen", hint:"Deze invoer volledig weglaten uit de analyse", zacht:true};
  const ok = (lbl, hint) => ({id:"ok", lbl, hint, zacht:true});
  if (/^mogelijk verkeerde datum/.test(p) && c.voorstelDn!=null) A.push({id:"datum", waarde:isoDn(c.voorstelDn), lbl:`Verplaats naar ${DAGK[wd(c.voorstelDn)]} ${ddmm(c.voorstelDn)}`, hint:"Telt dan als de geplande training van die dag"}, ok("Extra training laten","Blijft op deze datum als extra training"));
  else if (/^ongeldige datum|^datum in de toekomst/.test(p)) A.push({id:"datum", invoer:"date", lbl:"Juiste datum…", hint:"Datum waarop de training echt plaatsvond"}, neg);
  else if (sm) A.push({id:"soort", soort:sm[1], cat:"water", lbl:`‘${sm[1]}’ = water`, hint:"Geldt voor alle invoer met deze soort"}, {id:"soort", soort:sm[1], cat:"land", lbl:`‘${sm[1]}’ = land`, hint:"Geldt voor alle invoer met deze soort"}, neg);
  else if (/^soort ontbreekt/.test(p)) A.push({id:"cat", cat:"water", lbl:"Water"}, {id:"cat", cat:"land", lbl:"Land"}, neg);
  else if (/^soort leeg en snelheid/.test(p)) A.push({id:"cat", cat:"land", lbl:"Land (fietsen/lopen)"}, {id:"cat", cat:"water", kmOk:true, lbl:"Toch water"}, neg);
  else if (/^onlogische snelheid/.test(p)) A.push({id:"kmOk", lbl:"Toch meetellen", hint:"Afstand en tijd tellen mee in de afwijking"}, {id:"km", invoer:"num", lbl:"Afstand corrigeren (km)…"}, {id:"min", invoer:"num", lbl:"Duur corrigeren (min)…"});
  else if (/^ongewone duur/.test(p)) A.push(...(c.voorstelMin ? [{id:"min", waarde:Math.round(c.voorstelMin), lbl:`Toch ${Math.round(c.voorstelMin)} min tellen`}] : []), {id:"min", invoer:"num", lbl:"Duur corrigeren (min)…"}, ok("Zonder tijd tellen","Tijd blijft genegeerd"));
  else if (/^afstand niet leesbaar/.test(p)) A.push({id:"km", invoer:"num", lbl:"Afstand invullen (km)…"}, ok("Zonder afstand tellen","Afstand blijft genegeerd"));
  else if (/^RPE buiten/.test(p)) A.push({id:"rpe", invoer:"num", lbl:"RPE invullen (0–10)…"}, ok("Zonder RPE tellen","RPE blijft genegeerd"));
  else if (/^gevoel onbekend/.test(p)) A.push(ok("Zonder gevoel tellen","Gevoel blijft genegeerd"));
  else if (/^dubbele invoer/.test(p)) A.push(ok("Als extra training laten","Telt als extra training"), neg);
  else if (c.gevolg === "tijd genegeerd") A.push({id:"min", invoer:"num", lbl:"Duur invullen (min)…"}, ok("Zonder tijd tellen","Tijd blijft genegeerd"));
  else A.push(ok("Gezien, zo laten",""), neg);
  return A;
}
function sheetId(){ const m = /\/d\/([^/]+)/.exec(S.meta.sheet_url||""); return m ? m[1] : null; }
const GIDS_STD = {};   /* KKYKC-app: geen namen of bestands-ID in de openbare code; sheet_gids komt van de server */
function gidVan(blad){ return (S.meta.sheet_gids || GIDS_STD[sheetId()] || {})[blad]; }
function sheetLink(cel){
  const m = /^(.*)!([A-Z]+\d+)$/.exec(cel||""), g = m && gidVan(m[1]);
  return g ? `https:\/\/docs.google.com/spreadsheets/d/${sheetId()}/edit#gid=${g}&range=${m[2]}` : null;
}
function berichtVoor(c){
  const r = /!(.*)$/.exec(c.cel||"")?.[1] || "";
  return `Hoi ${c.sporter}, in je trainingslogboek klopt iets niet${c.dn!=null?` bij ${DAGEN[wd(c.dn)]} ${ddmm(c.dn)}`:""}: ${c.probleem}${c.waarde?` (je vulde in: ${c.waarde})`:""}. Kan je dit aanpassen in je blad${r?` (cel ${r})`:""}? Bedankt!`;
}
function controleTabel(lijst, metActies){
  const L = lijst.slice().sort((a,b)=>(b.dn??0)-(a.dn??0));
  return `<div class="scroll"><table><thead><tr><th>Sporter</th><th>Datum</th><th>Probleem</th><th>Waarde</th><th>Gevolg nu</th>${metActies?"<th>Voorgestelde acties</th>":"<th>Actie</th>"}<th>Sheet</th></tr></thead><tbody>${
    L.map((c,i)=>{ const u = sheetLink(c.cel);
      const acties = metActies ? `<div class="act" data-i="${i}">${voorstellen(c).map((a,j)=>`<button type="button" class="${a.zacht?"zacht":""}" data-j="${j}" title="${esc(a.hint||"")}">${esc(a.lbl)}</button>`).join("")}<button type="button" class="zacht" data-msg="${i}" title="Kopieert een voorstel van bericht naar de sporter">Bericht kopiëren</button></div>` : esc(c.actie);

function koppelActies(el, lijst){
  const L = lijst.slice().sort((a,b)=>(b.dn??0)-(a.dn??0));
  el.querySelectorAll(".act[data-i]").forEach(div => {
    const c = L[+div.dataset.i], V = voorstellen(c);
    div.querySelectorAll("button[data-j]").forEach(btn => btn.onclick = () => {
      const a = V[+btn.dataset.j];
      if (!a.invoer) return pasToe(c, a);
      div.querySelector("form")?.remove();
      const f = document.createElement("form"), inp = document.createElement("input");
      inp.type = a.invoer==="date" ? "date" : "number"; inp.id = "ctl-in-"+div.dataset.i; inp.setAttribute("aria-label", a.lbl);
      if (a.invoer==="date"){ inp.min = `${S.jaar}-01-01`; inp.max = isoDn(VANDAAG); inp.value = c.dn!=null ? isoDn(Math.min(c.dn, VANDAAG)) : ""; }
      else { inp.step = "any"; inp.min = "0"; if (a.id==="rpe") inp.max = "10"; }
      const ok = document.createElement("button"); ok.type = "submit"; ok.textContent = "Toepassen";
      f.append(inp, ok); div.append(f); inp.focus();
      f.onsubmit = ev => { ev.preventDefault();
        let v = inp.value;
        if (a.invoer!=="date"){ v = Number(String(v).replace(",", ".")); if (!isFinite(v) || v<=0 || (a.id==="rpe" && v>10) || (a.id==="min" && v>600) || (a.id==="km" && v>100)){ inp.setCustomValidity("Geef een geldig getal"); inp.reportValidity(); return; } }
        else if (!v){ inp.setCustomValidity("Kies een datum"); inp.reportValidity(); return; }
        pasToe(c, a, v); };
    });
    div.querySelector("button[data-msg]").onclick = async ev => {
      const t = berichtVoor(c), b = ev.currentTarget;
      try { await navigator.clipboard.writeText(t); b.textContent = "Gekopieerd ✓"; setTimeout(()=>b.textContent="Bericht kopiëren", 2000); }

    };

}
async function pasToe(c, a, waarde){
  a = {...a, lbl:a.lbl.replace(/…$/,"")};
  const nu = new Date().toISOString(), meta = {sporter:c.sporter, probleem:c.probleem, waarde:c.waarde, beslissing:a.lbl+(waarde!=null&&a.invoer?`: ${waarde}`:""), t:nu};
  if (a.id==="ok") S.ctl.ok[ctlKey(c)] = meta;
  else if (a.id==="soort") S.ctl.soorten[a.soort.trim().toLowerCase()] = a.cat;
  else {
    const cor = S.ctl.cel[c.cel] = {...(S.ctl.cel[c.cel]||{}), ...meta, sig:S.sigVan[c.cel]||""};
    if (a.id==="negeer") cor.negeer = true;
    else if (a.id==="datum") cor.datum = waarde ?? a.waarde;
    else if (a.id==="cat"){ cor.cat = a.cat; if (a.kmOk) cor.kmOk = true; }
    else if (a.id==="kmOk") cor.kmOk = true;
    else if (a.id==="km") cor.km = waarde;
    else if (a.id==="min") cor.min = waarde ?? a.waarde;
    else if (a.id==="rpe") cor.rpe = waarde;
  }
  const r = await bewaarControle();
  herbereken();
  melding(r==="db" ? `Bewaard: ${esc(c.sporter)} – ${esc(a.lbl)}${waarde!=null&&a.invoer?" ("+esc(waarde)+")":""}. De cijfers zijn herberekend.`

        : `Toegepast in deze browser, maar opslaan in de database lukte niet (${esc(r)}).`, r==="db"?"":"fout");
}

const MKORT = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const PR = () => S.meta?.prestatie || {};
function leden(){ return {...(PR().extra_leden||{}), ...S.meta.sporters}; }
const testNaam = s => (PR().namen?.[s]?.test || s).toLowerCase();
const wedNaam = s => PR().namen?.[s]?.wedstrijd || null;
const median = a => { const b = a.filter(x=>x!=null && isFinite(x)).sort((p,q)=>p-q); if (!b.length) return null; const m = b.length>>1; return b.length%2 ? b[m] : (b[m-1]+b[m])/2; };
const kwantiel = (a,q) => { const b = a.filter(x=>x!=null && isFinite(x)).sort((p,r)=>p-r); if (!b.length) return null; const i = (b.length-1)*q, lo = Math.floor(i); return b[lo] + (b[Math.min(lo+1,b.length-1)]-b[lo])*(i-lo); };
const fsec = (s, nd=0) => { if (s==null || !isFinite(s)) return "–"; const m = Math.floor(s/60), r = s-60*m; return m ? `${m}:${r.toFixed(nd).padStart(nd?3+nd:2,"0").replace(".",",")}` : r.toFixed(nd||1).replace(".",","); };
const snel = v => v==null||!isFinite(v) ? "–" : v>=0 ? pct(v,1)+" sneller" : pct(-v,1)+" trager";
const serialDn = v => Math.round(v) - 25569;   // Excel-datumgetal → dagnummer

function secVan(v, dist){
  let s = null;
  if (typeof v==="number") s = v < 0.05 ? v*86400 : v;             // Excel-duur = fractie van een dag
  else if (v!=null){ const t = String(v).trim().replace(",","."); let m;
    if ((m = /^(\d+):(\d{1,2}):(\d{1,2}(?:\.\d+)?)$/.exec(t))) s = +m[1]*3600 + +m[2]*60 + +m[3];
    else if ((m = /^(\d+)[:'’](\d{1,2}(?:\.\d+)?)"?$/.exec(t))) s = +m[1]*60 + +m[2];
    else if (/^\d+(\.\d+)?$/.test(t)) s = +t; }
  if (s==null || !isFinite(s)) return null;
  const [lo,hi] = dist===200 ? [25,150] : [300,2400];
  return s>=lo && s<=hi ? Math.round(s*100)/100 : null;
}
function leesTestBestand(wb){
  const rijen = [], meld = [];
  const jarenUitslag = new Set(wb.SheetNames.filter(n=>/^uitslag/i.test(n)).map(n=>(/(\d{4})/.exec(n)||[])[1]).filter(Boolean).map(Number));
  for (const naam of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[naam], {header:1, raw:true, defval:null, blankrows:false});
    const dist = /(^|\D)200\s*m/i.test(naam) ? 200 : 2000;
    if (/^uitslag/i.test(naam)){
      // rij 1 = Naam + testdata; daaronder één rij per sporter
      const kop = rows[0]||[], cols = [], n0 = rijen.length;
      kop.forEach((v,c) => { if (c>0 && typeof v==="number" && v>40000 && v<60000) cols.push([c, serialDn(v)]); });
      for (const r of rows.slice(1)){ const nm = String(r?.[0]??"").trim(); if (!nm || /^(naam|legende)/i.test(nm)) continue;
        for (const [c,d] of cols){ const s = secVan(r[c], dist); if (s!=null) rijen.push({naam:nm, dn:d, dist, s}); } }
      meld.push(`‘${naam}’: ${cols.length} testdata, ${rijen.length-n0} tijden`);
    } else if (/analyse/i.test(naam)){
      // oudere tests met maandlabels (‘jan 2025’); jaren met een blad ‘Uitslagen <jaar>’ worden daar gelezen
      const ki = rows.findIndex(r => String(r?.[0]??"").trim().toLowerCase()==="naam"); if (ki<0) continue;
      const cols = [], n0 = rijen.length;
      (rows[ki]||[]).forEach((v,c) => { const m = /^([a-z]{3})[a-z]*\s+(\d{4})$/i.exec(String(v??"").trim());
        if (c>0 && m && MKORT.includes(m[1].toLowerCase()) && !jarenUitslag.has(+m[2])) cols.push([c, dn(+m[2], MKORT.indexOf(m[1].toLowerCase())+1, 15)]); });
      for (const r of rows.slice(ki+1)){ const nm = String(r?.[0]??"").trim(); if (!nm) continue;
        for (const [c,d] of cols){ const s = secVan(r[c], dist); if (s!=null) rijen.push({naam:nm, dn:d, dist, s, maand:true}); } }
      if (cols.length) meld.push(`‘${naam}’: ${cols.length} oudere tests (enkel maand gekend), ${rijen.length-n0} tijden`);
    }
  }
  return {rijen, meld};
}

/* ---- testtijden rechtstreeks uit de Google Sheet (bij 'Logboek vernieuwen') ---- */
function testSheetId(){ const m = /\/d\/([^/]+)/.exec(PR().test_sheet_url||""); return m ? m[1] : null; }
function csvRijen(t){
  const out = []; let row = [], cur = "", q = false;
  for (let i=0;i<t.length;i++){ const c = t[i];
    if (q){ if (c==='"'){ if (t[i+1]==='"'){ cur+='"'; i++; } else q = false; } else cur += c; }
    else if (c==='"') q = true; else if (c===','){ row.push(cur); cur=""; } else if (c==='\n'){ row.push(cur); out.push(row); row=[]; cur=""; } else if (c!=='\r') cur += c; }
  if (cur || row.length){ row.push(cur); out.push(row); }
  return out;
}
function leesTestTabel(t, tb){
  // gviz out:html via get_page_text: één regel per rij, cellen gescheiden door tabs, lege cellen = harde spatie
  const r = t.replace(/\r/g,"").split("\n").filter(l => l.trim()!=="").map(l => l.split("\t").map(c => c.replace(/\u00A0/g," ").trim()));
  // bestaat het blad niet (bv. 'Uitslagen 200m 2026' nog niet aangemaakt), dan geeft Google het eerste blad terug: niet gebruiken
  if (/^uitslagen/i.test(tb.blad) && !/^naam$/i.test(r[0]?.[0]||"")) return [];
  return leesTestRijen(r, tb);
}
function leesTestCsv(t, tb){ return leesTestRijen(csvRijen(t.trim()), tb); }
function maandIdx(w){ w = String(w||"").toLowerCase().replace(/\.$/,""); if (w.length<3) return -1;
  const i = MAANDEN.findIndex(m => m.startsWith(w)); return i>=0 ? i : MKORT.indexOf(w); }
/* kolomlabel → [dagnummer, enkel maand gekend?] of null.
   'dd/mm/jjjj' (Uitslagen) · 'jan 2025' · 'Tijd januari' (Resultaten <jaar>: jaar uit de bladnaam, dag = 15).
   Start-/eindtijden, trends en verschillen worden overgeslagen. */
function testKolom(v, tb){
  v = String(v??"").trim(); let m;
  if ((m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(v))) return [dn(+m[3], +m[2], +m[1]), false];
  if (/start|eind|trend|verschil|beste|gem|\u0394/i.test(v)) return null;
  if ((m = /^(?:tijd\s+)?([a-z]+)\.?(?:\s+(\d{4}))?$/i.exec(v))){
    const mi = maandIdx(m[1]), j = m[2] ? +m[2] : tb.jaar;
    if (mi>=0 && j && (!tb.tot_jaar || j<=tb.tot_jaar)) return [dn(j, mi+1, 15), true]; }
  return null;
}
const GEEN_NAAM = /^(naam|vaarder|legende|bronkolom|snelste|gemiddeld|deelnemers|grens|marge|tijd\b|%)/i;
function leesTestRijen(r, tb){
  // kopregel = eerste rij (binnen de eerste 30) met minstens één testkolom; naam in kolom A
  if (!r?.length) return [];
  if (tb.startblad) return leesStartblad(r, tb);
  const dist = tb.dist || 2000;
  let ki = -1, cols = [];
  for (let i=0; i<Math.min(30, r.length) && ki<0; i++){
    const c = []; (r[i]||[]).forEach((v,j) => { if (!j) return; const k = testKolom(v, tb); if (k) c.push([j, ...k]); });
    if (c.length){ ki = i; cols = c; } }
  if (ki<0) return [];
  const out = [];
  for (const row of r.slice(ki+1)){ const nm = String(row?.[0]??"").trim(); if (!nm || GEEN_NAAM.test(nm)) continue;
    for (const [c,d,maand] of cols){ const s = secVan(row[c], dist); if (s!=null) out.push(maand ? {naam:nm, dn:d, dist, s, maand:true} : {naam:nm, dn:d, dist, s}); } }
  return out;
}
/* Startblad: datum van de lopende test bovenaan, kolom 'Naam' + '2km-tijd' (of 'Eindtijd').
   Telt enkel als de test voorbij is; na 'Test vastzetten' staat de uitslag in 'Uitslagen <jaar>' (dubbels vallen weg). */
function leesStartblad(r, tb){
  let d = null;
  for (const row of r.slice(0,3)) for (const v of row||[]){ const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(v).trim()); if (m && d==null) d = dn(+m[3], +m[2], +m[1]); }
  if (d==null || d>VANDAAG) return [];
  const ki = r.findIndex(row => (row||[]).some(v => /^naam$/i.test(String(v).trim()))); if (ki<0) return [];
  const kop = r[ki].map(v => String(v).trim());
  let tc = kop.findIndex(v => /^(2\s*km|200\s*m)[\s-]*tijd$/i.test(v)); if (tc<0) tc = kop.findIndex(v => /^eindtijd$/i.test(v)); if (tc<0) return [];
  let nc = -1; kop.forEach((v,j) => { if (j<tc && /^naam$/i.test(v)) nc = j; }); if (nc<0) return [];
  const dist = /200\s*m/i.test(kop[tc]) ? 200 : (tb.dist || 2000), out = [];
  for (const row of r.slice(ki+1)){ const nm = String(row?.[nc]??"").trim(); if (!nm || GEEN_NAAM.test(nm)) continue;
    const s = secVan(row[tc], dist); if (s!=null) out.push({naam:nm, dn:d, dist, s}); }
  return out;
}
/* alle testbladen samen: eerst Uitslagen/Resultaten, dan Startblad; dubbels (zelfde naam, dag, afstand) maar één keer */
function testenUitSheet(bladen){
  const rijen = [], gezien = new Set(), meld = [];
  [...bladen].sort((a,b) => (a.tb.startblad?1:0) - (b.tb.startblad?1:0)).forEach(b => {
    let n = 0;
    for (const t of leesTestRijen(b.rijen, b.tb)){ const k = t.naam.toLowerCase()+"|"+t.dn+"|"+t.dist; if (gezien.has(k)) continue; gezien.add(k); rijen.push(t); n++; }
    if (n || !b.tb.startblad) meld.push(`${b.tb.blad}: ${n}`);

}

/* ---- testperiodes: wat trainde iemand tussen twee 2 km-tests en hoeveel sneller werd hij/zij? ---- */
function testPeriodes(x){
  const t = prestatiesVan(x.s).testen.filter(t=>t.dist===2000 && !t.maand), out = [];
  for (let i=1;i<t.length;i++){ const a = t[i-1], b = t[i], dagen = b.dn-a.dn; if (dagen<14 || dagen>140) continue;
    const inv = x.inv.filter(e=>e.dn>=a.dn && e.dn<b.dn && e.cat!=="onbekend"), wk = dagen/7;
    const W = x.W.filter(w => { const st = dnIso(S.meta.weken[w.week]||"2000-01-01"); return st+6>=a.dn && st<b.dn; });
    const u = sum(W.map(w=>w.uitgevoerd)), bb = sum(W.map(w=>w.beoordeeld));
    const dekking = W.length ? W.filter(w=>w.gelogd).length/W.length : 0;
    out.push({van:a, tot:b, dagen, sesW:inv.length/wk, uurW:sum(inv.map(e=>e.min))/60/wk, tssW:sum(inv.map(e=>e.load))/wk,
      compl: bb ? u/bb : null, dekking, sneller:(a.s-b.s)/a.s, ds:b.s-a.s, ok: dekking>=0.6 && inv.length>0});
  }
  return out;
}
const BINS = [[0,2,"< 2×"],[2,3,"2 – 3×"],[3,4,"3 – 4×"],[4,99,"≥ 4×"]];
function clubVergelijking(){
  const P = Object.values(S.afgeleid.sp).flatMap(x => (x.tper||[]).filter(p=>p.ok).map(p=>({...p, s:x.s, g:x.g})));
  return {P, nS:new Set(P.map(p=>p.s)).size, bins:BINS.map(([lo,hi,l]) => { const q = P.filter(p=>p.sesW>=lo && p.sesW<hi); return {l, lo, hi, n:q.length, gem:avg(q.map(p=>p.sneller)), med:median(q.map(p=>p.sneller))}; })};
}

/* ---- vooruitzicht fitheid (CTL) over max. 6 weken: zo verder, volgens plan, +1 training per week ---- */
function projectie(x){
  const plG = S.plan.filter(p=>p.groep===x.g); if (!plG.length || !x.inv.length) return null;
  const pl = {}; plG.forEach(p => pl[p.dn] = (pl[p.dn]||0)+p.tss);
  const H = Math.min(42, Math.max(...plG.map(p=>p.dn)) - VANDAAG + 1); if (H < 14) return null;
  const v28 = VANDAAG-28, plV = sum(plG.filter(p=>p.dn>=v28 && p.dn<VANDAAG).map(p=>p.tss));
  const ses = x.inv.filter(e=>e.dn>=v28 && e.dn<VANDAAG && e.load>0), uV = sum(ses.map(e=>e.load));
  if (!plV) return null;
  const r = Math.min(2, uV/plV);
  const perSes = ses.length ? uV/ses.length : (median(plG.filter(p=>p.dn>=v28 && p.dn<VANDAAG).map(p=>p.tss)) || 50);
  const run = f => { let ctl = x.ctlG, atl = x.atlG; for (let n=VANDAAG;n<VANDAAG+H;n++){ const L = f(n); ctl += (L-ctl)/42; atl += (L-atl)/7; } return ctl; };
  return {H, r, perSes, nSes:ses.length, nu:x.ctlG, zo:run(n=>(pl[n]||0)*r), plan:run(n=>pl[n]||0), extra:run(n=>(pl[n]||0)*r + perSes/7)};
}

  // wedstrijden van dit seizoen (v8: live uit de Sheet 'Wedstrijdresultaten KKYKC')
  const rs = pv.races.filter(r=>new Date(r.dn*864e5).getUTCFullYear()===S.jaar).sort((a,b)=>a.dn-b.dn);
  const wk = wedNaam(x.s) ? wsl(wedNaam(x.s)) : null;
  h += `<h3>Wedstrijden ${S.jaar}</h3>`;
  if (!wk) h += `<p class="muted">Geen wedstrijdnaam gekoppeld in Code.gs (prestatie › namen).</p>`;
  else if (!S.wedM) h += `<p class="muted">Wedstrijdgegevens niet geladen${S.wedFout?` (${esc(S.wedFout)})`:""}.</p>`;
  else {
    const an = (S.wedM.tek||[]).filter(t=>t.s===S.jaar && t.soort==="analyse" && wsl(t.naam)===wk);
    an.forEach(t=>{ h += `<div class="ws-noot"><b>Analyse trainer</b>${wsHtml(t.tekst)}</div>`; });
    if (!rs.length) h += `<p class="muted">Geen raceresultaten in ${S.jaar}.</p>`;
    else {
      // beste K1-tijd per afstand: dit seizoen t.o.v. vorig seizoen
      const best = j => { const o = {}; pv.races.forEach(r=>{ if (r.boot!=="K1" || !r.t || !r.dist || new Date(r.dn*864e5).getUTCFullYear()!==j || !["sprint","lang"].includes(r.soort)) return; if (!o[r.dist] || r.t<o[r.dist].t) o[r.dist] = r; }); return o; };
      const b1 = best(S.jaar), b0 = best(S.jaar-1), ds = Object.keys(b1).map(Number).sort((a,b)=>a-b);
      if (ds.length) h += `<div class="scroll"><table><thead><tr><th>Beste K1-tijd</th>${ds.map(d=>`<th class="num">${d} m</th>`).join("")}</tr></thead><tbody>
        <tr><td>${S.jaar}</td>${ds.map(d=>`<td class="num"><b>${wft(b1[d].t)}</b> <span class="f">${esc(b1[d].wedstrijd.split(" – ")[0])}</span></td>`).join("")}</tr>
        <tr><td>${S.jaar-1}</td>${ds.map(d=>`<td class="num">${b0[d]?wft(b0[d].t)+` <span class="f">${esc(b0[d].wedstrijd.split(" – ")[0])}</span>`:'<span class="f">·</span>'}</td>`).join("")}</tr></tbody></table></div>`;
      h += `<div class="scroll"><table><thead><tr><th>Datum</th><th>Wedstrijd</th><th>Race</th><th>Ronde</th><th class="num">Plaats</th><th class="num">Tijd</th><th class="num">Achterstand op winnaar</th><th>Vorm (TSB) die dag</th></tr></thead><tbody>
      ${rs.map(r => { const q = x.reeks.find(z=>z.dn===r.dn); return `<tr><td>${ddmm(r.dn)}</td><td>${esc(r.wedstrijd)}</td><td>${esc(r.cat || (r.dist?r.dist+" m":""))}</td><td>${esc(r.ronde||"")}</td><td class="num">${r.rank?r.rank+"/"+(r.n||"?"):"–"}</td><td class="num">${r.t?wft(r.t):"–"}</td><td class="num">${r.gap==null?"–":`<span class="ws-heat ${wheat(r.gap)}">${wpct(r.gap)}</span>`}</td><td>${q?tsbPil(q.tsb,"TSB op de eerste wedstrijddag"):"–"}</td></tr>`; }).join("")}</tbody></table></div>`;
    }
    h += `<div class="f">Achterstand = (eigen tijd − tijd van de winnaar) / tijd van de winnaar. Vorm uit het logboek; positief = fris aan de start. Alle details: <a href="#wed-a-${wslug(wk)}">Wedstrijden › ${esc(x.s)}</a>.</div>`;
  }
  return h;
}

/* ============================== 11. wedstrijden (v8, 11/11/2026) ==============================
   Bron: Google Sheet 'Wedstrijdresultaten KKYKC' (alle seizoenen; serverfunctie getSeizoen). Vervangt het losse HTML-bestand
   'KKYKC Wedstrijdseizoen 2026'. Tabblad Wedstrijden met de weergaven van die pagina, per seizoen: overzicht, conclusies,
   voortgang t.o.v. het vorige seizoen, 2 km-test, alle races en een pagina per sporter. Nieuwe resultaten = rijen in de Sheet. */
const wsl = n => String(n||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const wslug = k => k.replace(/[^a-z0-9]+/g,"-");
const WSER = {125:"#2f9a2f",200:"#2a78d6",500:"#eb6834",1000:"#1baf7a",2000:"#e87ba4",5000:"#eda100"};
const WDORDER = [125,200,500,1000,2000,5000];
function wft(s){ if (s==null||!isFinite(s)) return "–"; s = Math.round(s*100)/100;
  if (s>=3600){ const h=Math.floor(s/3600), m=Math.floor(s%3600/60), r=Math.round(s-3600*h-60*m); return `${h}:${String(m).padStart(2,"0")}:${String(r).padStart(2,"0")}`; }
  const m=Math.floor(s/60), r=s-60*m; return m ? `${m}:${r.toFixed(2).padStart(5,"0").replace(".",",")}` : r.toFixed(2).replace(".",","); }
const wfs = s => { if (s==null||!isFinite(s)) return "–"; const t=Math.round(s); return `${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`; };
const wpct = g => g==null||!isFinite(g) ? "–" : (Math.abs(g)<0.05 ? "0,0 %" : (g>0?"+":"")+g.toFixed(1).replace(".",",")+" %");
const wheat = g => g==null ? "" : g<4 ? "wh0" : g<10 ? "wh1" : g<18 ? "wh2" : "wh3";
const wdlab = d => !d ? "marathon" : d>=4000 ? (d/1000).toLocaleString("nl-BE")+" km" : d+" m";
const wIsFin = r => /^finale/i.test(r.ronde||"");
const wIsA = r => /^finale( a)?$/i.test(r.ronde||"") && r.soort!=="fun" && !/HANDICAP|DOORTOCHT|MIX/i.test(r.cat||"");
const WSS = {filter:"all", _c:null};
function wedM(){ return S.wedM || null; }
function wsSeizoenen(){ return (wedM()?.seizoenen)||[]; }
function wsHuidig(){ const l = wsSeizoenen(), v = Number(lsGet("kkykc-wed-seizoen")); return l.includes(v) ? v : (l.includes(S.jaar) ? S.jaar : l[0]); }
function wsVorig(s){ const l = wsSeizoenen().filter(x=>x<s); return l.length ? Math.max(...l) : null; }
function wsVoornaam(k){ for (const [s,o] of Object.entries(PR().namen||{})) if (o && o.wedstrijd && wsl(o.wedstrijd)===k) return s; return null; }
function wsGroep(k){ const s = wsVoornaam(k); return s ? (leden()[s] || "C") : "C"; }
function wsData(s){
  const M = wedM(); if (!M) return null;
  if (WSS._c && WSS._c.s===s && WSS._c.M===M) return WSS._c;
  const kk = M.kk || {}, C = Object.fromEntries(M.wed.map(w=>[w.code,w]));
  const wed = M.wed.filter(w=>w.s===s).sort((a,b)=>(a.van||"").localeCompare(b.van||""));
  const codes = new Set(wed.map(w=>w.code)), ORDER = wed.map(w=>w.code);
  const prep = r => ({...r, keys:r.m.map(wsl), dnr: dnIso(r.d || C[r.w]?.van || `${C[r.w]?.s||s}-01-01`)});
  const rows = M.res.map((r,i)=>({...prep(r), i})).filter(r=>codes.has(r.w));
  const A = {}; rows.forEach(r=>r.keys.forEach(k=>{ if (kk[k]) (A[k] ||= []).push(r); }));
  const jeugd = M.jeugd.filter(y=>codes.has(y.w)).map(y=>({...y, k:wsl(y.naam)})); jeugd.forEach(y=>{ A[y.k] ||= []; });
  const nm = k => kk[k] || k;
  const nJ = k => jeugd.filter(y=>y.k===k).length;
  const athletes = Object.keys(A).sort((a,b)=>(A[b].length+nJ(b))-(A[a].length+nJ(a)) || nm(a).localeCompare(nm(b)));
  const tek = M.tek.filter(t=>t.s===s).sort((a,b)=>(a.vol||0)-(b.vol||0));
  WSS._c = {s, M, C, wed, ORDER, rows, A, jeugd, athletes, nm, tek, prep};
  return WSS._c;
}
function wsSort(D){ return (a,b) => { const k = r => [D.ORDER.indexOf(r.w), {sprint:0,lang:1,fun:2,jeugd:3}[r.soort]??4, {K1:0,MK1:0,K2:1,K4:2}[r.boot]??3, r.afst||0, r.i]; const x=k(a), y=k(b); for (let i=0;i<x.length;i++) if (x[i]!==y[i]) return x[i]-y[i]; return 0; }; }
function wsCat(D, k){ const c = {}; (D.A[k]||[]).forEach(r=>{ if (r.boot==="K1" && r.soort!=="jeugd" && r.cat) c[r.cat]=(c[r.cat]||0)+1; });
  const b = Object.entries(c).sort((a,b)=>b[1]-a[1])[0]; if (b) return b[0];
  const y = D.jeugd.find(x=>x.k===k); return y ? y.cat.replace(/^Jeugdspelen\s*/i,"") : "recreatief"; }
function wsStats(D, c){ const s = new Set(); let n = 0;
  D.rows.filter(r=>r.w===c).forEach(r=>r.keys.forEach(k=>{ if (D.M.kk[k]){ s.add(k); n++; } }));
  D.jeugd.filter(y=>y.w===c).forEach(y=>{ s.add(y.k); n++; });
  const w = D.C[c]; return {ath: w && w.manueel!=null ? w.manueel : s.size, starts:n}; }
/* tekst uit de Sheet: HTML toegelaten (enkel hoofdtrainers bewerken de Sheet), wel zonder scripts; oude links naar de losse pagina omzetten */
function wsHtml(t){
  t = String(t||"");
  if (!/[<>]/.test(t)) return t.split(/\n{2,}/).map(p=>`<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join("");
  return t.replace(/<\s*(script|iframe|object|embed|style)[\s\S]*?<\s*\/\s*\1\s*>/gi,"").replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,"").replace(/javascript:/gi,"")
    .replace(/href="#(voortgang|test-2km|alle-races|overzicht|conclusies)"/g, (m,a)=>`href="#${{voortgang:"wed-voortgang","test-2km":"wed-test","alle-races":"wed-races",overzicht:"wed",conclusies:"wed-conclusies"}[a]}"`);
}
function wsLink(D, k){ return D.M.kk[k] ? `<a href="#wed-a-${wslug(k)}">${esc(D.nm(k))}</a>` : esc(D.nm(k)); }
function wsTests(k){ const s = wsVoornaam(k), tn = s ? testNaam(s) : k.split(" ")[0];
  return (S.prest?.testen?.rijen||[]).filter(t=>t.dist===2000 && t.naam.toLowerCase()===tn && !t.maand).sort((a,b)=>a.dn-b.dn); }
function wsJaar(dnr){ return new Date(dnr*864e5).getUTCFullYear(); }

/* ---------- pagina ---------- */
function renderWed(sub){
  const M = wedM(); if ($("#periode")) $("#periode").hidden = true;   // periode geldt niet voor de wedstrijden
  if (!M){ $("#app").innerHTML = `<h2>Wedstrijden</h2><div class="melding">Nog geen wedstrijdgegevens${S.wedFout?` (${esc(S.wedFout)})`:""}. De gegevens komen uit de Google Sheet ‘Wedstrijdresultaten KKYKC’; kijk na of je account er kijkrecht op heeft.</div>`; return; }
  const s = wsHuidig(), D = wsData(s);
  const subs = [["wed","Overzicht"],["wed-conclusies","Conclusies"],["wed-voortgang",`Voortgang ${wsVorig(s)??"–"} → ${s}`],["wed-test","2 km-test"],["wed-races","Alle races"]];
  const k = sub.startsWith("wed-a-") ? D.athletes.find(a=>wslug(a)===sub.slice(6)) || Object.keys(M.kk).find(a=>wslug(a)===sub.slice(6)) : null;

    <label>Sporter <select id="wsSporter"><option value="">kiezen…</option>${D.athletes.map(a=>`<option value="${wslug(a)}" ${a===k?"selected":""}>${esc(D.nm(a))} · ${esc(wsCat(D,a))}</option>`).join("")}</select></label>
    <a class="ws-bron" href="${esc(M.sheet_url)}" target="_blank" rel="noopener">Gegevens in de Sheet bewerken ↗</a></div>
    <nav class="filters ws-nav">${subs.map(([r,l])=>`<a href="#${r}" class="${sub===r?"on":""}">${esc(l)}</a>`).join("")}</nav>`;
  if ((M.fouten||[]).length) h += `<div class="melding fout">Controleer de Sheet: ${esc(M.fouten.slice(0,5).join(" · "))}${M.fouten.length>5?" …":""}</div>`;
  if (!D.wed.length) h += `<div class="melding">Geen wedstrijden in seizoen ${s}.</div>`;
  else if (k) h += wsAtleet(D, k);
  else if (sub==="wed-conclusies") h += wsConclusies(D);
  else if (sub==="wed-voortgang") h += wsVoortgang(D);
  else if (sub==="wed-test") h += wsTest(D);
  else if (sub==="wed-races") h += wsAlle(D);
  else h += wsOverzicht(D);
  $("#app").innerHTML = h + `<p class="f">Bron: Google Sheet ‘Wedstrijdresultaten KKYKC’ (gelezen ${esc(new Date(M.gelezen).toLocaleString("nl-BE",{dateStyle:"short",timeStyle:"short"}))}). Achterstand = verschil met de winnaar van die race; handicap, doortocht, estafette en jeugdspelen krijgen geen achterstand.</p></div>`;
  $("#wsSeizoen").onchange = e => { lsSet("kkykc-wed-seizoen", Number(e.target.value)); WSS._c = null; renderWed(sub.startsWith("wed-a-") ? "wed" : sub); };
  $("#wsSporter").onchange = e => { if (e.target.value) ga("wed-a-"+e.target.value); };
  document.querySelectorAll(".ws [data-wf]").forEach(b => b.onclick = () => { WSS.filter = b.dataset.wf; renderWed(sub); });
  document.querySelectorAll(".ws .ws-chart").forEach(w => { const tip = w.querySelector(".ws-tip");
    w.addEventListener("mousemove", ev => { const t = ev.target.closest("[data-tip]"); if (!t){ tip.hidden = true; return; } const [a,b] = t.dataset.tip.split("|"); tip.innerHTML = `${esc(a)}<br><b>${esc(b)}</b>`; const r = w.getBoundingClientRect(); tip.style.left = (ev.clientX-r.left)+"px"; tip.style.top = (ev.clientY-r.top)+"px"; tip.hidden = false; });
    w.addEventListener("mouseleave", () => tip.hidden = true); });
}

function wsOverzicht(D){
  const tek = D.tek;
  let h = `<p class="lede">KKYKC-atleten op ${D.wed.length} wedstrijd${D.wed.length===1?"":"en"} in ${D.s}: ${D.wed.map(w=>esc(w.plaats||w.reeks)).join(", ")}. Klik op een sporter voor alle races, beste tijden, de 2 km-test en de vergelijking met het vorige seizoen.</p>
   <div class="ws-tijdlijn">${D.wed.map(w=>{ const st = wsStats(D, w.code); return `<div class="ws-tl"><span class="f">${esc(w.code)} · ${esc(wsDatum(w))}</span><b>${esc(w.plaats||w.reeks)}</b><span class="f">${esc(w.naam)}</span><div class="ws-nums"><span><b>${st.ath}</b> atleten</span><span><b>${st.starts}</b> starts</span></div></div>`; }).join("")}</div>`;
  const hl = tek.filter(t=>t.soort==="hoogtepunt");

    return `<div class="ws-hlc"><div><span class="pil ${{gold:"p-warn",water:"p-blauw",good:"p-ok"}[x.extra]||"p-grijs"}">${esc(x.titel||"")}</span> <span class="f">${esc(c ? (c.plaats||c.reeks) : "")}</span></div>${x.naam?`<b>${wsLink(D,k)}</b>`:"<b>Clubploeg</b>"}<p>${esc(x.tekst)}</p></div>`; }).join("")}</div>`;

  h += `<h3>Wie startte waar</h3><p class="f">${D.athletes.length} atleten, ${tot} individuele starts (een ploegboot telt per kajakker); ${finA.size} atleten haalden minstens één A-finale of rechtstreekse finale in K1-sprint. Het getal = aantal races per wedstrijd.</p>
   <div class="scroll"><table><thead><tr><th>Atleet</th><th>Cat.</th><th>Groep</th>${D.wed.map(w=>`<th class="num">${esc(w.plaats||w.reeks)}</th>`).join("")}<th class="num">Totaal</th></tr></thead><tbody>
   ${D.athletes.map(k=>{ const cnt = {}; D.A[k].forEach(r=>cnt[r.w]=(cnt[r.w]||0)+1); D.jeugd.filter(y=>y.k===k).forEach(y=>cnt[y.w]=(cnt[y.w]||0)+1);
     return `<tr><td>${wsLink(D,k)}</td><td class="f">${esc(wsCat(D,k))}</td><td>${wsGroep(k)}</td>${D.wed.map(w=>`<td class="num">${cnt[w.code]?`<b>${cnt[w.code]}</b>`:'<span class="f">·</span>'}</td>`).join("")}<td class="num">${Object.values(cnt).reduce((a,b)=>a+b,0)}</td></tr>`; }).join("")}</tbody></table></div>`;
  // afstandsprofiel
  const rk = D.athletes.filter(k=>D.A[k].some(r=>r.boot==="K1" && r.gap!=null));
  if (rk.length){
    h += `<h3>Afstandsprofiel K1</h3><p class="f">Gemiddelde achterstand op de winnaar per afstand, over alle K1-races (reeksen, halve finales en finales). Lager is beter. Tussen haakjes het aantal races.</p>
     <div class="scroll"><table><thead><tr><th>Atleet</th>${WDORDER.map(d=>`<th class="num">${d} m</th>`).join("")}</tr></thead><tbody>
     ${rk.map(k=>`<tr><td>${wsLink(D,k)}</td>${WDORDER.map(d=>{ const g = D.A[k].filter(r=>r.boot==="K1" && r.afst===d && r.gap!=null).map(r=>r.gap), m = avg(g);
       return `<td class="num">${m==null?'<span class="f">·</span>':`<span class="ws-heat ${wheat(m)}">${wpct(m)}</span> <span class="f">(${g.length})</span>`}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>
     <div class="legende"><span class="ws-heat wh0">&lt; 4 %</span> <span class="ws-heat wh1">4–10 %</span> <span class="ws-heat wh2">10–18 %</span> <span class="ws-heat wh3">&gt; 18 %</span></div>`;
  }
  if (tek.some(t=>t.soort==="conclusie")) h += `<div class="melding">De conclusies en werkpunten voor de trainingen staan op de pagina <a href="#wed-conclusies">Conclusies</a>.</div>`;
  return h;
}
function wsDatum(w){ if (!w.van) return ""; const a = dnIso(w.van), b = w.tot ? dnIso(w.tot) : a; return a===b ? ddmm(a) : `${ddmm(a)}–${ddmm(b)}`; }

function wsConclusies(D){
  const c = D.tek.filter(t=>t.soort==="conclusie");
  if (!c.length) return `<div class="melding">Nog geen conclusies voor ${D.s}. Voeg ze toe in de Sheet, tabblad Teksten (soort ‘conclusie’; titel = kop, tekst = inhoud; HTML mag).</div>`;
  return `<div class="ws-concl">${c.map(t=>{
    if (/^inleiding$/i.test(t.titel)) return `<p class="lede">${wsHtml(t.tekst).replace(/^<p>|<\/p>$/g,"")}</p>`;
    if (t.extra==="kader") return `<div class="ws-kader"><b>${esc(t.titel)}</b>${wsHtml(t.tekst)}</div>`;
    return `${t.extra==="h2"?"<h3 class='ws-h2'>":"<h4>"}${esc(t.titel)}${t.extra==="h2"?"</h3>":"</h4>"}${wsHtml(t.tekst)}`; }).join("")}</div>`;
}

function wsVoortgang(D){
  const p = wsVorig(D.s); if (p==null) return `<div class="melding">Geen vorig seizoen in de Sheet om mee te vergelijken.</div>`;
  const P = wsData(p); WSS._c = D;   // wsData(p) vervangt de cache; terugzetten
  let h = `<p class="lede">Seizoen ${p} naast ${D.s}: deelname per wedstrijd, wie vertrok, de gemiddelde achterstand per atleet en de beste K1-tijd op dezelfde wedstrijd en afstand.</p>`;
  // deelname per reeks
  const reeksen = [...new Set([...P.wed, ...D.wed].map(w=>w.reeks))];
  const cnt = (X, reeks) => { const w = X.wed.find(x=>x.reeks===reeks); return w ? wsStats(X, w.code).ath : null; };
  h += `<h3>Deelname per wedstrijd</h3><div class="scroll"><table><thead><tr><th>Wedstrijd</th><th class="num">${p}</th><th class="num">${D.s}</th><th class="num">Verschil</th></tr></thead><tbody>
   ${reeksen.map(r=>{ const a = cnt(P,r), b = cnt(D,r), d = a!=null && b!=null ? b-a : null;
     return `<tr><td>${esc(r)}</td><td class="num">${a??'<span class="f">–</span>'}</td><td class="num">${b??'<span class="f">–</span>'}</td><td class="num">${d==null?"":`<span class="pil ${d<0?"p-bad":"p-ok"}">${d>0?"+":""}${d}</span>`}</td></tr>`; }).join("")}</tbody></table></div>
   <p class="f">Aantal KKYKC-atleten met minstens één start (ook in ploegboten). Bij wedstrijden met onvolledige resultaten geldt het getal uit de kolom ‘KKYKC-atleten’ van het tabblad Wedstrijden.</p>`;
  const dep = D.tek.filter(t=>t.soort==="vertrokken");
  if (dep.length) h += `<h3>Vertrokken atleten</h3><div class="scroll"><table><thead><tr><th>Atleet</th><th>Cat. ${p}</th><th>Hoogtepunten ${p}</th><th>Club in ${D.s}</th></tr></thead><tbody>
    ${dep.map(t=>`<tr><td>${esc(t.naam)}</td><td class="f">${esc(t.titel)}</td><td>${esc(t.tekst)}</td><td><span class="pil p-warn">${esc(t.extra)}</span></td></tr>`).join("")}</tbody></table></div>`;
  // per atleet: gemiddelde achterstand K1 sprint/lang

function wsTestStats(D, k){

function wsSpark(st, W0=220, H=44){

    ${yo.map(y=>`<tr><td>${esc(D.C[y.w]?.plaats||y.w)}</td><td>${esc(y.cat)}</td><td class="num"><b>${y.rank??"–"}</b>/${y.n??"?"}</td><td class="num">${y.pl??"–"} pt</td><td class="num">${y.pp??"–"} pt</td><td class="num">${y.t100?wft(y.t100)+" · ":""}${y.pv??"–"} pt</td><td class="num">${y.tot??"–"} pt</td></tr>`).join("")}</tbody></table></div>
    <p class="f">Punten per onderdeel: meer punten = beter (de beste krijgt evenveel punten als er deelnemers zijn).</p>`;
  if (list.length) h += `<h3>Alle races ${D.s}</h3><div class="scroll"><table><thead><tr><th>Nummer</th><th>Ronde</th><th class="num">Plaats</th><th class="num">Tijd</th><th class="num">Achterstand</th><th class="num">Winnaar</th></tr></thead><tbody>${wsRijen(D, list, false)}</tbody></table></div>`;
  if (anders.length){ const D2 = {...D, C:D.C, M:D.M, nm:D.nm};
    h += `<h3>Andere seizoenen</h3><div class="scroll"><table><thead><tr><th>Nummer</th><th>Ronde</th><th class="num">Plaats</th><th class="num">Tijd</th><th class="num">Achterstand</th><th class="num">Winnaar</th></tr></thead><tbody>${wsRijen(D2, anders, false)}</tbody></table></div>`; }
  return h;
}
/* compacte rijen voor de rest van het dashboard (sporterpagina, kalender, groepsanalyse): zelfde vorm als vroeger */
function wsAlleRijen(M){
  const C = Object.fromEntries(M.wed.map(w=>[w.code,w])), rijen = [];
  M.res.forEach(r=>{ r.m.forEach((n,i)=>{ const k = wsl(n); if (!M.kk[k]) return; const w = C[r.w] || {};
    rijen.push({k, ev:r.w, wedstrijd:[w.plaats, w.naam].filter(Boolean).join(" – ") || r.w, dn:dnIso(r.d || w.van || `${w.s||S.jaar}-01-01`), dist:r.afst, boot:r.boot, soort:r.soort, cat:r.nr || r.cat, ronde:r.ronde, rank:r.rank, n:r.nf||r.n, gap:r.gap, t:r.t}); }); });
  return rijen;
}

/* ============================== 10. groepsanalyse ============================== */
const TYPES_OUD = [["duur","Duur T1/T2 (water)"],["interval","Intervallen T3/T4"],["sprint","Sprint TMAX / starts"],["kracht","Kracht (zaal)"],["core","Core-stability"],["landcardio","Lopen / fietsen"]];
const TYPENAAM_OUD = Object.fromEntries(TYPES_OUD);
const DOEL_NIET_IN_BEREIK = ["Wedstrijd"];
/* sinds 09/11: groepsanalyse per doel (plan.doel uit kolom KX); oude types enkel als er geen doelen zijn (bv. oud jaar zonder KX) */
function perDoel(){ return Object.keys(S.meta?.doelen||{}).length > 0 && S.plan.some(p=>p.doel); }
function typesLijst(){ return perDoel() ? Object.keys(S.meta.doelen).filter(n=>!DOEL_NIET_IN_BEREIK.includes(n)).map(n=>[n,n]) : TYPES_OUD; }
function typeNaam(t){ return TYPENAAM_OUD[t] || t; }
function sessieTypes(p){
  if (!p) return [];
  if (perDoel()) return p.doel && !DOEL_NIET_IN_BEREIK.includes(p.doel) ? [p.doel] : [];
  const z = p.z||[], t = [], inh = (p.inh||"")+" "+(p.ext||"");
  if (sum(z)>0){ const sp = (z[5]||0)>0 || /\bstart(?!activ)/i.test(inh), iv = (z[3]||0)+(z[4]||0) >= 5;
    if (sp) t.push("sprint"); if (iv) t.push("interval"); if (!sp && !iv) t.push("duur"); }
  if (p.lt==="Kracht zaal" || /kracht zaal/i.test(p.type||"")) t.push("kracht");
  if (p.lt==="Core-stability") t.push("core");
  if (/loop|fiets/i.test(p.lt||"") || (p.cat==="land" && /cardio|lopen|fiets/i.test(inh))) t.push("landcardio");
  return [...new Set(t)];
}
const moment = (n, dd) => DAGK[wd(n)] + (dd ? " "+dd : "");
const momentOrde = m => DAGK.indexOf(m.slice(0,2))*3 + (m.endsWith("VM")?0 : m.endsWith("NM")?1 : 2);

function groepAnalyse(g){
  const A = S.afgeleid, hw = A.hw, V = 8, w0 = hw-V, w1 = hw-1;
  const pByCel = new Map(S.plan.map(p=>[p.cel,p]));
  const spG = Object.values(A.sp).filter(x=>x.g===g);
  const inV = w => w>=w0 && w<=w1;
  // 1. geplande vs uitgevoerde belasting per week
  const bel = []; for (let w=Math.max(1,hw-16); w<hw; w++){
    const v = spG.map(x=>x.weken[w]).filter(r=>r && r.gelogd).map(r=>r.uLoad);
    bel.push({w, plan:sum(S.plan.filter(p=>p.groep===g && weekVan(p.dn)===w).map(p=>p.tss)), n:v.length, med:median(v), p25:kwantiel(v,.25), p75:kwantiel(v,.75)}); }
  // 2. momenten en bereik per trainingstype (laatste 8 afgewerkte weken)
  const actief = spG.filter(x => x.W.filter(w=>inV(w.week) && w.gelogd).length >= 2);
  const kpV = x => x.kp.filter(k=>inV(k.week) && (k.status==="uitgevoerd"||k.status==="gemist"));
  const mom = {};
  S.plan.filter(p=>p.groep===g && inV(weekVan(p.dn))).forEach(p => { const m = mom[moment(p.dn,p.dd)] ||= {m:moment(p.dn,p.dd), n:0, types:{}, u:0, b:0, per:{}}; m.n++; sessieTypes(p).forEach(t=>m.types[t]=(m.types[t]||0)+1); });
  const alg = {};
  for (const x of actief){ const a = alg[x.s] = {u:0,b:0};
    for (const k of kpV(x)){ a.b++; if (k.status==="uitgevoerd") a.u++;
      const m = mom[moment(k.dn,k.dd)]; if (!m) continue; const q = m.per[x.s] ||= {u:0,b:0}; q.b++; m.b++; if (k.status==="uitgevoerd"){ q.u++; m.u++; } } }
  const momenten = Object.values(mom).sort((a,b)=>momentOrde(a.m)-momentOrde(b.m));
  momenten.forEach(m => { m.opk = m.b ? m.u/m.b : null; m.vast = Object.values(m.per).filter(q=>q.b>=2 && q.u/q.b>=0.5).length; });
  const kans = (x, m) => { const q = mom[m]?.per[x.s]; if (q && q.b>=2) return q.u/q.b; const a = alg[x.s]; return a?.b ? a.u/a.b*0.8 : 0; };
  const toekomst = S.plan.filter(p=>p.groep===g && p.dn>=VANDAAG && p.dn<VANDAAG+28);
  const bereik = typesLijst().map(([t,l]) => {
    const gepl = S.plan.filter(p=>p.groep===g && inV(weekVan(p.dn)) && sessieTypes(p).includes(t));
    const plMom = {}; gepl.forEach(p => { const m = moment(p.dn,p.dd); plMom[m] = (plMom[m]||0)+1; });
    const perS = actief.map(x => { const wl = x.W.filter(w=>inV(w.week) && w.gelogd).length;
      const n = x.kp.filter(k=>inV(k.week) && k.status==="uitgevoerd" && sessieTypes(pByCel.get(k.cel)).includes(t)).length;
      return {s:x.s, n, wl, perW: wl ? n/wl : 0, nodig: Math.max(1, 0.5*gepl.length*wl/V)}; });
    const toek = toekomst.filter(p=>sessieTypes(p).includes(t)), toekMom = {};
    toek.forEach(p => { const m = moment(p.dn,p.dd); toekMom[m] = (toekMom[m]||0)+1; });
    const verw = actief.map(x => sum(toek.map(p=>kans(x, moment(p.dn,p.dd)))));
    return {t, l, nGepl:gepl.length, plW:gepl.length/V, plMom, perS, bereikt:perS.filter(q=>q.n>=q.nodig).length, toek:toek.length, toekMom, verwGem:avg(verw), verwBereik:verw.filter(v=>v>=1).length};
  });
  // 5. prestaties
  const ledenG = Object.entries(leden()).filter(([,gg])=>gg===g).map(([s])=>s);
  const tests = ledenG.map(s => ({s, t:prestatiesVan(s).testen}));
  const per = spG.flatMap(x => (x.tper||[]).map(p=>({...p, s:x.s})));
  return {g, hw, V, w0, w1, spG, actief, bel, momenten, bereik, ledenG, tests, per, alg};
}

function conclusies(G){
  const c = [], nA = G.actief.length;
  const l4 = G.bel.filter(b=>b.w>=G.hw-4 && b.n>=2 && b.plan>0);
  if (l4.length){ const r = avg(l4.map(b=>b.med/b.plan));
    if (r < 0.75) c.push(["hoog",`De groep haalt de laatste ${l4.length} weken gemiddeld ${pct(r)} van de geplande belasting (mediaan van wie iets invulde). Het schema is in de praktijk zwaarder dan wat de groep traint: minder sessies of beter gekozen momenten helpen meer dan extra volume.`]);
    else if (r > 1.15) c.push(["middel",`De groep traint de laatste ${l4.length} weken ${pct(r)} van de geplande belasting: meer dan gepland (extra trainingen of hogere RPE).`]);
    else c.push(["laag",`De groep haalt de laatste ${l4.length} weken ${pct(r)} van de geplande belasting (mediaan).`]); }
  const zwak = G.momenten.filter(m=>m.n>=3 && m.b>=4 && m.opk<0.4).sort((a,b)=>a.opk-b.opk);
  zwak.slice(0,2).forEach(m => { const tp = Object.entries(m.types).sort((a,b)=>b[1]-a[1]).map(([t])=>typeNaam(t)).slice(0,2).join(", ");
    c.push(["middel",`Moment ${m.m}: opkomst ${pct(m.opk)} over ${m.n} geplande trainingen in ${G.V} weken${tp?` (vooral ${tp})`:""}. Wat hier gepland staat, bereikt weinig sporters.`]); });
  for (const b of G.bereik){
    if (b.nGepl >= 2 && nA >= 3 && b.bereikt/nA < 0.6){
      const pm = Object.entries(b.plMom).sort((x,y)=>y[1]-x[1]).map(([m])=>m);
      const opk = pm.map(m=>`${m} (opkomst ${pct(G.momenten.find(q=>q.m===m)?.opk)})`).join(", ");
      const maxOpk = Math.max(0, ...pm.map(m=>G.momenten.find(q=>q.m===m)?.opk ?? 0));
      const alt = G.momenten.filter(m=>!pm.includes(m.m) && m.opk!=null && m.n>=3 && m.opk >= maxOpk+0.1).sort((x,y)=>y.opk-x.opk)[0];
      const tip = alt ? ` ${alt.m} heeft een hogere opkomst (${pct(alt.opk)}) en kreeg dit type niet: wissel ‘${b.l}’ af over meer momenten.`
        : pm.length===1 ? ` Het staat altijd op hetzelfde moment: wie dan niet kan, krijgt het nooit. Wissel het moment af.` : ` Het staat al op verschillende momenten; het lage bereik komt eerder door lage opkomst in het algemeen.`;
      c.push(["hoog",`${b.l}: maar ${b.bereikt} van de ${nA} actieve sporters kregen minstens de helft van wat gepland stond (${b.nGepl}× in ${G.V} weken). Gepland op ${opk}.${tip}`]);
    }
    if (b.toek >= 1 && nA >= 3 && b.verwBereik/nA < 0.5){
      c.push(["middel",`Komende 4 weken: ‘${b.l}’ staat ${b.toek}× gepland (${Object.keys(b.toekMom).join(", ")}). Op basis van wie wanneer komt, krijgt naar verwachting maar ${b.verwBereik} van de ${nA} sporters dit minstens één keer.`]); }
  }
  // testen
  const datums = [...new Set(G.per.map(p=>p.tot.dn))].sort((a,b)=>a-b), lt = datums[datums.length-1];
  if (lt != null){ const q = G.per.filter(p=>p.tot.dn===lt);
    if (q.length >= 2) c.push(["laag",`Laatste 2 km-test (${ddmm(lt)}): mediaan ${snel(median(q.map(p=>p.sneller)))} t.o.v. de vorige test (${q.length} sporters met beide tests).`]); }
  const cv = clubVergelijking(), bb = cv.bins.filter(b=>b.n>=3);
  if (bb.length >= 2){ const lo = bb[0], hi = bb[bb.length-1];
    if (hi.gem - lo.gem > 0.01) c.push(["laag",`Clubbreed werd wie tussen twee tests ${hi.l} per week trainde gemiddeld ${snel(hi.gem)}, wie ${lo.l} per week trainde ${snel(lo.gem)}. Bruikbaar als motivatie (zie sporterpagina's).`]); }
  const wp = wedstrijdProfiel(G);
  if (wp){ const y = wp.jaren[wp.jaren.length-1], k = d => wp.rijen.find(r=>r.d===d)?.[y]?.med;
    const g200 = k(200), lang = [k(500),k(1000)].filter(v=>v!=null);
    if (g200!=null && lang.length && g200 - Math.min(...lang) >= 3) c.push(["middel",`Wedstrijden ${y}: op 200 m is de achterstand op de winnaar groter (mediaan +${fmt(g200,1)}%) dan op ${lang.length===2?"500/1000":"500 of 1000"} m (+${fmt(Math.min(...lang),1)}%). TMAX en starts maken ${pct(wp.zone.aandeel[5],1)} van de geplande inspanning op het water uit in de ${wp.zone.weken} weken tot de laatste wedstrijd.`]); }
  const r = {hoog:0,middel:1,laag:2}; return c.sort((a,b)=>r[a[0]]-r[b[0]]);
}

function wedstrijdProfiel(G){
  const D = [200,500,1000,2000,5000], rijen = [], jaren = new Set(), alle = [];
  for (const s of G.ledenG) for (const r of prestatiesVan(s).races){ if (r.boot!=="K1" || r.gap==null || !D.includes(r.dist) || !["sprint","lang"].includes(r.soort)) continue;
    const y = new Date(r.dn*864e5).getUTCFullYear(); jaren.add(y); alle.push({...r, s, y}); }
  if (!alle.length) return null;
  const J = [...jaren].sort();
  for (const d of D){ const rij = {d}; let iets = false;
    for (const y of J){ // per lid: beste achterstand per wedstrijd, gemiddeld over de wedstrijden; dan mediaan over de leden
      const perLid = {}; alle.filter(r=>r.dist===d && r.y===y).forEach(r => { const k = r.s, e = r.ev; ((perLid[k] ||= {})[e] = Math.min(perLid[k][e] ?? 1e9, r.gap)); });
      const v = Object.values(perLid).map(o=>avg(Object.values(o)));
      rij[y] = v.length ? {med:median(v), n:v.length} : null; if (v.length) iets = true; }
    if (iets) rijen.push(rij); }
  // geplande zoneverdeling in de 16 weken voor en tijdens de wedstrijden van het laatste jaar
  const ly = J[J.length-1], rDn = alle.filter(r=>r.y===ly).map(r=>r.dn);
  const tot = Math.max(...rDn), van = tot - 139;
  const pz = S.plan.filter(p=>p.groep===G.g && p.dn>=van && p.dn<=tot), weken = Math.max(1, Math.round((tot-van+1)/7));
  const zmin = (S.meta.zones||[]).map((z,i)=>sum(pz.map(p=>p.z?.[i]||0))), inspanning = sum(zmin.slice(1));
  return {rijen, jaren:J, zone:{van, tot, weken, perWeek:zmin.map(v=>v/weken), aandeel:zmin.map((v,i)=>i===0||!inspanning?null:v/inspanning), land:sum(pz.map(p=>p.lm||0))/weken}};
}

function bandGrafiek(bel){
  if (!bel.length) return `<div class="leeg">Geen weken.</div>`;
  const W=900, H=230, ml=44, mr=12, mt=12, mb=34, iw=W-ml-mr, ih=H-mt-mb;
  const maxY = Math.max(50, ...bel.map(b=>Math.max(b.plan, b.p75||0))) * 1.1;
  const slot = iw/bel.length, sy = v => mt + ih - v/maxY*ih, cx = i => ml + slot*(i+.5);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Geplande en uitgevoerde belasting per week">`;
  [0,.25,.5,.75,1].forEach(f => { const v = maxY*f; s += `<line class="grid" x1="${ml}" x2="${ml+iw}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${ml-6}" y="${sy(v)+4}" text-anchor="end">${Math.round(v)}</text>`; });
  bel.forEach((b,i) => s += `<rect x="${cx(i)-slot*0.32}" y="${sy(b.plan)}" width="${slot*0.64}" height="${Math.max(0,sy(0)-sy(b.plan))}" rx="2" fill="var(--beige)" opacity=".8"/>`);
  const met = bel.map((b,i)=>[b,i]).filter(([b])=>b.med!=null);
  if (met.length){
    s += `<polygon fill="var(--or)" opacity=".18" points="${met.map(([b,i])=>cx(i)+","+sy(b.p75)).concat(met.slice().reverse().map(([b,i])=>cx(i)+","+sy(b.p25))).join(" ")}"/>`;
    s += `<polyline fill="none" stroke="var(--or)" stroke-width="2.6" points="${met.map(([b,i])=>cx(i)+","+sy(b.med)).join(" ")}"/>`; }
  bel.forEach((b,i) => { s += `<g><title>W${b.w}: gepland ${fmt(b.plan,0)} TSS${b.med!=null?` · mediaan uitgevoerd ${fmt(b.med,0)} TSS (middelste helft ${fmt(b.p25,0)}–${fmt(b.p75,0)}) · ${b.n} sporters`:" · niemand gelogd"}</title>${b.med!=null?`<circle cx="${cx(i)}" cy="${sy(b.med)}" r="3.5" fill="var(--or)"/>`:""}<rect x="${cx(i)-slot/2}" y="${mt}" width="${slot}" height="${ih}" fill="transparent"/></g>
    <text x="${cx(i)}" y="${H-18}" text-anchor="middle">W${b.w}</text><text x="${cx(i)}" y="${H-5}" text-anchor="middle" style="font-size:9.5px">n=${b.n}</text>`; });
  return `<div class="legende"><span><i style="background:var(--beige);height:10px"></i>gepland (TSS)</span><span><i style="background:var(--or)"></i>mediaan uitgevoerd</span><span><i style="background:var(--or);opacity:.3;height:10px"></i>middelste helft van de groep (p25–p75)</span></div><div class="scroll">${s}</svg></div>`;
}
function spreidGrafiek(P, g){
  if (!P.length) return `<div class="leeg">Nog geen testperiodes met een volledig logboek.</div>`;
  const W=640, H=260, ml=46, mr=12, mt=12, mb=34, iw=W-ml-mr, ih=H-mt-mb;
  const xMax = Math.max(5, Math.ceil(Math.max(...P.map(p=>p.sesW)))), ys = P.map(p=>p.sneller*100);
  const yMin = Math.min(-2, Math.floor(Math.min(...ys))), yMax = Math.max(4, Math.ceil(Math.max(...ys)));
  const sx = v => ml + v/xMax*iw, sy = v => mt + ih - (v-yMin)/(yMax-yMin)*ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Trainingen per week tegenover verbetering op de 2 km">`;
  const stap = (yMax-yMin) > 12 ? 4 : 2;
  for (let v=Math.ceil(yMin/stap)*stap; v<=yMax; v+=stap) s += `<line class="grid" x1="${ml}" x2="${ml+iw}" y1="${sy(v)}" y2="${sy(v)}" ${v===0?'stroke-width="1.6"':""}/><text x="${ml-6}" y="${sy(v)+4}" text-anchor="end">${v}%</text>`;
  for (let v=0; v<=xMax; v++) s += `<text x="${sx(v)}" y="${H-16}" text-anchor="middle">${v}</text>`;
  s += `<text x="${ml+iw/2}" y="${H-2}" text-anchor="middle">trainingen per week tussen twee tests</text>`;
  const kl = {A:"var(--or)", B:"var(--blauw)"};
  for (const p of P){ const eigen = p.g===g;
    s += `<circle cx="${sx(p.sesW)}" cy="${sy(p.sneller*100)}" r="${eigen?5.5:4}" fill="${eigen?(kl[p.g]||"var(--muted)"):"var(--bg)"}" stroke="${kl[p.g]||"var(--muted)"}" stroke-width="2"><title>${esc(p.s)} (${p.g}) ${ddmm(p.van.dn)}–${ddmm(p.tot.dn)}: ${fmt(p.sesW,1)}×/week, ${snel(p.sneller)} (${fsec(p.van.s)} → ${fsec(p.tot.s)})</title></circle>`; }
  return `<div class="legende"><span><i style="background:var(--or);height:8px;width:8px;border-radius:50%"></i>groep A</span><span><i style="background:var(--blauw);height:8px;width:8px;border-radius:50%"></i>groep B</span><span>gevuld = deze groep</span></div>${s}</svg>`;
}

function renderGroep(g){
  const A = S.afgeleid;
  let h = `<h2>Groepsanalyse ${g}</h2><p class="muted">Gericht op het schema van de hele groep, niet op individuen. Momenten en bereik: laatste ${8} afgewerkte weken. Andere groep: ${S.meta.groepen.filter(x=>x!==g).map(x=>`<a href="#groep-${x}">groep ${x}</a>`).join(" · ")}</p>`;
  if (!S.log){ $("#app").innerHTML = h + `<div class="melding">Het logboek is nog niet ingelezen. Klik op <b>Logboek vernieuwen</b>.</div>`; return; }
  if (S.leden) h += invullersHtml([g]);
  const G = groepAnalyse(g), C = conclusies(G);
  h += `<h3>Conclusies voor het schema</h3><div class="scroll"><table><thead><tr><th>Prio</th><th>Vaststelling</th></tr></thead><tbody>${C.map(([n,t])=>`<tr><td>${tag(n)}</td><td>${esc(t)}</td></tr>`).join("") || `<tr><td colspan="2">Niets opvallends.</td></tr>`}</tbody></table></div>`;
  // 1
  h += `<h2>Geplande vs uitgevoerde belasting</h2>${bandGrafiek(G.bel)}<div class="f">Per week: geplande TSS van de groep en de TSS van wie die week iets invulde (mediaan en middelste helft). Weken zonder invoer van een sporter tellen voor die sporter niet mee. De mediaan wordt niet vertekend door één uitschieter.</div>`;
  // 2
  h += `<h2>Wie komt wanneer: bereik per doel</h2><p class="muted">${G.actief.length} actieve sporters (≥ 2 gelogde weken in W${G.w0}–W${G.w1}). Een training telt als ‘gekregen’ wanneer de sporter op die dag een training van dezelfde categorie invulde.</p>`;
  h += `<h3>Bereik per doel</h3><div class="scroll"><table><thead><tr><th>${perDoel()?"Doel":"Type"}</th><th class="num">Gepland/week</th><th>Gepland op (× in ${G.V} w)</th><th class="num">Bereik (≥ helft van gepland)</th><th class="num">Gem. gekregen/week</th><th>Komende 4 weken gepland op</th><th class="num">Verwacht bereik (≥ 1×)</th></tr></thead><tbody>
   ${G.bereik.filter(b=>b.plW>0 || b.toek>0).map(b => { const r = G.actief.length ? b.bereikt/G.actief.length : null, rv = G.actief.length ? b.verwBereik/G.actief.length : null;
     return `<tr><td>${perDoel()?doelChip({doel:b.t,doel_auto:false}):`<b>${esc(b.l)}</b>`}</td><td class="num">${fmt(b.plW,1)}</td><td>${Object.entries(b.plMom).sort((x,y)=>momentOrde(x[0])-momentOrde(y[0])).map(([m,n])=>`${m} (${n})`).join(", ")||"–"}</td>
      <td class="num" title="${esc(b.perS.map(q=>`${q.s}: ${q.n}× gekregen`).join(" · "))}">${r==null?"–":`<span class="pil ${r>=0.8?"p-ok":r>=0.6?"p-warn":"p-bad"}">${b.bereikt}/${G.actief.length}</span>`}</td>
      <td class="num">${fmt(avg(b.perS.map(q=>q.perW)),2)}</td><td>${Object.entries(b.toekMom).sort((x,y)=>momentOrde(x[0])-momentOrde(y[0])).map(([m,n])=>`${m} (${n})`).join(", ")||"–"}</td>
      <td class="num" title="gemiddeld verwacht ${fmt(b.verwGem,1)}× per sporter">${b.toek&&rv!=null?`<span class="pil ${rv>=0.8?"p-ok":rv>=0.5?"p-warn":"p-bad"}">${b.verwBereik}/${G.actief.length}</span>`:"–"}</td></tr>`; }).join("")}</tbody></table></div>
   <div class="f">${perDoel()?"Per doel uit het schema (kolom Doel: gekozen in KW of automatisch berekend; wedstrijden tellen niet mee). ":"Types uit de planning (geen doelen in dit schema): sprint = TMAX-minuten of ‘start’ (niet ‘startactivatie’) in de inhoud · intervallen = ≥ 5 min T3+T4 · duur = overige watertraining · kracht/core/lopen-fietsen uit het landtype. "}Bereik = actieve sporters die minstens de helft kregen van wat er van dat type gepland stond in de weken dat ze iets invulden. Verwacht bereik = Σ over de geplande trainingen van de kans dat de sporter op dat moment komt (eigen opkomst op dat moment in de laatste ${G.V} weken; nooit gepland op dat moment → 80% van de eigen gemiddelde opkomst). Trainingen die een sporter zelf op een ander moment doet, tellen niet.</div>`;
  // momentenraster
  h += `<h3>Opkomst per moment (per sporter)</h3><div class="scroll"><table class="hm"><thead><tr><th>Sporter</th>${G.momenten.map(m=>`<th title="${esc(Object.entries(m.types).map(([t,n])=>typeNaam(t)+" "+n+"×").join(", "))}">${m.m}</th>`).join("")}<th class="num">Gemiddeld</th></tr></thead><tbody>
   ${G.actief.map(x=>`<tr><td><b>${esc(x.s)}</b></td>${G.momenten.map(m=>{ const q = m.per[x.s]; if (!q||!q.b) return `<td></td>`; const v = q.u/q.b; return `<td><span class="pil ${v>=0.75?"p-ok":v>=0.4?"p-warn":"p-bad"}" title="${q.u}/${q.b}">${pct(v)}</span></td>`; }).join("")}<td class="num">${pct(G.alg[x.s].b?G.alg[x.s].u/G.alg[x.s].b:null)}</td></tr>`).join("")}
   <tr><td><b>Groep</b></td>${G.momenten.map(m=>`<td><b>${pct(m.opk)}</b></td>`).join("")}<td></td></tr>
   <tr><td class="muted">gepland (× in ${G.V} w)</td>${G.momenten.map(m=>`<td class="muted">${m.n}</td>`).join("")}<td></td></tr>
   <tr><td class="muted">vaste klanten (≥ 50%)</td>${G.momenten.map(m=>`<td class="muted">${m.vast}</td>`).join("")}<td></td></tr></tbody></table></div>
   <div class="f">Opkomst = uitgevoerd / (uitgevoerd + gemist) op dat moment, enkel weken waarin de sporter iets invulde. Beweeg over een moment voor de doelen die er gepland stonden.</div>`;
  // 5 prestaties
  h += `<h2>Prestaties</h2>`;
  if (!S.prest) h += `<div class="melding">Nog geen test- of wedstrijdgegevens op dit toestel. Klik op <b>Logboek vernieuwen</b> (testtijden komen mee uit de Google Sheet).</div>`;
  else {
    for (const dist of [2000,200]){
      const datums = [...new Set(G.tests.flatMap(q=>q.t.filter(t=>t.dist===dist && !t.maand && t.dn>=dn(S.jaar,1,1)).map(t=>t.dn)))].sort((a,b)=>a-b);
      if (!datums.length) continue;
      const marge = dist===200 ? 0.5 : 10, nd = dist===200 ? 1 : 0;
      const rows = G.tests.filter(q=>q.t.some(t=>t.dist===dist && datums.includes(t.dn)));
      h += `<h3>${dist===200?"200 m-test":"2 km-test"} ${S.jaar}</h3><div class="scroll"><table class="hm"><thead><tr><th>Lid</th>${datums.map(d=>`<th>${ddmm(d)}</th>`).join("")}<th class="num">Eerste → laatste</th></tr></thead><tbody>
       ${rows.map(q=>{ const v = datums.map(d=>q.t.find(t=>t.dist===dist && t.dn===d)); let vorige = null;
         const cel = v.map(t => { if (!t) return `<td></td>`; const d = vorige ? t.s-vorige.s : null; vorige = t; return `<td><span class="pil ${d==null?"p-grijs":d<=-marge?"p-ok":d>=marge?"p-bad":"p-warn"}" title="${d==null?"eerste test":(d>0?"+":"")+fmt(d,nd)+" s t.o.v. vorige"}">${fsec(t.s,nd)}</span></td>`; }).join("");
         const tt = v.filter(Boolean), r = tt.length>=2 ? (tt[0].s-tt[tt.length-1].s)/tt[0].s : null;
         return `<tr><td><b>${esc(q.s)}</b>${S.meta.sporters[q.s]?"":' <span class="muted">(geen logboek)</span>'}</td>${cel}<td class="num">${snel(r)}</td></tr>`; }).join("")}
       <tr><td><b>Mediaan</b></td>${datums.map(d=>`<td><b>${fsec(median(rows.map(q=>q.t.find(t=>t.dist===dist && t.dn===d)?.s)),nd)}</b></td>`).join("")}<td></td></tr></tbody></table></div>`;
      if (dist===2000 && g!=="A" && PR().a_grens_2km_s){ const gr = PR().a_grens_2km_s, ld = rows.map(q=>q.t.filter(t=>t.dist===2000).slice(-1)[0]).filter(Boolean);
        h += `<p class="muted">A-grens ${fsec(gr)}: ${ld.filter(t=>t.s<=gr).length} van de ${ld.length} leden zitten eronder op hun laatste test; mediaan afstand ${fmt(median(ld.map(t=>t.s-gr)),0)} s.</p>`; }
    }
    // per testperiode
    const per = {}; G.per.forEach(p => (per[p.van.dn+"-"+p.tot.dn] ||= []).push(p));
    const pk = Object.keys(per).sort();
    if (pk.length) h += `<h3>Per testperiode</h3><div class="scroll"><table><thead><tr><th>Periode</th><th class="num">Sporters</th><th class="num">Mediaan verbetering</th><th class="num">Trainingen/week (mediaan)</th><th class="num">TSS/week (mediaan)</th><th class="num">Compliance (mediaan)</th></tr></thead><tbody>
      ${pk.map(k=>{ const q = per[k], ok = q.filter(p=>p.ok); return `<tr><td>${ddmm(q[0].van.dn)} → ${ddmm(q[0].tot.dn)}</td><td class="num">${q.length}${ok.length<q.length?` <span class="muted">(${ok.length} met volledig logboek)</span>`:""}</td><td class="num">${snel(median(q.map(p=>p.sneller)))}</td><td class="num">${fmt(median(ok.map(p=>p.sesW)),1)}</td><td class="num">${fmt(median(ok.map(p=>p.tssW)),0)}</td><td class="num">${pct(median(ok.map(p=>p.compl)))}</td></tr>`; }).join("")}</tbody></table></div>`;
    // club: trainingsfrequentie vs verbetering
    const cv = clubVergelijking();
    h += `<h3>Trainingsfrequentie en verbetering (hele club)</h3><div class="twee"><div>${spreidGrafiek(cv.P, g)}</div><div><div class="scroll"><table><thead><tr><th>Trainingen per week</th><th class="num">Testperiodes</th><th class="num">Gemiddeld</th><th class="num">Mediaan</th></tr></thead><tbody>${cv.bins.map(b=>`<tr><td>${b.l}</td><td class="num">${b.n}</td><td class="num">${b.n?snel(b.gem):"–"}</td><td class="num">${b.n?snel(b.med):"–"}</td></tr>`).join("")}</tbody></table></div>
      <div class="f">Elke punt = één sporter tussen twee opeenvolgende 2 km-tests (14–140 dagen), met ≥ 60% van de weken gelogd. Verbetering = (vorige − nieuwe tijd) / vorige tijd. Kleine aantallen: een verband, geen bewijs. Groei bij jongeren, weer en water spelen mee.</div></div></div>`;
    // wedstrijdprofiel
    const wp = wedstrijdProfiel(G);
    if (wp){ const z = S.meta.zones||[];
      h += `<h3>Wedstrijdprofiel K1 en geplande intensiteit</h3><div class="twee"><div><div class="scroll"><table><thead><tr><th>Afstand</th>${wp.jaren.map(y=>`<th class="num">${y}</th>`).join("")}</tr></thead><tbody>${wp.rijen.map(r=>`<tr><td>${r.d} m</td>${wp.jaren.map(y=>`<td class="num">${r[y]?`+${fmt(r[y].med,1)}% <span class="muted">(${r[y].n})</span>`:"–"}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
        <div class="f">Mediaan over de leden van de achterstand op de winnaar (per lid: beste race per wedstrijd, gemiddeld over de wedstrijden). Tussen haakjes: aantal leden.</div></div>
        <div><div class="scroll"><table><thead><tr><th>Zone</th><th class="num">Min/week gepland</th><th class="num">Aandeel inspanning</th></tr></thead><tbody>${z.map((zz,i)=>`<tr><td>${zz}</td><td class="num">${fmt(wp.zone.perWeek[i],0)}</td><td class="num">${i?pct(wp.zone.aandeel[i],1):'<span class="muted">invaren/rust</span>'}</td></tr>`).join("")}<tr><td>Land</td><td class="num">${fmt(wp.zone.land,0)}</td><td></td></tr></tbody></table></div>
        <div class="f">Gepland voor groep ${g} van ${ddmm(wp.zone.van)} tot ${ddmm(wp.zone.tot)} (de ${wp.zone.weken} weken tot en met de laatste wedstrijd van ${wp.jaren[wp.jaren.length-1]}).</div></div></div>`; }
  }
  $("#app").innerHTML = h;
}

  if (!dl || typeof XLSX==="undefined"){ melding("Downloaden is in deze weergave niet beschikbaar.","fout"); return; }
  const A = S.afgeleid, wb = XLSX.utils.book_new();

  add("Opmerkingen", A.invoer.filter(e=>e.nota).concat(A.notities||[]).sort((a,b)=>a.dn-b.dn).map(e=>({Sporter:e.sporter, Groep:e.groep, Week:e.week, Datum:isoDn(e.dn), Dagdeel:e.dd||"", Training:("soort" in e)?(e.match?e.match.type:(e.soort||e.cat)+" (extra)"):"geen training ingevuld", RPE:e.rpe??null, Gevoel:e.gevoelRuw||"", Opmerking:e.nota, Label:e.tags.map(k=>NOTA_LAB[k]).join(", "), Bron:e.cel})));
  const kop = A.kop.map(k=>({Sporter:k.sporter, Groep:k.groep, Week:k.week, Datum:isoDn(k.dn), Dag:k.dag, Dagdeel:k.dd, Categorie:k.cat, Type:k.type, "Geplande duur":k.duur, "Geplande km":k.km, Status:k.status, "Uitgev. min":k.e?.min??null, "Uitgev. km":k.e?.km??null, "Afwijking duur":k.afwDuur, "Afwijking afstand":k.afwKm, Invoer:k.e?.cel||"", Opmerking:k.opm, Bron:k.cel}));
  add("Koppeling", kop);
  add("Trainerslog", Object.values((S.tlog||{}).items||{}).sort((a,b)=>String(a.d).localeCompare(String(b.d))||String(a.groep).localeCompare(String(b.groep))).map(t=>({Datum:t.d, Groep:t.groep, Dagdeel:t.dd||"", Gepland:t.plan||"", Status:TL_STATUS[t.status]||t.status, Reden:TL_REDENEN[t.reden]||"", "Uitgevoerd (inhoud)":t.uit?.inhoud||"", "Duur (min)":t.uit?.duur??null, "Afstand (km)":t.uit?.km??null, "Doel (uitgevoerd)":t.uit?.doel||"", Opmerking:t.opm||"", Door:t.door, Tijd:(t.tijd||"").replace("T"," "), Bron:t.cel})));
  add("Extra trainingen", A.extra.map(e=>({Sporter:e.sporter, Week:e.week, Datum:isoDn(e.dn), Soort:e.soort, Categorie:e.cat, km:e.km, min:e.min, Bron:e.cel})));

  // Week per sporter met formules op Koppeling (A=Sporter, C=Week, K=Status)
  const n = kop.length+1, rows = [["Sporter","Groep","Week","Gepland","Uitgevoerd","Gemist","Niet gelogd","Te controleren","Beoordeeld","Compliance","Uren uitgevoerd","km uitgevoerd","TSS uitgevoerd","Fitheid CTL (einde week)","Vermoeidheid ATL","Vorm TSB","Gevoel gem.","RPE gem.","ΔRPE gem.","TSS gepland"]];

      {t:"n",f:`COUNTIFS(${c},Koppeling!$K$2:$K$${n},"niet gelogd")`}, {t:"n",f:`COUNTIFS(${c},Koppeling!$K$2:$K$${n},"te controleren")`}, {t:"n",f:`E${i}+F${i}`}, {t:"n",f:`IF(I${i}=0,"",E${i}/I${i})`},
      Math.round(w.uMin/6)/10, Math.round(w.uKm*10)/10, Math.round(w.uLoad), eind.ctl!=null?Math.round(eind.ctl*10)/10:null, eind.atl!=null?Math.round(eind.atl*10)/10:null, eind.ctl!=null?Math.round((eind.ctl-eind.atl)*10)/10:null, w.gevoel, w.rpe, w.dRpe!=null?Math.round(w.dRpe*10)/10:null, Math.round(w.plLoad)]);
