<style>
/* Layout: oranje KKYKC-band bovenaan, daaronder tabbladen; team-overzicht als scanbare tabel, sporterview als TrainingPeaks-achtige kalender + PMC */
:root{
  --or:#C96008; --or-ink:#9A4700; --geel:#FDE68A; --licht:#FFF3E0; --beige:#E2D3C3;
  --bg:#FFFFFF; --panel:#FFFBF6; --fg:#1C1712; --muted:#6E6257; --line:#E8DDD0;
  --ok:#2F7D3B; --ok-bg:#DCEFDD; --warn:#9A6A00; --warn-bg:#FCEBB6; --oranje:#B4560B; --oranje-bg:#FAD9BC;
  --bad:#A8261B; --bad-bg:#F6CFC9; --grijs-bg:#ECE7E1; --blauw:#2F6B8F;
  --ctl:#2F6B8F; --atl:#C2185B; --tsb:#C96008;
  --font:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --mono:ui-monospace,Consolas,"SF Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130F; --panel:#211B15; --fg:#F3ECE4; --muted:#B2A595; --line:#3A3027; --licht:#2A2018; --beige:#4A3B2E;
  --ok:#7FCB8A; --ok-bg:#1F3A24; --warn:#E9C25A; --warn-bg:#3D3112; --oranje:#F0A060; --oranje-bg:#43280F;
  --bad:#F08A7E; --bad-bg:#47201B; --grijs-bg:#2C2620; --blauw:#7DB3D6; --ctl:#7DB3D6; --atl:#F48FB1; --tsb:#F0A060; --or-ink:#F0A060; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130F; --panel:#211B15; --fg:#F3ECE4; --muted:#B2A595; --line:#3A3027; --licht:#2A2018; --beige:#4A3B2E;
  --ok:#7FCB8A; --ok-bg:#1F3A24; --warn:#E9C25A; --warn-bg:#3D3112; --oranje:#F0A060; --oranje-bg:#43280F;
  --bad:#F08A7E; --bad-bg:#47201B; --grijs-bg:#2C2620; --blauw:#7DB3D6; --ctl:#7DB3D6; --atl:#F48FB1; --tsb:#F0A060; --or-ink:#F0A060; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
.band{background:var(--or);color:#fff}
.band-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{height:58px;width:auto}
.titel{flex:1 1 260px;min-width:0}
.eyebrow{color:var(--geel);font-weight:bold;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.titel h1{margin:2px 0;font-size:22px;text-wrap:balance}
.status{color:var(--geel);font-size:12.5px}
.acties{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid transparent;padding:7px 12px}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--geel);outline-offset:2px}
.btn-wit{background:#fff;color:#7A3A00;font-weight:bold}
.btn-wit:hover{background:var(--geel)}
.btn-rand{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.btn-rand:hover{background:rgba(255,255,255,.14)}
button:disabled{opacity:.55;cursor:wait}
.wrap{max-width:1240px;margin:0 auto;padding-block:8px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--or);margin:12px 0 16px;align-items:flex-end}
nav.tabs a{padding:8px 14px;color:var(--fg);text-decoration:none;border-radius:6px 6px 0 0;font-weight:bold}
nav.tabs a[aria-current="page"]{background:var(--or);color:#fff}
nav.tabs select{margin-left:auto;font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);margin-bottom:6px}
h2{color:var(--or-ink);font-size:18px;margin:26px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--beige)}
h3{font-size:15px;margin:16px 0 6px}
.muted{color:var(--muted);font-size:12.5px}
.f{color:var(--muted);font-family:var(--mono);font-size:11.5px;line-height:1.35}
.melding{border-left:5px solid var(--or);background:var(--licht);padding:10px 14px;margin:12px 0;border-radius:0 6px 6px 0}
.melding.fout{border-color:var(--bad);background:var(--bad-bg)}
.voortgang{height:6px;background:var(--grijs-bg);border-radius:3px;overflow:hidden;margin-top:6px}
.voortgang i{display:block;height:100%;background:var(--or);width:0;transition:width .2s}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{background:var(--or);color:#fff;text-align:left;padding:6px 8px;font-size:12.5px;white-space:nowrap;position:sticky;top:0}
td{border-bottom:1px solid var(--line);padding:5px 8px;vertical-align:top}
tbody tr:nth-child(even) td{background:var(--licht)}
td.num,th.num{text-align:right}
td[title]{cursor:help}
tr.klik{cursor:pointer}
tr.klik:hover td{background:var(--geel);color:#3a2a00}
.pil{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:bold;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-oranje{background:var(--oranje-bg);color:var(--oranje)}.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-grijs{background:var(--grijs-bg);color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-top:4px solid var(--or);background:var(--panel);padding:10px 12px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}.tile .v{font-size:26px;font-weight:bold;margin:2px 0}
.twee{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.twee>*{min-width:0}
svg text{fill:var(--muted);font-family:var(--font);font-size:11px}
svg .grid{stroke:var(--line)}
.legende{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin:2px 0 4px}
.legende i{display:inline-block;width:14px;height:4px;vertical-align:middle;margin-right:5px;border-radius:2px}
.kal{display:grid;grid-template-columns:62px repeat(7,minmax(118px,1fr));gap:4px;min-width:900px}
.kal .kh{font-weight:bold;font-size:12px;color:var(--muted);padding:2px 4px}
.kal .wk{font-size:12px;color:var(--muted);padding:4px;border-top:2px solid var(--beige)}
.dag{border:1px solid var(--line);background:var(--panel);min-height:64px;padding:4px;display:flex;flex-direction:column;gap:4px;min-width:0}
.dag.vandaag{outline:2px solid var(--or)}
.dag .dnr{font-size:11px;color:var(--muted)}
.wo{border-radius:4px;padding:4px 6px;font-size:12px;border-left:5px solid var(--muted);background:var(--grijs-bg);overflow-wrap:anywhere}
.wo b{display:block;font-size:12px}
.wo[data-kal]{cursor:pointer}.wo[data-kal]:hover{filter:brightness(.95);outline:1px solid var(--or)}.wo[data-kal]:focus-visible{outline:2px solid var(--or);outline-offset:1px}
.kd-ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.kd{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-top:4px solid var(--or);border-radius:8px;max-width:720px;width:100%;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.kd-kop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}.kd-kop h3{margin:2px 0 6px}
.tg-t{width:100%;border-collapse:collapse;margin:8px 0}.tg-t th,.tg-t td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tg-t thead th{font-size:12px;border-bottom:2px solid var(--or);color:var(--muted)}
.tg-pil{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:bold}
.tg-open{background:var(--warn-bg);color:var(--warn)}.tg-ok{background:var(--ok-bg);color:var(--ok)}.tg-af{background:var(--bad-bg);color:var(--bad)}
.tg-act button{font-size:12px;padding:3px 8px;margin:0 4px 2px 0;border:1px solid var(--or);background:var(--panel);color:var(--or-ink,inherit);font-weight:bold}
.tg-act button.tg-g{border-color:var(--ok);color:var(--ok)}.tg-act button.tg-r{border-color:var(--bad);color:var(--bad)}
.tg-tel{background:#fff;color:#7A3A00;border-radius:9px;padding:0 6px;margin-left:4px;font-size:12px;font-weight:bold}
.kd-x{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;font-size:20px;line-height:1;width:34px;height:34px;cursor:pointer}
.kd-t{width:100%;border-collapse:collapse;margin:4px 0 8px}.kd-t th,.kd-t td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.kd-t th{background:transparent!important;color:var(--muted)!important;text-transform:none;letter-spacing:0}.kd-t tbody tr,.kd-t tbody td{background:transparent!important}
.kd-t thead th{font-size:12px;font-weight:bold;border-bottom:2px solid var(--or)}.kd-t tbody th{font-weight:normal;white-space:nowrap}
.kd-z th{background:var(--panel)!important;color:var(--fg)!important}
.kd h4{margin:12px 0 4px;color:var(--or-ink)}.kd-inh{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.kd-z{border-collapse:collapse;margin-top:6px}.kd-z th,.kd-z td{padding:2px 8px;border:1px solid var(--line);font-size:12px}
@media (max-width:600px){.kd-ovl{padding:10px 8px}.kd{padding:12px}.kd-t th,.kd-t td{padding:4px 5px;font-size:12.5px}}
.wo.c-groen{border-color:var(--ok);background:var(--ok-bg)}.wo.c-geel{border-color:var(--warn);background:var(--warn-bg)}
.wo.c-oranje{border-color:var(--oranje);background:var(--oranje-bg)}.wo.c-rood{border-color:var(--bad);background:var(--bad-bg)}
.wo.c-gepland{border-color:var(--beige);background:transparent;border-style:solid dashed dashed solid;border-width:1px 1px 1px 5px}
.wo.c-extra{border-color:var(--blauw)}
.wo.c-nl{border-color:var(--muted);background:transparent;opacity:.75}
.wo.c-nota{border-color:var(--beige);background:transparent;font-style:italic}
.wo .nota{display:block;font-style:italic;margin-top:2px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.filters button{font-size:12px;padding:3px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink,inherit)}
.filters button.actief{border-color:var(--or);background:var(--licht);font-weight:bold}
.nota-t{max-width:420px;overflow-wrap:anywhere}
.hm td{text-align:center;padding:3px 4px;font-size:12px;white-space:nowrap}
.hm td:first-child{text-align:left}
.leeg{padding:30px;text-align:center;border:1px dashed var(--beige);border-radius:8px;color:var(--muted)}
.periode{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:-6px 0 14px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;font-size:13px}
.periode label{font-weight:bold;color:var(--or-ink)}
.periode select,.periode input{font:inherit;padding:5px 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.periode .muted{margin-left:auto}
.act{display:flex;flex-wrap:wrap;gap:4px;min-width:220px}
.act button{font-size:12px;padding:3px 8px;border:1px solid var(--or);background:var(--panel);color:var(--or-ink);font-weight:bold}
.act button:hover{background:var(--licht)}
.act button.zacht{border-color:var(--line);color:var(--muted);font-weight:normal}
.act form{display:flex;gap:4px;align-items:center;width:100%}
.act input{font:inherit;font-size:12px;padding:3px 6px;width:9em;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
td a.sheet{color:var(--blauw);white-space:nowrap}
tr.totaal td{font-weight:bold;border-top:2px solid var(--or);background:var(--licht)!important}
footer{margin-top:30px;text-align:center;font-style:italic;color:#A0A0A0;font-size:11.5px}
@media (max-width:600px){.titel h1{font-size:19px}.logo{height:44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/* Thema: keuze licht/donker per toestel (enkel deze voorkeur in de browser; geen sportergegevens) */
(function(){ var t=null; try{ t=localStorage.getItem("kkykc-thema"); }catch(e){}
  if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t); })();
function themaHuidig(){ var t=document.documentElement.getAttribute("data-theme");
  if(t==="light"||t==="dark") return t;
  return (window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"; }
function themaKnop(){ var b=document.getElementById("btnThema"); if(!b) return;
  var d=themaHuidig()==="dark"; b.textContent=d?"\u2600 Lichte modus":"\u263E Donkere modus";
  b.setAttribute("aria-pressed",d?"true":"false"); b.title=d?"Overschakelen naar lichte modus":"Overschakelen naar donkere modus"; }
function themaWissel(){ var n=themaHuidig()==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",n); try{ localStorage.setItem("kkykc-thema",n); }catch(e){} themaKnop(); }
</script>

<script>
"use strict";
/* ============================== hulpfuncties ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAGEN = ["maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag","zondag"];
const DAGK = ["ma","di","wo","do","vr","za","zo"];
const MAANDEN = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const dn = (y,m,d) => Math.round(Date.UTC(y,m-1,d)/864e5);              // dagnummer
const dnIso = s => { const [y,m,d] = s.split("-").map(Number); return dn(y,m,d); };
const isoDn = n => new Date(n*864e5).toISOString().slice(0,10);
const ddmm = n => { const d = new Date(n*864e5); return String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0"); };
const wd = n => ((n % 7) + 10) % 7;                                       // 0 = maandag
const nu = new Date();
const VANDAAG = dn(nu.getFullYear(), nu.getMonth()+1, nu.getDate());
const pct = (x,nd=0) => x==null||!isFinite(x) ? "–" : (x*100).toFixed(nd).replace(".",",")+"%";
const fmt = (x,nd=1) => x==null||!isFinite(x) ? "–" : x.toFixed(nd).replace(".",",");
const sgnN = (x,nd=1) => { if (x==null||!isFinite(x)) return "–"; const v = Number(x.toFixed(nd)); return v===0 ? fmt(0,nd) : (v>0?"+":"")+fmt(v,nd); };
const sgn = x => x==null||!isFinite(x) ? "–" : (x>0?"+":"")+pct(x);
const uur = m => m==null ? "–" : (Math.floor(m/60)+"u"+String(Math.round(m%60)).padStart(2,"0"));
const num = v => { if (v==null) return null; const s = String(v).trim().replace(",",".").replace(/\s*(km|kilometer)$/i,""); if (s==="") return null; const x = Number(s); return isFinite(x) ? x : null; };
const sum = a => a.reduce((s,x)=>s+(x||0),0);
const avg = a => { const b = a.filter(x=>x!=null); return b.length ? sum(b)/b.length : null; };
function lsGet(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function melding(html, soort=""){ const d = document.createElement("div"); d.className = "melding "+soort; d.innerHTML = html; $("#meldingen").prepend(d); return d; }
const PAGINA_WIE = "";   /* KKYKC-app: niets bewaren op het toestel */   // v8: ingevuld door doGet (account waarmee de pagina geladen werd; sleutel van de browsercache)

/* ============================== v8 (11/11/2026): eerst de laatst geladen gegevens tonen ==============================
   De pagina bewaart de serverantwoorden in deze browser (IndexedDB, per Google-account, max. 14 dagen) en toont die meteen bij het openen.
   Daarna één snelle aanroep (getStempels): is er iets gewijzigd in de bronnen, dan verschijnt bovenaan 'Nieuwe gegevens beschikbaar' + Vernieuwen.
   Geen IndexedDB, ander account of te oud → gewoon laden zoals vroeger. */
const KC = (() => {
  const V = "c1", MAX_DAGEN = 14;
  const LABEL = {v:"nieuwe versie van de app", dag:"nieuwe dag", jaar:"jaar", schema:"schema", tlog:"trainerslog", bib:"bibliotheek", not:"notities", data:"logboek", test:"testtijden", ctl:"te controleren", wed:"wedstrijden", planning:"planning (Planning KKYKC)", "?":"onbekend"};
  let dbp = null, tm = null;
  const open = () => dbp || (dbp = new Promise((ok, nok) => {
    const t = setTimeout(() => nok(new Error("IndexedDB antwoordt niet")), 2500);
    try {
      const r = indexedDB.open("kkykc-cache", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("c");
      r.onsuccess = () => { clearTimeout(t); ok(r.result); };
      r.onerror = () => { clearTimeout(t); nok(r.error); };
    } catch(e){ clearTimeout(t); nok(e); }
  }));
  const tx = (modus, f) => open().then(db => new Promise((ok, nok) => {
    const t = db.transaction("c", modus), r = f(t.objectStore("c"));
    t.oncomplete = () => ok(r && r.result); t.onerror = t.onabort = () => nok(t.error);
  }));
  const wie = () => String(PAGINA_WIE || "").toLowerCase();
  const actief = () => wie().indexOf("@") > 0 && typeof indexedDB !== "undefined";
  const sleutel = p => p + "|" + wie() + "|" + V;
  const twee = n => String(n).padStart(2, "0");
  const wanneer = t => {
    const d = new Date(t), nu = new Date(), u = twee(d.getHours()) + ":" + twee(d.getMinutes());
    const dag = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(), v = Math.round((dag(nu) - dag(d)) / 864e5);
    return v === 0 ? "vandaag " + u : v === 1 ? "gisteren " + u : ["zo","ma","di","wo","do","vr","za"][d.getDay()] + " " + twee(d.getDate()) + "/" + twee(d.getMonth() + 1) + " " + u;
  };
  return {
    actief,
    async lees(p){
      if (!actief()) return null;
      try { const c = await tx("readonly", s => s.get(sleutel(p))); return c && c.t && Date.now() - c.t < MAX_DAGEN * 864e5 ? c : null; } catch(e){ return null; }
    },
    async bewaar(p, c){ if (!actief() || !c) return; try { await tx("readwrite", s => s.put(c, sleutel(p))); } catch(e){} },
    async wis(){ try { await tx("readwrite", s => s.clear()); } catch(e){} },
    /* sleutels waarin de stempels verschillen ([] = alles actueel) */
    verschil(oud, nieuw){ if (!oud || !nieuw) return ["?"]; return Object.keys(nieuw).filter(k => String(oud[k]) !== String(nieuw[k])); },
    kopie(x){ try { return typeof structuredClone === "function" ? structuredClone(x) : JSON.parse(JSON.stringify(x)); } catch(e){ return JSON.parse(JSON.stringify(x)); } },
    wanneer,
    /* melding bovenaan: controle · actueel · nieuw · fout · bezig · klaar · misl */
    balk(staat, t, extra, actie){
      let d = document.getElementById("cachebalk");
      if (!d){ d = document.createElement("div"); d.id = "cachebalk"; d.setAttribute("role", "status"); const m = document.getElementById("meldingen"); m.parentNode.insertBefore(d, m); }
      clearTimeout(tm);
      const w = t ? wanneer(t) : "", delen = Array.isArray(extra) ? [...new Set(extra.map(k => LABEL[k] || k))].join(", ") : esc(extra || "");
      const txt = {
        controle: `Getoond: gegevens van <b>${w}</b> · nagaan of er nieuwe gegevens zijn…`,
        actueel: `Gegevens zijn up-to-date (geladen ${w}).`,
        nieuw: `<span><b>Nieuwe gegevens beschikbaar</b> (${delen}). Getoond: gegevens van <b>${w}</b>.</span>`,
        fout: `<span>Kon niet nagaan of er nieuwe gegevens zijn${delen ? " (" + delen + ")" : ""}. Getoond: gegevens van <b>${w}</b>.</span>`,
        bezig: `Nieuwe gegevens laden…`,
        klaar: `Gegevens bijgewerkt.`,
        misl: `<span><b>Vernieuwen mislukt</b>${delen ? " (" + delen + ")" : ""}. Getoond: gegevens van <b>${w}</b>.</span>`
      }[staat] || "";
      d.className = "cb-" + staat;
      d.innerHTML = txt + (actie ? `<button type="button" id="cbKnop">Vernieuwen</button>` : "");
      if (actie) d.querySelector("#cbKnop").onclick = () => { d.querySelector("#cbKnop").disabled = true; actie(); };
      if (staat === "actueel" || staat === "klaar") tm = setTimeout(() => d.remove(), 4000);
    }
  };
})();


/* ============================== toestand ============================== */
const use = n => (window.claude && window.claude.use) ? window.claude.use(n) : Promise.resolve(null);
const S = { meta:null, plan:[], log:null, db:null, jaar:null, afgeleid:null, metaUnsub:null, prest:null, ctl:{cel:{}, ok:{}, soorten:{}}, sigVan:{} };
/* ---- beslissingen uit ‘Te controleren’: bewaard in de webapp (gedeeld tussen de toegelaten trainers) ---- */
const CTL0 = () => ({cel:{}, ok:{}, soorten:{}});
async function laadControle(){
  S.ctl = CTL0();
  try { const x = await gs("getControle", S.jaar); if (x) S.ctl = {...CTL0(), ...x}; } catch(e){}
}

const GS_LIMIET = { getPlanning: 120000, getLogboek: 90000, getTesten: 60000, getBibliotheek: 60000 }, GS_STANDAARD = 40000, GS_POGINGEN = 3;
function gsEenmaal(fn, args, ok, nok){
  let klaar = false;
  const t = setTimeout(() => { if (!klaar){ klaar = true; nok({code:"timeout", message:"geen antwoord van de server na " + Math.round((GS_LIMIET[fn] || GS_STANDAARD)/1000) + " s"}); } }, GS_LIMIET[fn] || GS_STANDAARD);
  KKYKC.gs(fn, ...args).then(r => { if (!klaar){ klaar = true; clearTimeout(t); ok(r); } },
    e => { if (!klaar){ klaar = true; clearTimeout(t); appFoutAanmelden(e && e.code, e && e.message); nok({code:"server", message:(e && e.message) || String(e)}); } });   /* KKYKC-app: API */
}
const gs = (fn, ...args) => new Promise((ok, nok) => {
  if (!KKYKC.aangemeld()){ appFoutAanmelden("verlopen", "Je aanmelding is verlopen. Meld je opnieuw aan."); return nok({code:"verlopen", message:"Meld je opnieuw aan."}); }   /* KKYKC-app */
  const lees = /^get/.test(fn);
  const poging = n => gsEenmaal(fn, args, r => { if (!lees) naSchrijf(); ok(r); }, e => {   // v8: na een geslaagde wijziging de browsercache bijwerken
    if (lees && e.code === "timeout" && n < GS_POGINGEN){ const st = $("#status"); if (st) st.textContent = "Server antwoordt traag, opnieuw proberen (" + (n+1) + "/" + GS_POGINGEN + ")…"; poging(n + 1); }
    else nok(e);

});

/* ============================== 4. logboek parsen ============================== */
const RE_DAG = /^(\d{1,2})\s*(VM|NM)?\s*(\d*)$/i;
const RE_MAAND = new RegExp("^("+MAANDEN.join("|")+")\\b\\s*'?(\\d{2,4})?","i");
const LABEL_RIJ = /^(gevoel|soort|afstand|tijd|duur|rpe|opmerking)/i;
const schoon = c => c.replace(/[\u200B\u00A0]/g, " ").replace(/ /g," ").trim();
function naarRaster(tekst){
  // htmlview: elke rij = regel met rijnummer, daarna een regel die met een tab begint
  if (/(^|\n)\d+\n\t/.test(tekst)){
    const d = ("\n"+tekst).split(/\n(\d+)\n\t/), rijen = [];
    for (let i=2;i<d.length;i+=2) rijen.push(d[i].replace(/\n/g,"").split("\t").map(schoon));
    // cellen onder een samengevoegde maandcel missen kolom A
    rijen.forEach(r => { if (LABEL_RIJ.test(r[0]||"") && !RE_MAAND.test(r[0]||"")) r.unshift(""); });
    // scheidingskolom na de vastgezette kolommen A:B weghalen
    const kop = rijen.find(r => r.filter(v=>RE_DAG.test(v)).length >= 28);
    if (kop){ const i1 = kop.findIndex(v=>RE_DAG.test(v)); if (i1 === 3 && kop[2] === "") rijen.forEach(r => r.splice(2,1)); }
    return rijen;
  }
  const rijen = tekst.split("\n").map(l => l.split("\t").map(schoon));
  const max = Math.max(...rijen.map(r=>r.length));
  // de eerste regel verliest bij het uitlezen zijn lege beginsellen: links aanvullen
  if (rijen.length && rijen[0].length < max && RE_DAG.test(rijen[0][0]||"")) while (rijen[0].length < max) rijen[0].unshift("");
  return rijen;
}
function parseTijd(s){
  const t = String(s||"").trim().toLowerCase();
  if (!t || t==="/" || t==="-") return [null,null];
  let m;
  if ((m = /^(\d+):(\d{1,2}):(\d{1,2})$/.exec(t))){ const h=+m[1]; if (h>6) return [null,`onduidelijke tijd '${s}' (u:mm:ss met ${h} uur – mogelijk min:sec bedoeld)`]; return [h*60 + +m[2] + m[3]/60, null]; }
  if ((m = /^(\d+):(\d{1,2})$/.exec(t))){ if (+m[1]>6) return [null,`onduidelijke tijd '${s}' (u:mm of min:sec?)`]; return [+m[1]*60 + +m[2], null]; }
  if ((m = /^(?:(\d+)\s*(?:u|uur|h)\s*)?(?:(\d+)\s*(?:min|m|minuten|')?)?\s*(?:(\d+)\s*(?:s|sec|seconden|"))?$/.exec(t)) && (m[1]||m[2])){
    if (!m[1] && /^\d+$/.test(t) && +m[2] <= 5) return [null,`onduidelijke tijd '${s}' (uren of minuten?)`];
    return [(+m[1]||0)*60 + (+m[2]||0) + (+m[3]||0)/60, null];
  }
  if ((m = /^(\d+)[.,](\d+)\s*(u|uur|h)$/.exec(t))) return [Number(m[1]+"."+m[2])*60, null];
  return [null, `tijd niet leesbaar: '${s}'`];
}
function categorie(soort){
  const s = soort.trim().toLowerCase(), map = S.meta.soort_naar_categorie;
  if (S.ctl?.soorten?.[s]) return S.ctl.soorten[s];
  for (const [c,w] of Object.entries(map)) if (w.includes(s)) return c;
  for (const [c,w] of Object.entries(map)) for (const x of [...w].sort((a,b)=>b.length-a.length)) if (x.length>2 && s.includes(x)) return c;
  return "onbekend";
}
/* ---- TSS-schaal zoals TrainingPeaks: 100 TSS = 1 uur op drempel. Alles wordt via één tabel RPE → TSS/uur omgerekend,
   zodat geplande belasting (zones) en ervaren belasting (RPE × duur) op dezelfde schaal staan. Overschrijfbaar via meta.tss (Code.gs > tss). */
const TSS_STD = {
  rpe_per_uur: {"0":0,"1":20,"2":30,"3":40,"4":50,"5":60,"6":70,"7":80,"8":100,"9":120,"10":140},
  zone_rpe: {T0:1, T1:2.5, T2:5, T3:6, T4:7.5, TMAX:9},
  land_rpe: {"Loop rustig":3, "Loop tempo":6, "Fietsen":2.5, "Core-stability":3, "Kracht zaal":5, "Overig":3},
  soort_rpe: {kayak:3, kajak:3, lopen:3.5, loop:3.5, fietsen:2.5, fiets:2.5, hometrainer:2.5, kracht:5, chup:5, core:3, houding:2, ergo:4, zwemmen:3.5, wandelen:1, rolschaatsen:2.5, _standaard:3},
  rem_rpe: 1.0,                               // extra RPE op de zones hieronder als de inhoud 'met rem' bevat (startwaarde, kalibreren via ΔRPE)
  rem_zones: ["T1","T2","T3","T4","TMAX"],    // T0 (in-/uitvaren, rust tussen sets) niet
  delta_rpe: 1.5
};
const T = () => ({...TSS_STD, ...(S.meta?.tss||{})});
function tssUur(rpe){ const t = T().rpe_per_uur, r = Math.max(0, Math.min(10, rpe)), a = Math.floor(r), b = Math.min(10, a+1); return t[a] + (t[b]-t[a])*(r-a); }
function rpeVanTssUur(x){ const t = T().rpe_per_uur; for (let r=0;r<10;r++) if (x <= t[r+1]) return r + (x-t[r])/((t[r+1]-t[r])||1); return 10; }
/* kolom KA (extra uitleg) staat in het schema meestal al achteraan in de inhoud (na ' | '): enkel tonen als ze er nog niet in zit */
const normTxt = t => String(t||"").toLowerCase().replace(/\s+/g," ").trim();
function extraTekst(p){ const x = normTxt(p.ext); return x && !normTxt(p.inh).includes(x) ? p.ext : ""; }
function metRem(p){ return /\bmet\s+rem\b/i.test((p.inh||"") + " " + (p.ext||"")); }
function planTss(p){
  const t = T(), rem = metRem(p) ? (t.rem_rpe||0) : 0; let tss = 0;
  (S.meta.zones||[]).forEach((z,i) => {
    const r = (t.zone_rpe[z] ?? 3) + ((t.rem_zones||[]).includes(z) ? rem : 0);
    tss += (p.z?.[i]||0)/60 * tssUur(r);
  });
  if (p.lm) tss += p.lm/60 * tssUur(t.land_rpe[p.lt] ?? t.land_rpe.Overig ?? 3);
  return tss;
}
function soortRpe(soort, cat){
  const m = T().soort_rpe, s = (soort||"").toLowerCase();
  for (const k of Object.keys(m).sort((a,b)=>b.length-a.length)) if (k[0]!=="_" && s.includes(k)) return [m[k], k];
  return [cat==="water" ? (m.kayak ?? 3) : (m._standaard ?? 3), cat==="water" ? "water (T1)" : "standaard"];
}
function weekVan(n){
  for (const [w,start] of Object.entries(S.meta.weken)){ const s = dnIso(start); if (n>=s && n<=s+6) return Number(w); }
  const d = new Date(n*864e5); const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7)); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil(((t-y0)/864e5+1)/7);
}
function rc(sporter, groep, n, cel, probleem, waarde, actie, gevolg){
  return {sporter, groep, dn:n, week:n!=null?weekVan(n):null, cel, probleem, waarde, actie, gevolg};
}
function colLetter(i){ let s=""; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26);} return s; }

const GEVOEL_WOORD = {"zeer zwak":1, "zwak":2, "normaal":3, "sterk":4, "zeer sterk":5};
function gevoelScore(gev, gv){
  // ‘🙂 Sterk’ (keuzelijst), ‘🙂’, ‘Sterk’ of X/XX/XXX
  const k = /^[\x00-\x7f]*$/.test(gv) ? gv.toUpperCase() : gv;
  if (gev[k] != null) return gev[k];
  for (const [e,v] of Object.entries(gev)) if (!/^[\x00-\x7f]*$/.test(e) && gv.startsWith(e)) return v;
  return GEVOEL_WOORD[gv.toLowerCase().replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim()] ?? null;
}

      while ((m = re.exec(s))) {

        if (!/(geen|niet|zonder|nooit)\s+(\S+\s+)?$/.test(voor)) return true;
      }
      return false;
    }
    Object.keys(WOORDEN).forEach(function (k) { if (WOORDEN[k].some(vind)) uit.push(k); });
    /* samenstellingen op -pijn (schouderpijn, rugpijn) = pijn; spier-, keel-, hoofd- en buikpijn niet */
    if (uit.indexOf('pijn') < 0 && /[a-z]pijn/.test(s.replace(/(spier|keel|hoofd|buik)pijn/g, ''))) uit.push('pijn');

  }

  /* g: weergegeven waarden van het blad (rijen x kolommen). Kopregel = eerste rij (van de eerste 4) met >= 28 dagkolommen 1-31
     (ook '12NM', '12VM2'). Maandblokken: kolom A begint met de maandnaam; labels in kolom B (eerste woord telt).
     opties: van/tot ('jjjj-mm-dd', grenzen inbegrepen), enkelNota (enkel kolommen met een opmerking).

    var blokken = [], cur = null;
    for (r = kop + 1; r < g.length; r++) {
      var c0 = String((g[r] || [])[0] || '').trim(), c1 = String((g[r] || [])[1] || '').trim().toLowerCase(), mm = RE_MAAND.exec(c0);
      if (mm) { cur = { maand: MAANDEN.indexOf(mm[1].toLowerCase()) + 1, rijen: {} }; blokken.push(cur); }
      else if (c0) cur = null;
      if (cur) LABS.forEach(function (l) { if (c1.indexOf(l[0]) === 0 && cur.rijen[l[1]] === undefined) cur.rijen[l[1]] = r; });
    }
    var uit = [];
    blokken.forEach(function (b) {
      if (opties.enkelNota && b.rijen.nota === undefined) return;
      Object.keys(dk).forEach(function (cs) {
        c = Number(cs);
        var o = {}, iets = false;
        Object.keys(b.rijen).forEach(function (lab) { o[lab] = cel((g[b.rijen[lab]] || [])[c]); if (o[lab]) iets = true; });
        if (!iets || (opties.enkelNota && !o.nota)) return;
        var d = iso(jaar, b.maand, dk[cs][0]);
        if (!d || (opties.van && d < opties.van) || (opties.tot && d > opties.tot)) return;
        uit.push({ d: d, dd: dk[cs][1], soort: o.soort || '', afstand: o.afstand || '', tijd: o.tijd || '', gevoel: o.gevoel || '', rpe: o.rpe || '', nota: o.nota || '' });

    return uit.sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : (a.dd < b.dd ? -1 : a.dd > b.dd ? 1 : 0); });

function leesLogboek(){
  const D = S.meta.drempels, jaar = S.jaar, invoer = [], controle = [], warn = [], negeerd = [], notities = []; S.sigVan = {};
  const gev = {}; Object.entries(S.meta.gevoel_schaal).forEach(([k,v]) => gev[/^[\x00-\x7f]*$/.test(k)?k.toUpperCase():k] = v);
  for (const [naam, groep] of Object.entries(S.log?.groepVan || S.meta.sporters)){
    const tekst = S.log?.bladen?.[naam];
    const fl = (S.log?.fouten||[]).find(f => f.startsWith(naam+":"));
    if (fl && S.log?.oud?.includes(naam)) warn.push(["hoog", `Blad '${naam}' kon bij de laatste vernieuwing niet ingelezen worden (${fl.slice(naam.length+2)}); de vorige versie wordt gebruikt. Klik opnieuw op ‘Logboek vernieuwen’.`]);
    if (tekst == null){ if (fl) warn.push(["hoog", `Blad '${naam}' kon niet ingelezen worden (${fl.slice(naam.length+2)}): compliance en belasting ontbreken. Klik opnieuw op ‘Logboek vernieuwen’.`]); continue; }
    const g = naarRaster(tekst);
    let kop = -1, dk = {};
    for (let r=0;r<Math.min(4,g.length);r++){
      const k = {}; g[r].forEach((v,c)=>{ const m = RE_DAG.exec(v); if (m && +m[1]>=1 && +m[1]<=31) k[c] = [+m[1], (m[2]||"").toUpperCase()]; });
      if (Object.keys(k).length >= 28){ kop = r; dk = k; break; }
    }
    if (kop<0){ warn.push(["hoog", `Blad '${naam}': geen kopregel met dagen 1–31 (blad bestaat niet of is anders opgebouwd).`]); continue; }
    const cols = Object.keys(dk).map(Number).sort((a,b)=>a-b);
    for (let i=0;i<cols.length-1;i++){ const a=cols[i], b=cols[i+1];
      if (b-a===2 && dk[b][0]-dk[a][0]===2 && !dk[a][1] && !dk[b][1]){ dk[a+1] = [dk[a][0]+1,""]; warn.push(["info", `Blad '${naam}': kop van kolom ${colLetter(a+1)} is leeg; afgeleid als dag ${dk[a][0]+1}.`]); } }
    const extra = Object.values(dk).filter(x=>x[1]); if (extra.length) warn.push(["info", `Blad '${naam}': extra dagkolommen ${extra.map(x=>x[0]+x[1]).join(", ")} (meerdere trainingen op die dag).`]);
    const blokken = []; let cur = null;
    for (let r=kop+1;r<g.length;r++){

      const m = RE_MAAND.exec(c0);

        if (m[2] && (+m[2])%100 !== jaar%100) warn.push(["hoog", `Blad '${naam}': maandlabel '${c0}' hoort niet bij ${jaar}.`]); }
      else if (c0) cur = null;
      if (cur) for (const [sl,lab] of [["gevoel","gevoel"],["soort","soort"],["afstand","afstand"],["tijd","tijd"],["duur","tijd"],["rpe","rpe"],["opmerking","nota"]]) if (c1.startsWith(sl)) cur.rijen[lab] = r;
    }
    for (const b of blokken) for (const [cS,[dag,dd]] of Object.entries(dk)){
      const c = +cS, ruw = {};
      for (const [lab,r] of Object.entries(b.rijen)) ruw[lab] = (g[r][c]||"").trim();
      // opmerking van de sporter: los van de controle-handtekening (een nieuwe opmerking laat beslissingen niet vervallen)

            notities.push({sporter:naam, groep, dn:nn, week:weekVan(nn), dd, cel:`${naam}!${colLetter(c)}${b.rijen.nota+1}`, nota, tags:notaTags(nota)}); }
        continue; }

      const ruwTxt = Object.entries(ruw).filter(([k,v])=>v).map(([k,v])=>k+": "+v).join(" · ");

      else {

        if (dt.getUTCMonth() !== b.maand-1){ controle.push(rc(naam,groep,null,cel,`ongeldige datum (${dag} ${MAANDEN[b.maand-1]})`,ruwTxt,"invoer naar de juiste dag verplaatsen","niet meegeteld")); continue; }
        n = dn(jaar,b.maand,dag);

      if (n > VANDAAG){ if (n > VANDAAG+1) controle.push(rc(naam,groep,n,cel,"datum in de toekomst",ruwTxt,"verkeerde maand of dag?","niet meegeteld")); continue; }
      const e = {sporter:naam, groep, dn:n, week:weekVan(n), dd, soort:ruw.soort||"", afstandRuw:ruw.afstand||"", tijdRuw:ruw.tijd||"", gevoelRuw:ruw.gevoel||"", rpeRuw:ruw.rpe||"", nota, tags:nota?notaTags(nota):[], cel, opm:cor.datum?`datum gecorrigeerd (Sheet: ${dag}/${b.maand})`:"", kmOk:true, cor};

      if (cor.min!=null) e.min = cor.min;
      else { const [mi, prob] = parseTijd(e.tijdRuw); e.min = mi;
        if (prob) controle.push(rc(naam,groep,n,cel,prob,e.tijdRuw,"","tijd genegeerd"));
        else if (e.min!=null && !(e.min>=D.tijd_min && e.min<=D.tijd_max)){ controle.push(Object.assign(rc(naam,groep,n,cel,`ongewone duur (${Math.round(e.min)} min)`,e.tijdRuw,"","tijd genegeerd"),{voorstelMin:e.min})); e.min = null; } }
      if (cor.cat){ e.cat = cor.cat; e.opm = (e.opm?e.opm+"; ":"")+`categorie ${cor.cat} gekozen bij Te controleren`; }
      else if (e.soort){ e.cat = categorie(e.soort); if (e.cat==="onbekend") controle.push(rc(naam,groep,n,cel,`onbekende soort '${e.soort}'`,e.soort,"toevoegen aan soort_naar_categorie in Code.gs","niet gekoppeld")); }
      else if (e.km){ e.cat = S.meta.lege_soort_met_afstand; e.opm = `soort leeg → aangenomen ${e.cat}`; }
      else { e.cat = "onbekend"; controle.push(rc(naam,groep,n,cel,"soort ontbreekt (geen afstand)",ruwTxt,"soort invullen","niet gekoppeld")); }
      if (e.cat==="water" && e.km && e.min && !cor.kmOk){ const v = e.km/(e.min/60);
        if (!(v>=D.snelheid_water_min_kmu && v<=D.snelheid_water_max_kmu)){
          if (!e.soort && !cor.cat){ e.cat="onbekend"; e.opm=""; controle.push(rc(naam,groep,n,cel,`soort leeg en snelheid ${fmt(v)} km/u past niet bij kajak`,`${a} km / ${e.tijdRuw}`,"soort invullen (fietsen? lopen?)","niet gekoppeld")); }
          else { e.kmOk=false; controle.push(rc(naam,groep,n,cel,`onlogische snelheid ${fmt(v)} km/u`,`${a} km / ${e.tijdRuw}`,"","niet in afwijking duur/afstand")); } } }
      const gv = e.gevoelRuw.replace(/️/g,"").trim();
      e.gevoel = gv ? gevoelScore(gev, gv) : null;
      if (gv && e.gevoel==null) controle.push(rc(naam,groep,n,cel,`gevoel onbekend '${gv}'`,gv,"","gevoel genegeerd"));

/* ============================== 5. koppeling plan ↔ uitvoering ============================== */
function koppel(invoer, controle){
  const planG = {}; S.plan.forEach(p => { if (p.dn <= VANDAAG && !p.geschrapt) ((planG[p.groep] ||= {})[p.dn] ||= []).push(p); });
  const invS = {}; invoer.forEach(e => ((invS[e.sporter] ||= {})[e.dn] ||= []).push(e));
  const kop = [], extra = [];
  for (const [s,g] of Object.entries(S.meta.sporters)){
    const actief = new Set(Object.keys(invS[s]||{}).map(n=>weekVan(+n)));
    const gebruikt = new Set(), open = [];
    for (const n of Object.keys(planG[g]||{}).map(Number).sort((a,b)=>a-b)) for (const p of planG[g][n]){
      const w = weekVan(n);
      const r = {sporter:s, groep:g, week:w, dn:n, dag:DAGEN[wd(n)], dd:p.dd, cat:p.cat, type:p.type, inh:p.inh, duur:p.duur, km:p.km, load:p.load, tss:p.tss, rpeExp:p.rpeExp, status:"", e:null, afwDuur:null, afwKm:null, opm:"", cel:p.cel};
      if (!actief.has(w)){ if (n===VANDAAG) continue; r.status = "niet gelogd"; kop.push(r); continue; }
      let kand = (invS[s]?.[n]||[]).filter(e => !gebruikt.has(e) && (e.cat===p.cat || (p.cat==="overig" && e.cat!=="onbekend")));
      if (p.dd && kand.some(e=>e.dd)) kand.sort((a,b)=>(a.dd!==p.dd)-(b.dd!==p.dd));
      if (kand.length){ const e = kand[0]; gebruikt.add(e); e.match = r; r.status = "uitgevoerd"; r.e = e; r.opm = e.opm;
        if (e.kmOk && e.min && p.duur && p.cat!=="overig") r.afwDuur = e.min/p.duur - 1;
        if (p.cat==="water" && e.kmOk && e.km && p.km) r.afwKm = e.km/p.km - 1; }
      else { if (n===VANDAAG) continue; r.status = "gemist"; open.push(r); }
      kop.push(r);
    }
    for (const n of Object.keys(invS[s]||{})) for (const e of invS[s][n]){
      if (gebruikt.has(e)) continue;
      if (e.cat==="onbekend"){ open.filter(r=>r.dn===e.dn && r.status==="gemist").forEach(r=>{ r.status="te controleren"; r.opm=`invoer met onbekende soort op die dag (${e.cel})`; }); e.extra = true; continue; }
      const buur = open.find(r => Math.abs(r.dn-e.dn)===1 && r.status==="gemist" && r.cat===e.cat);
      if (buur){ buur.status="te controleren"; buur.opm=`invoer op ${ddmm(e.dn)} (${e.cel}) – verkeerde datum?`;
        controle.push(Object.assign({voorstelDn:buur.dn}, rc(s,g,e.dn,e.cel,"mogelijk verkeerde datum",[e.soort||e.cat,e.afstandRuw,e.tijdRuw].filter(Boolean).join(" "),`gepland op ${ddmm(buur.dn)} niet ingevuld`,"geplande training niet in compliance"))); e.extra = true; continue; }
      if (kop.some(k=>k.sporter===s && k.dn===e.dn && k.status==="uitgevoerd" && k.cat===e.cat))
        controle.push(rc(s,g,e.dn,e.cel,"dubbele invoer voor één geplande training?",[e.soort,e.afstandRuw,e.tijdRuw].filter(Boolean).join(" "),"","als extra training geteld"));
      e.extra = true; extra.push(e);
    }
  }
  return {kop, extra};
}

/* ============================== 6. belasting en TrainingPeaks-achtige kengetallen ============================== */
function belastingInvoer(e){
  // volgorde zoals TrainingPeaks (beste beschikbare bron eerst): RPE × duur → geplande TSS geschaald naar duur → typische RPE per soort
  let mi = e.min, sch = "";
  if (!mi && e.cat==="water" && e.km){ mi = e.km/(S.meta.snelheid?.T1||10.5)*60; sch = " (duur geschat uit km aan T1-snelheid)"; }
  if (e.rpe!=null && mi) return {l: mi/60*tssUur(e.rpe), bron:"RPE", f:`${fmt(mi,0)} min × ${fmt(tssUur(e.rpe),0)} TSS/u (RPE ${fmt(e.rpe,1)})${sch}`};
  if (e.match){ const p = e.match;
    if (e.min && p.duur>0) return {l: p.tss*e.min/p.duur, bron:"plan", f:`geen RPE: plan ${fmt(p.tss,0)} TSS × ${fmt(e.min,0)}/${fmt(p.duur,0)} min`};
    return {l:p.tss, bron:"plan", f:`geen RPE/tijd: zoals gepland ${fmt(p.tss,0)} TSS`}; }
  if (!mi) return {l:0, bron:"–", f:"geen duur: niet meegeteld"};
  const [r,k] = soortRpe(e.soort, e.cat);
  return {l: mi/60*tssUur(r), bron:"soort", f:`geen RPE: ${fmt(mi,0)} min × ${fmt(tssUur(r),0)} TSS/u (typische RPE ${fmt(r,1)} voor ${k})${sch}`};
}
function pmc(loads, start, eind){
  // CTL = 42-daags exp. gemiddelde, ATL = 7-daags, TSB = CTL − ATL van gisteren (zoals TrainingPeaks)
  let ctl=0, atl=0; const out = [];
  for (let n=start;n<=eind;n++){ const tsb = ctl-atl; const L = loads[n]||0; ctl += (L-ctl)/42; atl += (L-atl)/7; out.push({dn:n, L, ctl, atl, tsb}); }
  return out;
}
function tpKleur(r){
  if (r.status==="gemist") return ["c-rood","gemist"];
  if (r.status==="niet gelogd") return ["c-nl","niet gelogd"];
  if (r.status==="te controleren") return ["c-oranje","te controleren"];
  if (r.status!=="uitgevoerd") return ["c-gepland","gepland"];
  const e = r.e; let q = null, basis = "";
  if (e.min && r.duur>0){ q = e.min/r.duur; basis="duur"; } else if (e.km && r.km){ q = e.km/r.km; basis="afstand"; }
  if (q==null) return ["c-groen","uitgevoerd (geen duur/afstand)"];
  const t = `${basis} ${pct(q)} van plan`;
  if (q>=0.8 && q<=1.2) return ["c-groen",t];
  if (q>=0.5 && q<=1.5) return ["c-geel",t];
  return ["c-oranje",t];
}

/* Leden (tabblad Leden van Trainingsdata <jaar>, sinds 09/11/2026): S.leden = alle leden A/B (noemer van het % invullers);
   S.meta.sporters = enkel wie al iets invulde (tabellen, analyses, gemiddelden). */
function pasLedenToe(invoer, controle, notities){
  if (!S.log?.groepVan) return;
  S.leden = Object.fromEntries(Object.entries(S.log.leden||{}).filter(([,x])=>["A","B"].includes(x.groep)).map(([n,x])=>[n,x.groep]));
  const pr = S.meta.prestatie || {};
  S.meta.prestatie = {...pr, namen:{...(pr.namen||{}), ...(S.log.namen||{})}, extra_leden:{...(pr.extra_leden||{}), ...S.leden}};
  const actief = new Set([...invoer, ...controle, ...notities].map(x=>x.sporter));
  S.meta.sporters = Object.fromEntries(Object.entries(S.log.groepVan).filter(([n])=>actief.has(n)));
}
function invullers(g){
  const leden = Object.entries(S.leden||{}).filter(([,gg])=>gg===g).map(([n])=>n);
  if (!leden.length) return null;
  const vul = leden.filter(n=>S.meta.sporters[n]), niet = leden.filter(n=>!S.meta.sporters[n]).sort((a,b)=>a.localeCompare(b));
  const extra = Object.entries(S.meta.sporters).filter(([n,gg])=>gg===g && !leden.includes(n)).map(([n])=>n);
  return {g, n:leden.length, vul:vul.length, pct:vul.length/leden.length, niet, extra};

function herbereken(){
  if (!S.meta) return;

  pasLedenToe(invoer, controle, notities);
  const {kop, extra} = koppel(invoer, controle);
  const okLijst = [], open = controle.filter(c => { const o = S.ctl.ok[ctlKey(c)]; if (o){ okLijst.push({...c, beslissing:o}); return false; } return true; });
  controle.splice(0, controle.length, ...open);
  invoer.forEach(e => { const b = belastingInvoer(e); e.load = b.l; e.loadF = b.f; e.tssBron = b.bron;
    e.rpeExp = e.match?.rpeExp ?? null; e.dRpe = (e.rpe!=null && e.rpeExp!=null) ? e.rpe - e.rpeExp : null; });
  const D = S.meta.drempels;
  const hw = weekVan(VANDAAG);
  const jaarStart = Math.min(...S.plan.map(p=>p.dn), dn(S.jaar,1,1));
  const sp = {};
  for (const [s,g] of Object.entries(S.meta.sporters)){
    const inv = invoer.filter(e=>e.sporter===s), kp = kop.filter(k=>k.sporter===s);
    const loads = {}, plLoads = {};
    inv.forEach(e => loads[e.dn] = (loads[e.dn]||0) + e.load);
    S.plan.filter(p=>p.groep===g).forEach(p => plLoads[p.dn] = (plLoads[p.dn]||0) + p.tss);
    const reeks = pmc(loads, jaarStart, VANDAAG), plReeks = pmc(plLoads, jaarStart, VANDAAG+13);
    const laatst = reeks[reeks.length-1] || {ctl:0,atl:0,tsb:0}, gist = reeks[reeks.length-2] || {ctl:0,atl:0};
    const plOk = p => !p.geschrapt && p.dn<VANDAAG || (p.dn===VANDAAG && kp.some(k=>k.dn===VANDAAG && k.cel===p.cel));
    const wk7 = reeks[reeks.length-8];
    const weken = {};
    for (const k of kp){ const w = weken[k.week] ||= {week:k.week, gepland:0, uitgevoerd:0, gemist:0, nl:0, tc:0};
      w.gepland++; if (k.status==="uitgevoerd") w.uitgevoerd++; else if (k.status==="gemist") w.gemist++; else if (k.status==="niet gelogd") w.nl++; else w.tc++; }
    for (const w of Object.values(weken)){
      w.beoordeeld = w.uitgevoerd + w.gemist; w.compl = w.beoordeeld ? w.uitgevoerd/w.beoordeeld : null; w.gelogd = w.nl===0;
      const pw = S.plan.filter(p=>p.groep===g && weekVan(p.dn)===w.week && plOk(p));
      w.plMin = sum(pw.map(p=>p.duur)); w.plKm = sum(pw.map(p=>p.km)); w.plLoad = sum(pw.map(p=>p.tss));
      const iw = inv.filter(e=>e.week===w.week);
      w.uMin = sum(iw.map(e=>e.min)); w.uKm = sum(iw.filter(e=>e.cat==="water").map(e=>e.km)); w.uLoad = sum(iw.map(e=>e.load));
      w.gevoel = avg(iw.map(e=>e.gevoel)); w.rpe = avg(iw.map(e=>e.rpe)); w.srpe = sum(iw.map(e=>e.srpe)) || null;
      w.dRpe = avg(iw.map(e=>e.dRpe)); w.nRpe = iw.filter(e=>e.rpe!=null).length; w.nInv = iw.length;
      const ik = iw.filter(e=>e.dRpe!=null); w.rpeExp = avg(ik.map(e=>e.rpeExp)); w.rpeK = avg(ik.map(e=>e.rpe));
      w.extra = extra.filter(e=>e.sporter===s && e.week===w.week).length;
      const km = kp.filter(k=>k.week===w.week && k.afwDuur!=null); w.afwDuur = sum(km.map(k=>k.duur)) ? sum(km.map(k=>k.e.min))/sum(km.map(k=>k.duur))-1 : null;
      const kk = kp.filter(k=>k.week===w.week && k.afwKm!=null); w.afwKm = sum(kk.map(k=>k.km)) ? sum(kk.map(k=>k.e.km))/sum(kk.map(k=>k.km))-1 : null;
    }
    const W = Object.values(weken).sort((a,b)=>a.week-b.week);
    for (const w of W){ const vor = [0,1,2,3].map(i=>weken[w.week-i]?.uLoad); w.acwr = w.uLoad && vor.every(v=>v) ? w.uLoad/(sum(vor)/4) : null; }
    const l4 = W.filter(w=>w.week>=hw-4 && w.week<hw), u4 = sum(l4.map(w=>w.uitgevoerd)), b4 = sum(l4.map(w=>w.beoordeeld));
    const l1 = W.filter(w=>w.week===hw-1);
    const tot = k => sum(W.map(w=>w[k]));
    const i7 = inv.filter(e=>e.dn>=VANDAAG-7 && e.dn<VANDAAG);   // 7 afgewerkte dagen (vergeleken met plLoad7)
    // trainingsfrequentie t.o.v. de eigen gewoonte (sinds 10/11/2026): enkel weken met planning voor de groep, vanaf de eerste invoer
    const FQ = freqDrempels(), wPlan = new Set(S.plan.filter(p=>p.groep===g).map(p=>weekVan(p.dn)));
    const perW = {}; inv.forEach(e => perW[e.week] = (perW[e.week]||0) + 1);
    const w0 = inv.length ? Math.min(...inv.map(e=>e.week)) : hw;
    const wkn = (van, tot) => { const r = []; for (let w=Math.max(van,w0); w<=tot; w++) if (wPlan.has(w)) r.push(w); return r; };
    const recW = wkn(hw-FQ.recent, hw-1), basW = wkn(hw-FQ.recent-FQ.basis, hw-FQ.recent-1);
    const freq = {recW, basW, recent: recW.length ? sum(recW.map(w=>perW[w]||0))/recW.length : null, basis: basW.length ? sum(basW.map(w=>perW[w]||0))/basW.length : null,
      acwr: Math.max(0, ...recW.map(w=>weken[w]?.acwr||0))};
    sp[s] = {s, g, inv, kp, W, weken, reeks, plReeks, ctl:laatst.ctl, atl:laatst.atl, tsb:laatst.tsb, ctlG:gist.ctl, atlG:gist.atl, plOk, ramp: wk7 ? laatst.ctl-wk7.ctl : null,
      compl: tot("beoordeeld") ? tot("uitgevoerd")/tot("beoordeeld") : null, uitg:tot("uitgevoerd"), beo:tot("beoordeeld"),
      compl4: b4 ? u4/b4 : null, u4, b4, compl1: l1[0]?.compl ?? null, l1:l1[0],
      gemist:tot("gemist"), nl:tot("nl"), extra:extra.filter(e=>e.sporter===s).length,
      wekenGelogd: W.filter(w=>w.gelogd).length, wekenPlan: W.length,
      laatste: inv.length ? Math.max(...inv.map(e=>e.dn)) : null,
      min7: sum(i7.map(e=>e.min)), km7: sum(i7.filter(e=>e.cat==="water").map(e=>e.km)), load7: sum(i7.map(e=>e.load)),
      plLoad7: sum(S.plan.filter(p=>p.groep===g && p.dn>=VANDAAG-7 && p.dn<VANDAAG).map(p=>p.tss)),
      gevoel7: avg(i7.map(e=>e.gevoel)), rpe7: avg(i7.map(e=>e.rpe)),
      dRpe14: avg(inv.filter(e=>e.dn>=VANDAAG-14).map(e=>e.dRpe)), nDRpe14: inv.filter(e=>e.dn>=VANDAAG-14 && e.dRpe!=null).length,
      nInv14: inv.filter(e=>e.dn>=VANDAAG-14).length, nRpe14: inv.filter(e=>e.dn>=VANDAAG-14 && e.rpe!=null).length,
      gevoelVoor: avg(inv.filter(e=>e.dn>=VANDAAG-35 && e.dn<VANDAAG-7).map(e=>e.gevoel)), freq,
      controle: controle.filter(c=>c.sporter===s).length};
  }
  // groep per week
  const gw = {};
  for (const x of Object.values(sp)) for (const w of x.W){ const k = x.g+"-"+w.week; const r = gw[k] ||= {g:x.g, week:w.week, sp:0, gelogd:0, u:0, b:0};
    r.sp++; r.gelogd += w.gelogd?1:0; r.u += w.uitgevoerd; r.b += w.beoordeeld; }
  Object.values(gw).forEach(r => { r.compl = r.b ? r.u/r.b : null; r.dekking = r.sp ? r.gelogd/r.sp : null; });
  for (const x of Object.values(sp)) x.tper = testPeriodes(x);
  S.afgeleid = {invoer, controle, warn, kop, extra, sp, gw, hw, okLijst, negeerd, notities, prio: prioriteiten(sp, invoer, controle, warn, hw, notities)};
  statusRegel(); tabs(); route();
}

/* Drempels trainingsfrequentie. Standaardwaarden hier; overschrijven kan in Code.gs > CFG.drempels.frequentie (dan nieuwe implementatieversie). */
function freqDrempels(){
  return {basis:6, recent:2, min_basis_weken:4, daling_hoog:0.6, daling_middel:0.4, min_verschil:1, stijging:0.5, stijging_min:1.5, ...(S.meta?.drempels?.frequentie||{})};
}
function prioriteiten(sp, invoer, controle, warn, hw, notities){
  const D = S.meta.drempels, it = [], vw = hw-1;
  (S.meta.waarschuwingen||[]).concat(warn).filter(w=>w[0]==="hoog").forEach(w => it.push(["hoog","Schema/logboek",w[1],"Controleer vóór je de cijfers gebruikt."]));
  if (!S.log){ it.push(["hoog","Logboek","Het logboek is nog niet ingelezen.","Klik op ‘Logboek vernieuwen’."]); return it; }
  const nooit = Object.values(sp).filter(x=>!x.inv.length && S.log?.bladen?.[x.s]!=null).map(x=>x.s);
  for (const x of Object.values(sp)){
    if (!x.inv.length) continue;
    // op dagen t.e.m. gisteren (niet op afgewerkte kalenderweken): invoer uit de lopende week telt mee
    const dz = 7*D.weken_zonder_logboek, plRecent = S.plan.some(p=>p.groep===x.g && p.dn>=VANDAAG-dz && p.dn<VANDAAG);
    if (plRecent && x.laatste!=null && x.laatste < VANDAAG-dz) it.push(["hoog",x.s,`Geen logboek in de laatste ${dz} dagen (laatste invoer ${ddmm(x.laatste)}).`,"Vraag of hij/zij nog traint en het logboek bijhoudt."]);
    // sinds 10/11/2026: geen melding meer voor lage compliance (sporters kiezen zelf hun momenten), wel voor een plotse verandering in trainingsfrequentie
    { const f = x.freq, FQ = freqDrempels();
      if (f && f.basW.length >= FQ.min_basis_weken && f.recW.length && f.basis > 0){
        const d = f.recent - f.basis, r = d / f.basis;
        const txt = `${fmt(f.recent,1)} trainingen/week in W${f.recW[0]}${f.recW.length>1?"–W"+f.recW[f.recW.length-1]:""}, tegen gewoonlijk ${fmt(f.basis,1)}/week (W${f.basW[0]}–W${f.basW[f.basW.length-1]})`;
        if (r <= -FQ.daling_hoog && -d >= FQ.min_verschil || (f.basis >= 2 && f.recent === 0))
          it.push(["hoog",x.s,`Traint plots veel minder: ${txt} (${sgn(r)}).`,"Navragen wat er veranderd is (blessure, ziekte, school/werk, motivatie)."]);
        else if (r <= -FQ.daling_middel && -d >= FQ.min_verschil)
          it.push(["middel",x.s,`Traint minder dan gewoonlijk: ${txt} (${sgn(r)}).`,"Even polsen of alles in orde is."]);
        else if (r >= FQ.stijging && d >= FQ.stijging_min){
          const piek = f.acwr > D.acwr_hoog;
          it.push([piek?"hoog":"middel",x.s,`Traint plots veel meer: ${txt} (${sgn(r)})${piek?`, belasting ACWR ${fmt(f.acwr,2)}`:""}.`,
            piek ? "Blessurerisico: opbouw temperen, voldoende rust inplannen." : "Positief, maar opbouw opvolgen (belasting, gevoel, pijn)."]); }
      } }
    if (x.inv.length && x.tsb < -30) it.push(["hoog",x.s,`Vorm (TSB) ${fmt(x.tsb,0)}: veel vermoeidheid t.o.v. fitheid.`,"Rust of lichtere training inplannen."]);
    if (x.ramp != null && x.ramp > 8) it.push(["middel",x.s,`Fitheid (CTL) +${fmt(x.ramp,1)} in 7 dagen: snelle opbouw.`,"Opbouw temperen om blessures te vermijden."]);
    const slecht = x.inv.filter(e=>e.dn>=VANDAAG-14 && e.gevoel!=null && e.gevoel<=D.gevoel_laag);
    if (slecht.length) it.push([slecht.length>=2?"hoog":"middel",x.s,`Slecht gevoel ${slecht.length}× in 14 dagen (${slecht.map(e=>ddmm(e.dn)+" "+e.gevoelRuw).join(", ")}).`,"Check vermoeidheid/spierpijn; eventueel belasting verlagen."]);

    const dl = T().delta_rpe;
    if (x.nDRpe14 >= 3 && x.dRpe14 >= dl){
      const laag = x.gevoel7!=null && x.gevoel7 <= 2.5;
      it.push([laag?"hoog":"middel",x.s,`Trainingen voelen zwaarder dan gepland: RPE gemiddeld ${sgnN(x.dRpe14)} t.o.v. de verwachte RPE (${x.nDRpe14} trainingen, 14 d)${laag?`, gevoel ${fmt(x.gevoel7)}`:""}.`,"Signaal van vermoeidheid of te hoge intensiteit: zones/tempo bespreken, eventueel lichter plannen."]); }
    if (x.nDRpe14 >= 3 && x.dRpe14 <= -dl) it.push(["laag",x.s,`Trainingen voelen lichter dan gepland: RPE ${sgnN(x.dRpe14)} t.o.v. verwacht (${x.nDRpe14} trainingen, 14 d).`,"Intensiteit gehaald? Of zones aan te scherpen."]);
    if (x.gevoel7!=null && x.gevoelVoor!=null && x.gevoelVoor - x.gevoel7 >= 1) it.push(["middel",x.s,`Gevoel daalt: ${fmt(x.gevoel7)} deze week tegen ${fmt(x.gevoelVoor)} de 4 weken ervoor.`,"Vraag naar slaap, school/werk, spierpijn."]);
    if (x.nInv14 >= 3 && x.nRpe14/x.nInv14 < 0.5) it.push(["laag",x.s,`RPE ontbreekt bij ${x.nInv14-x.nRpe14}/${x.nInv14} trainingen (14 d).`,"Vraag om RPE in te vullen; anders wordt de geplande belasting gebruikt."]);
    for (const [k,lab] of [["afwDuur","duur"],["afwKm","afstand"]]) if (x.l1?.[k]!=null && Math.abs(x.l1[k])>D.afwijking_duur_afstand)
      it.push(["middel",x.s,`W${vw}: ${lab} ${sgn(x.l1[k])} t.o.v. plan (afgewerkte trainingen).`,"Te kort/te lang? Bespreek of het schema haalbaar is."]);
  }
  // opmerkingen van de sporters (laatste 14 dagen, ook opmerkingen zonder training)
  for (const x of Object.values(sp)){
    const recent = x.inv.filter(e=>e.nota).concat((notities||[]).filter(t=>t.sporter===x.s)).filter(e=>e.dn>=VANDAAG-14).sort((a,b)=>a.dn-b.dn);
    if (!recent.length) continue;
    const met = k => recent.filter(e=>e.tags.includes(k));
    const lijst = a => a.map(e=>`${ddmm(e.dn)} ‘${kortTekst(e.nota)}’`).join("; ");
    const pijn = met("pijn"), ziek = met("ziek"), zwaar = met("zwaar"), licht = met("licht");
    if (pijn.length){ const delen = lichaamsdelen(pijn), herh = pijn.length>=2;
      it.push([herh?"hoog":"middel", x.s, `Pijn/blessure gemeld ${pijn.length}× in 14 dagen${delen.length?" ("+delen.join(", ")+")":""}: ${lijst(pijn)}.`,

    if (ziek.length) it.push(["middel", x.s, `Ziek/niet fit gemeld: ${lijst(ziek)}.`, "Na ziekte rustig herstarten (minder volume en intensiteit); met koorts of klachten onder de nek niet trainen."]);
    if (zwaar.length) it.push([zwaar.length>=2?"middel":"laag", x.s, `Training te zwaar of vermoeid gemeld ${zwaar.length}×: ${lijst(zwaar)}.`, "Vergelijk met RPE vs plan; eventueel een lichtere variant voorzien."]);
    if (licht.length>=2) it.push(["laag", x.s, `Training te licht gemeld ${licht.length}×: ${lijst(licht)}.`, "Een zwaardere variant aanbieden (extra reeks, hoger tempo)."]);
  }

  const oc = controle.filter(c=>c.dn!=null && c.dn>=VANDAAG-14);
  if (oc.length) it.push(["laag",`${new Set(oc.map(c=>c.sporter)).size} sporters`,`${oc.length} invoeren van de laatste 14 dagen staan op ‘Te controleren’.`,"Laat de sporter corrigeren in de Sheet."]);

}

const PERIODES = [["4w","Laatste 4 weken",28],["8w","Laatste 8 weken",56],["12w","Laatste 12 weken",84],["16w","Laatste 16 weken",112],["26w","Laatste 26 weken",182],["jaar","Volledig jaar",0],["eigen","Eigen periode…",0]];
S.per = lsGet("kkykc-periode") || {k:"4w"};
function periode(){
  const jaarVan = dn(S.jaar,1,1), jaarTot = Math.min(dn(S.jaar,12,31), VANDAAG);

  if (p[0]==="jaar"){ van = jaarVan; tot = jaarTot; }
  else if (p[0]==="eigen"){ van = S.per.van ? dnIso(S.per.van) : jaarTot-27; tot = S.per.tot ? dnIso(S.per.tot) : jaarTot; }
  else { tot = VANDAAG; van = tot - p[2] + 1; }
  if (tot < van) [van, tot] = [tot, van];
  const lbl = p[0]==="eigen" ? `${ddmm(van)}/${new Date(van*864e5).getUTCFullYear()} – ${ddmm(tot)}/${new Date(tot*864e5).getUTCFullYear()}` : p[1].toLowerCase();
  return {van, tot, statTot: Math.min(tot, VANDAAG), lbl, kort: `${ddmm(van)}–${ddmm(tot)}`, wVan: weekVan(van), wTot: weekVan(Math.min(tot, VANDAAG))};

    <span class="muted">${P.kort} · W${P.wVan}–W${P.wTot} · geldt voor tabellen en grafieken; ‘Deze week opvolgen’, fitheid en vorm blijven op vandaag</span>`;

// kengetallen van één sporter over [van, tot] (t.e.m. vandaag; plan van vandaag enkel als het al uitgevoerd is)
function perAgg(x, van, tot){
  const t = Math.min(tot, VANDAAG);
  const inv = x.inv.filter(e=>e.dn>=van && e.dn<=t), kp = x.kp.filter(k=>k.dn>=van && k.dn<=t);
  const pl = S.plan.filter(p=>p.groep===x.g && p.dn>=van && p.dn<=t && x.plOk(p));
  const u = kp.filter(k=>k.status==="uitgevoerd").length, gm = kp.filter(k=>k.status==="gemist").length;
  return {inv, kp, n:inv.length, uitg:u, gemist:gm, beo:u+gm, compl:(u+gm)?u/(u+gm):null,
    nl:kp.filter(k=>k.status==="niet gelogd").length, tc:kp.filter(k=>k.status==="te controleren").length, gepland:kp.length,
    extra:inv.filter(e=>e.extra).length,
    water:inv.filter(e=>e.cat==="water").length, land:inv.filter(e=>e.cat==="land").length,
    min:sum(inv.map(e=>e.min)), km:sum(inv.filter(e=>e.cat==="water").map(e=>e.km)), load:sum(inv.map(e=>e.load)),
    plMin:sum(pl.map(p=>p.duur)), plKm:sum(pl.map(p=>p.km)), plLoad:sum(pl.map(p=>p.tss)), plN:pl.length,
    gevoel:avg(inv.map(e=>e.gevoel)), rpe:avg(inv.map(e=>e.rpe)), dRpe:avg(inv.map(e=>e.dRpe)), nDRpe:inv.filter(e=>e.dRpe!=null).length};
}

    ${rijen.map(([l,a])=>r(l,a)).join("")}${r("Totaal "+j, tot, "totaal")}</tbody></table></div>`;

  const ps = {};

}

const TL_STATUS = {ok:"zoals gepland", aangepast:"aangepast", niet_doorgegaan:"niet doorgegaan"};
const TL_REDENEN = {weer:"weer", water:"water", opkomst:"te weinig sporters", ziek_blessure:"ziekte/blessure", materiaal:"materiaal/lokaal", te_zwaar:"te zwaar", te_licht:"te licht", tijd:"tijdgebrek", evenement:"evenement/wedstrijd", keuze:"keuze trainer", andere:"andere"};
async function laadTrainerslog(){

}
/* legt de afwijkingen over het plan: p.o = oorspronkelijke waarden; niet doorgegaan = geschrapt (telt niet mee in compliance en analyses) */
function pasTrainerslogToe(){
  const items = (S.tlog||{}).items || {};
  S.plan.forEach(p => {
    if (p.o){ Object.assign(p, p.o); delete p.o; }
    delete p.geschrapt; p.afw = items[p.cel] || null;
    const it = p.afw; if (!it || it.status === "ok") return;
    p.o = {z:p.z, lm:p.lm, duur:p.duur, km:p.km, doel:p.doel, doel_auto:p.doel_auto, tss:p.tss, rpeExp:p.rpeExp};
    if (it.status === "niet_doorgegaan"){ p.geschrapt = true; p.z = (p.z||[]).map(()=>0); p.lm = 0; p.duur = 0; p.km = null; p.tss = 0; p.rpeExp = null; return; }
    const u = it.uit || {};
    if (u.duur != null && p.duur > 0){ const f = u.duur/p.duur; p.z = (p.z||[]).map(v => v*f); p.lm = (p.lm||0)*f; p.km = u.km != null ? u.km : (p.km ? p.km*f : null); p.duur = u.duur; }
    else if (u.km != null) p.km = u.km;
    if (u.doel){ p.doel = u.doel; p.doel_auto = false; }
    p.tss = planTss(p); p.rpeExp = p.duur>0 && p.cat!=="overig" ? rpeVanTssUur(p.tss/(p.duur/60)) : null;
  });
}

/* ============================== doel per training (chip + uitleg) ============================== */
const DOEL_KLEUR0 = "#eeeeee";
function planPerCel(){
  if (!S._pc || S._pc.n !== S.plan.length) S._pc = {n:S.plan.length, m:new Map(S.plan.map(p=>[p.cel,p]))};

}
function doelKleur(naam){ const k = (S.meta.doelen||{})[naam]?.kleur || DOEL_KLEUR0; return /^#[0-9a-f]{3,8}$/i.test(k) ? k : DOEL_KLEUR0; }
function doelChip(p){
  if (!p || !p.doel) return "";

function doelPopup(cel){

  document.getElementById("doelDlg")?.remove();
  const d = (S.meta.doelen||{})[p.doel] || {}, wi = (S.meta.weekinfo||{})[p.w] || {};

      <div class="muted">${esc(d.vakterm||"")}</div></div><button type="button" class="kd-x" aria-label="Sluiten">×</button></div>
    ${blok("Wat", d.wat)}${blok("Waarom", d.waarom)}${blok("Hoe voelt het", d.voelt)}
    ${p.waarom ? `<div class="doel-blok"><b>Waarom nu</b><div>${esc(p.waarom)}</div></div>` : ""}
    <p class="muted">Week ${p.w}${wi.fase ? " · fase "+esc(wi.fase) : ""}${wi.focus ? " · focus: "+esc(wi.focus) : ""}${p.doel_auto ? " · (automatisch toegekend)" : ""}</p></div>`;
  document.body.appendChild(o);
  const sluit = () => o.remove();
  o.onclick = ev => { if (ev.target === o) sluit(); };
  o.querySelector(".kd-x").onclick = sluit;

document.addEventListener("click", e => { const q = e.target.closest && e.target.closest("[data-doel-cel]"); if (!q) return; e.preventDefault(); e.stopPropagation(); doelPopup(q.dataset.doelCel); }, true);
document.addEventListener("keydown", e => { if (e.key !== "Enter" && e.key !== " ") return; const q = e.target.closest && e.target.closest("[data-doel-cel]"); if (!q) return; e.preventDefault(); e.stopPropagation(); doelPopup(q.dataset.doelCel); }, true);

};
const EV_FASEN = [
  {fase:"Overgang", max_t3:5, doelen:["Herstel","Aerobe basis"]},
  {fase:"Basis 1", max_t3:10, doelen:["Aerobe basis","Kracht","Core & stabiliteit","Starts & techniek"]},
  {fase:"Basis 2", max_t3:20, doelen:["Aerobe basis","Tempo","VO2max","Krachtuithouding (rem)","Kracht"]},

  {fase:"P-n", max_t3:30, doelen:["Aerobe basis","VO2max","Snelheid","Racetempo","Kracht"]},

function faseSleutel(f){ f = String(f||"").trim(); return /^p-\d+$/i.test(f) ? "P-n" : /^piek/i.test(f) ? "Piek" : f; }
function faseInfo(w){
  const f = faseSleutel(((S.meta.weekinfo||{})[w]||{}).fase), lijst = (S.meta.fasen && S.meta.fasen.length) ? S.meta.fasen : EV_FASEN;
  return lijst.find(x => x.fase.toLowerCase() === f.toLowerCase()) || null;
}
const EV_ZWAAR = ["VO2max","Over-under","Racetempo","Snelheid","Krachtuithouding (rem)","Tempo"];
function evRegel(id){
  const m = (S.meta.evaluatieregels||{})[id] || {}, s = EV_STD[id];
  return {aan: m.aan !== false, ernst: m.ernst || s.ernst, waarde: m.waarde != null && m.waarde !== "" ? m.waarde : (s.waarde ?? null), oms: m.omschrijving || s.oms};
}
const isoWeken = jaar => { const d = new Date(Date.UTC(jaar,11,28)); const t = new Date(d); t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7)); return Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/864e5+1)/7); };
function tijdSec(m1, m2){ return (m1 ? Number(m1)*60 : 0) + (m2 ? Number(m2) : 0); }
function setsVan(inh){
  const uit = [];
  String(inh||"").replace(/(\d+)\s*[x×]\s*\(([^)]*)\)/gi, (all, n, bin) => {
    const delen = bin.split("+").map(s => { const m = /(?:(\d+)\s*')?\s*(?:(\d+)\s*")?\s*(T[0-4]|TMAX)\b/i.exec(s); return m && (m[1]||m[2]) ? {sec:tijdSec(m[1],m[2]), zone:m[3].toUpperCase()} : null; });
    uit.push({n:Number(n), delen, tekst:all});
    return all;
  });
  return uit;
}
function t4Blokken(inh){
  const uit = [], re = /(?:(\d+)\s*'\s*)?(?:(\d+)\s*"\s*)?(T[0-4]|TMAX)\b/gi; let m;
  while ((m = re.exec(String(inh||"")))) if ((m[1]||m[2]) && m[3].toUpperCase()==="T4") uit.push({sec:tijdSec(m[1],m[2]), tekst:m[0].trim()});
  return uit;
}
let WEBAPP_URL = "";   /* 15/11/2026: voor links naar de planner (sessies die enkel in de planner bestaan, cel P!<id>) */
function plannerLink(cel){
  const id = String(cel||"").slice(2), p = (S.plan||[]).find(x => x.cel === cel) || Object.entries(S.meta.cgroep||{}).map(([w,l]) => ({w:Number(w), groep:"C", l})).flatMap(o => (o.l||[]).filter(c => c.cel === cel).map(() => ({w:o.w, groep:"C"})))[0];
  if (!WEBAPP_URL || !/^[A-Za-z0-9_-]+$/.test(id)) return null;
  return WEBAPP_URL + "?pagina=planner&jaar=" + encodeURIComponent(S.meta.jaar || "") + (p ? "&week=" + p.w + "&groep=" + p.groep : "") + "&sessie=" + id;
}
const linkTekst = l => /pagina=planner/.test(l||"") ? "planner" : "schema";
function schemaLink(cel){
  if (/^P!/.test(cel||"")) return plannerLink(cel);
  const m = /^(.*)!([A-Z]+\d+(?::[A-Z]+\d+)?)$/.exec(cel||""); if (!m || !S.meta.schema_id) return null;
  const b = (S.meta.bladen||[]).find(x => x.titel === m[1]);
  return b ? `https:\/\/docs.google.com/spreadsheets/d/${S.meta.schema_id}/edit#gid=${b.gid}&range=${m[2]}` : null;
}
function evalueer(){
  const res = [], M = S.meta, jaar = S.jaar;
  const F = (id, o) => { const r = evRegel(id); if (!r.aan) return; res.push({id, ernst:o.ernst||r.ernst, groep:o.groep||"", dn:o.dn ?? null, dd:o.dd||"", week:o.week ?? (o.dn!=null ? weekVan(o.dn) : null), tekst:o.tekst, voorstel:o.voorstel||"", cel:o.cel||""}); };
  const act = id => evRegel(id).aan;
  const PLAN = S.plan.map(p => p.o ? {...p, ...p.o, geschrapt:false} : p);   // de evaluatie beoordeelt het schema, niet wat trainers aanpasten
  const alle = PLAN.map(p => ({...p, groep:p.groep}));
  Object.entries(M.cgroep||{}).forEach(([w, lijst]) => (lijst||[]).forEach(c => alle.push({groep:"C", w:Number(w), dn:dnIso(c.d), dd:c.dd, inh:c.inh, doel:c.doel, cel:c.cel, z:[0,0,0,0,0,0], duur:0, tss:0})));
  const ABC = ["A","B","C"], AB = ["A","B"];
  const vanGroep = g => alle.filter(p => p.groep === g);
  const norm = dd => /nm/i.test(dd||"") ? "NM" : /vm/i.test(dd||"") ? "VM" : (dd||"").toUpperCase();

  /* S1 weekbladen */
  if (act("S1")){
    const n = isoWeken(jaar), weken = M.weken || {};
    const j4 = dn(jaar,1,4), maandag1 = j4 - wd(j4);   // week 1 = week met 4 januari
    for (let w = 1; w <= n; w++){
      if (!weken[w]) F("S1", {week:w, tekst:`Weekblad W${w} ontbreekt (het jaar ${jaar} telt ${n} ISO-weken).`, voorstel:`Maak blad W${w} aan (${DAGK[0]} ${ddmm(maandag1+7*(w-1))}).`});
      else if (wd(dnIso(weken[w])) !== 0) F("S1", {week:w, dn:dnIso(weken[w]), tekst:`W${w}: C2 begint niet op een maandag (${weken[w]}).`, voorstel:"Corrigeer de datum in C2.", cel:`W${w}!C2`});
      else if (w > 1 && weken[w-1] && dnIso(weken[w]) - dnIso(weken[w-1]) !== 7) F("S1", {week:w, dn:dnIso(weken[w]), tekst:`W${w} sluit niet aan op W${w-1} (${weken[w-1]} → ${weken[w]}).`, voorstel:"Controleer C2 van beide bladen.", cel:`W${w}!C2`});
    }
  }
  /* S2 vreemde bladen */
  if (act("S2")) (M.bladen||[]).forEach(b => { if (/^w/i.test(b.titel) && !/^W\d{1,2}$/.test(b.titel)) F("S2", {tekst:`Blad ‘${b.titel}’ begint met W maar is geen weekblad.`, voorstel:"Hernoem het blad (bv. met een underscore vooraan) of verwijder het.", cel:b.titel+"!A1"}); });
  /* S3 landminuten zonder inhoud */
  if (act("S3")) (M.land_zonder_inhoud||[]).forEach(x => F("S3", {groep:x.groep, dn:dnIso(x.d), dd:x.dd, tekst:`${fmt(x.min,0)} min ${x.type||"land"} zonder inhoud.`, voorstel:"Vul de inhoud in of wis KT/KU.", cel:x.cel}));
  /* S4 tekst zonder minuten */
  if (act("S4")) PLAN.forEach(p => { if (!(p.duur > 0) && p.inh && !(M.geen_training_woorden||["geen training","vrij","rust"]).some(w => p.inh.toLowerCase().includes(w))) F("S4", {groep:p.groep, dn:p.dn, dd:p.dd, tekst:`‘${kortTekst(p.inh,60)}’ heeft geen minuten.`, voorstel:"Vul zoneminuten in of schrijf ‘geen training’.", cel:p.cel}); });
  /* S5 werk en rust in dezelfde zone, Z1 lang T4-blok */
  alle.forEach(p => {
    if (act("S5")) setsVan(p.inh).forEach(s => { const d = s.delen.filter(Boolean); if (d.length >= 2 && d[0].zone === d[1].zone && d[0].zone !== "T0") F("S5", {groep:p.groep, dn:p.dn, dd:p.dd, tekst:`Set ${s.tekst}: werk en rust beide in ${d[0].zone}.`, voorstel:"Rust hoort in T0 of T1: tikfout in de zone?", cel:p.cel}); });
    if (act("Z1") && p.doel !== "Test"){ const g = Number(evRegel("Z1").waarde) || 45; t4Blokken(p.inh).forEach(b => { if (b.sec > g) F("Z1", {groep:p.groep, dn:p.dn, dd:p.dd, tekst:`T4-blok van ${b.tekst} (> ${g} s).`, voorstel:"Korter blok, of doel Racetempo/Test als dit bewust is.", cel:p.cel}); }); }
  });
  /* weken en doelen per groep */
  const wnrs = [...new Set(PLAN.map(p => p.w))].sort((a,b)=>a-b);
  const tssW = {A:{}, B:{}};
  AB.forEach(g => wnrs.forEach(w => { tssW[g][w] = sum(PLAN.filter(p => p.groep===g && p.w===w).map(p => p.tss||0)); }));
  /* Z2 weekfocus */
  if (act("Z2")){
    const x = Number(evRegel("Z2").waarde) || 5;
    wnrs.forEach(w => AB.forEach(g => {
      const foc = ((M.weekinfo||{})[w]?.focus || "").toLowerCase(); if (!foc) return;
      const items = PLAN.filter(p => p.groep===g && p.w===w), doelen = new Set(items.map(p => p.doel));
      const blad = (M.weekinfo||{})[w]?.blad || "W"+w, start = items.length ? Math.min(...items.map(p=>p.dn)) : null;
      const mis = (naam) => F("Z2", {groep:g, dn:start, week:w, tekst:`Weekfocus ‘${foc}’ maar geen training met doel ${naam} voor groep ${g}.`, voorstel:`Plan een ${naam}-training of pas de weekfocus aan.`, cel:blad+"!C2"});

   <div><h3>Logboekdekking per week</h3>${lijnGrafiek(S.meta.groepen.map(g=>[`Groep ${g}`, kl[g]||"var(--muted)", Object.fromEntries(Object.values(A.gw).filter(r=>r.g===g).map(r=>[r.week,r.dekking]))]), weken, true)}
   <div class="f">sporters met ≥ 1 invoer in die week / sporters met planning</div></div></div>`;
  // heatmap
  const hm = weken.slice(-26);
  h += `<h3>Compliance per sporter per week (%)</h3><div class="scroll"><table class="hm"><thead><tr><th>Sporter</th>${hm.map(w=>`<th>W${w}</th>`).join("")}</tr></thead><tbody>
   ${Object.values(A.sp).sort((a,b)=>a.g.localeCompare(b.g)||a.s.localeCompare(b.s)).map(x=>`<tr><td><b>${esc(x.s)}</b> <span class="muted">${x.g}</span></td>${hm.map(w=>{ const r = x.weken[w];
      if (!r) return `<td></td>`; if (!r.gelogd) return `<td title="niet gelogd"><span class="pil p-grijs">·</span></td>`;
      return `<td>${complPil(r.compl, `${r.uitgevoerd}/${r.beoordeeld} uitgevoerd${r.tc?`, ${r.tc} te controleren`:""}`)}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>
   <p class="muted">Groen ≥ 90% · geel 60–89% · rood &lt; 60% · grijs = die week niets ingevuld (telt niet mee) · leeg = geen planning.</p>`;
  $("#app").innerHTML = h;
  document.querySelectorAll("tr.klik").forEach(tr => { const go = () => ga("sporter-"+tr.dataset.s); tr.onclick = go; tr.onkeydown = e => { if (e.key==="Enter") go(); }; });
}

function lijnGrafiek(reeksen, weken, procent){
  if (!weken.length) return `<div class="leeg">Nog geen weken met gegevens.</div>`;
  const W=640, H=210, ml=40, mr=12, mt=10, mb=26, iw=W-ml-mr, ih=H-mt-mb;
  const w0=weken[0], w1=weken[weken.length-1];
  const sx = w => ml + (w1===w0 ? iw/2 : (w-w0)/(w1-w0)*iw), sy = v => mt + ih - v*ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  [0,.25,.5,.75,1].forEach(v => s += `<line class="grid" x1="${ml}" x2="${ml+iw}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${ml-6}" y="${sy(v)+4}" text-anchor="end">${v*100}%</text>`);
  const stap = Math.max(1, Math.ceil(weken.length/10));
  weken.forEach((w,i) => { if (i%stap===0) s += `<text x="${sx(w)}" y="${H-8}" text-anchor="middle">W${w}</text>`; });
  for (const [naam,kleur,data] of reeksen){
    let seg = [], segs = [];
    weken.forEach(w => { if (data[w]==null){ if (seg.length) segs.push(seg); seg=[]; } else seg.push([w,data[w]]); }); if (seg.length) segs.push(seg);
    segs.forEach(sg => s += `<polyline fill="none" stroke="${kleur}" stroke-width="2.2" points="${sg.map(([w,v])=>sx(w)+","+sy(v)).join(" ")}"/>`);
    weken.forEach(w => { if (data[w]!=null) s += `<circle cx="${sx(w)}" cy="${sy(data[w])}" r="3.2" fill="${kleur}"><title>${esc(naam)} W${w}: ${pct(data[w])}</title></circle>`; });
  }
  return `<div class="legende">${reeksen.map(([n,k])=>`<span><i style="background:${k}"></i>${esc(n)}</span>`).join("")}</div>` + s + `</svg>`;
}

function pmcGrafiek(x){
  const PP = periode(), tot = PP.tot >= VANDAAG ? VANDAAG + 13 : PP.tot, van = Math.min(PP.van, tot - 27);
  const R = x.reeks.filter(r=>r.dn>=van), P = x.plReeks.filter(r=>r.dn>=van && r.dn<=tot);
  if (!R.length) return `<div class="leeg">Geen gegevens.</div>`;
  const W=900, ml=44, mr=16, iw=W-ml-mr, H1=210, H2=96, gap=26, mt=12, H=mt+H1+gap+H2+26;
  const maxY = Math.max(10, ...R.map(r=>Math.max(r.ctl,r.atl)), ...P.map(r=>r.ctl)) * 1.1;
  const maxL = Math.max(10, ...R.map(r=>r.L));
  const tMax = Math.max(30, ...R.map(r=>Math.abs(r.tsb)));
  const sx = n => ml + (n-van)/(tot-van)*iw, sy = v => mt + H1 - v/maxY*H1;
  const t0 = mt + H1 + gap, ty = v => t0 + H2/2 - v/tMax*(H2/2);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  [0,.25,.5,.75,1].forEach(f => { const v = maxY*f; s += `<line class="grid" x1="${ml}" x2="${ml+iw}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${ml-6}" y="${sy(v)+4}" text-anchor="end">${Math.round(v)}</text>`; });
  const bw = Math.max(1.5, iw/(tot-van)-1.5);
  R.forEach(r => { if (r.L>0) s += `<rect x="${sx(r.dn)-bw/2}" y="${mt+H1 - r.L/maxL*H1*0.35}" width="${bw}" height="${r.L/maxL*H1*0.35}" fill="var(--beige)"><title>${ddmm(r.dn)}: ${fmt(r.L,0)} TSS</title></rect>`; });
  s += `<polyline fill="none" stroke="var(--ctl)" stroke-width="1.6" stroke-dasharray="5 4" opacity=".75" points="${P.map(r=>sx(r.dn)+","+sy(r.ctl)).join(" ")}"/>`;
  s += `<polyline fill="none" stroke="var(--atl)" stroke-width="1.8" points="${R.map(r=>sx(r.dn)+","+sy(r.atl)).join(" ")}"/>`;
  s += `<polyline fill="none" stroke="var(--ctl)" stroke-width="2.6" points="${R.map(r=>sx(r.dn)+","+sy(r.ctl)).join(" ")}"/>`;
  const l = R[R.length-1]; s += `<circle cx="${sx(l.dn)}" cy="${sy(l.ctl)}" r="4" fill="var(--ctl)"><title>CTL ${fmt(l.ctl,1)}</title></circle>`;
  // vormpaneel met eigen schaal
  s += `<text x="${ml}" y="${t0-8}" style="font-weight:bold">Vorm (TSB)</text>`;
    s += `<rect x="${ml}" y="${ty(-10)}" width="${iw}" height="${Math.max(0,Math.min(ty(-30),t0+H2)-ty(-10))}" fill="var(--warn-bg)" opacity=".6"/>`;
  if (ty(-30) < t0+H2) s += `<rect x="${ml}" y="${ty(-30)}" width="${iw}" height="${t0+H2-ty(-30)}" fill="var(--bad-bg)" opacity=".6"/>`;
  [tMax,0,-tMax].forEach(v => s += `<line class="grid" x1="${ml}" x2="${ml+iw}" y1="${ty(v)}" y2="${ty(v)}"/><text x="${ml-6}" y="${ty(v)+4}" text-anchor="end">${Math.round(v)}</text>`);
  s += `<polyline fill="none" stroke="var(--tsb)" stroke-width="2" points="${R.map(r=>sx(r.dn)+","+ty(r.tsb)).join(" ")}"/>`;
  for (let n=van; n<=tot; n++) if (wd(n)===0 && (n-van)%14<7) s += `<text x="${sx(n)}" y="${H-6}" text-anchor="middle">W${weekVan(n)}</text>`;
  s += `<line x1="${sx(VANDAAG)}" x2="${sx(VANDAAG)}" y1="${mt}" y2="${t0+H2}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${sx(VANDAAG)+4}" y="${mt+10}">vandaag</text>`;
  // testen (groen) en wedstrijden (blauw) als markers
  const pv = prestatiesVan(x.s), mk = {};
  pv.testen.forEach(t => { if (!t.maand && t.dn>=van && t.dn<=tot) (mk[t.dn] ||= {t:false, l:[]}).l.push(`${t.dist===200?"200 m":"2 km"}-test ${fsec(t.s, t.dist===200?1:0)}`), mk[t.dn].t = true; });
  pv.races.forEach(r => { if (r.dn>=van && r.dn<=tot) (mk[r.dn] ||= {t:false, l:[]}).l.push(`${r.wedstrijd}: ${r.cat || (r.dist?r.dist+" m":"")}${r.rank?" "+r.rank+"/"+r.n:""}`); });
  Object.entries(mk).forEach(([d,m]) => { const xx = sx(+d), kl = m.t ? "var(--ok)" : "var(--blauw)";
    s += `<g><title>${esc(ddmm(+d)+" · "+[...new Set(m.l)].join(" · "))}</title><line x1="${xx}" x2="${xx}" y1="${mt}" y2="${mt+H1}" stroke="${kl}" stroke-width="1.5" stroke-dasharray="2 3"/><circle cx="${xx}" cy="${mt+6}" r="5" fill="${kl}"/><rect x="${xx-6}" y="${mt}" width="12" height="${H1}" fill="transparent"/></g>`; });
  return `<div class="legende"><span><i style="background:var(--ok);height:8px;width:8px;border-radius:50%"></i>test</span><span><i style="background:var(--blauw);height:8px;width:8px;border-radius:50%"></i>wedstrijd</span><span><i style="background:var(--ctl)"></i>Fitheid (CTL)</span><span><i style="background:var(--ctl);opacity:.55"></i>Fitheid volgens plan (gestreept)</span><span><i style="background:var(--atl)"></i>Vermoeidheid (ATL)</span><span><i style="background:var(--beige)"></i>Dagbelasting (TSS)</span><span><i style="background:var(--tsb)"></i>Vorm (TSB): geel −10…−30 optimaal trainen, rood &lt; −30 hoog risico</span></div><div class="scroll">${s}</svg></div>`;
}

function rpeGrafiek(x){
  // per training: verwachte RPE (open cirkel) en gemelde RPE (gevulde cirkel), verbonden; één as 0–10
  const P = periode(), van = Math.min(P.van, P.statTot-13), tot = P.statTot + 1;
  const R = x.inv.filter(e=>e.rpe!=null && e.dn>=van && e.dn<tot).sort((a,b)=>a.dn-b.dn);
  if (!R.length) return `<div class="leeg">Geen RPE ingevuld in deze periode.</div>`;
  const W=900, H=230, ml=36, mr=14, mt=12, mb=28, iw=W-ml-mr, ih=H-mt-mb;
  const sx = n => ml + (n-van)/(tot-van)*iw, sy = v => mt + ih - v/10*ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Verwachte en gemelde RPE per training">`;
  [0,2,4,6,8,10].forEach(v => s += `<line class="grid" x1="${ml}" x2="${ml+iw}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${ml-6}" y="${sy(v)+4}" text-anchor="end">${v}</text>`);
  const stapW = Math.max(1, Math.ceil((tot-van)/7/14));
  for (let n=van; n<=tot; n++) if (wd(n)===0 && Math.floor((n-van)/7)%stapW===0) s += `<text x="${sx(n)}" y="${H-8}" text-anchor="middle">W${weekVan(n)}</text>`;
  const per = {}; R.forEach(e => { const k = e.dn; per[k] = (per[k]||0)+1; e._o = per[k]-1; });
  for (const e of R){
    const x0 = sx(e.dn) + e._o*7, tip = `${ddmm(e.dn)} ${e.match?e.match.type:(e.soort||e.cat)+" (extra)"}: RPE ${fmt(e.rpe,0)}${e.rpeExp!=null?`, verwacht ${fmt(e.rpeExp,1)} (${sgnN(e.dRpe)})`:" (niet gepland)"}${e.gevoelRuw?" · gevoel "+e.gevoelRuw:""} · ${fmt(e.load,0)} TSS`;
    s += `<g><title>${esc(tip)}</title>`;
    if (e.rpeExp!=null){
      s += `<line x1="${x0}" x2="${x0}" y1="${sy(e.rpeExp)}" y2="${sy(e.rpe)}" stroke="${Math.abs(e.dRpe)>=T().delta_rpe?"var(--oranje)":"var(--muted)"}" stroke-width="2"/>`;
      s += `<circle cx="${x0}" cy="${sy(e.rpeExp)}" r="4.5" fill="var(--bg)" stroke="var(--muted)" stroke-width="2"/>`; }
    s += `<circle cx="${x0}" cy="${sy(e.rpe)}" r="5" fill="${e.rpeExp!=null?"var(--or)":"var(--blauw)"}" stroke="var(--bg)" stroke-width="2"/>`;
    s += `<rect x="${x0-8}" y="${mt}" width="16" height="${ih}" fill="transparent"/></g>`;
  }
  return `<div class="legende"><span><i style="background:var(--muted);height:8px;width:8px;border-radius:50%"></i>verwachte RPE (uit planning)</span><span><i style="background:var(--or);height:8px;width:8px;border-radius:50%"></i>gemelde RPE</span><span><i style="background:var(--blauw);height:8px;width:8px;border-radius:50%"></i>gemelde RPE, extra training</span><span><i style="background:var(--oranje)"></i>verschil ≥ ${fmt(T().delta_rpe,1)}</span></div><div class="scroll">${s}</svg></div>`;
}
function weekTssGrafiek(x, hw){
  const P = periode(), W0 = x.W.filter(w=>w.week<=hw && w.week>=P.wVan && w.week<=P.wTot);
  if (!W0.length) return `<div class="leeg">Geen weken met planning.</div>`;
  const W=900, H=210, ml=40, mr=12, mt=12, mb=26, iw=W-ml-mr, ih=H-mt-mb;
  const maxY = Math.max(50, ...W0.map(w=>Math.max(w.plLoad, w.uLoad))) * 1.1;
  const slot = iw/W0.length, bw = Math.min(26, slot/2-4), sy = v => mt + ih - v/maxY*ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="TSS per week, gepland en uitgevoerd">`;
  [0,.25,.5,.75,1].forEach(f => { const v = maxY*f; s += `<line class="grid" x1="${ml}" x2="${ml+iw}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${ml-6}" y="${sy(v)+4}" text-anchor="end">${Math.round(v)}</text>`; });
  W0.forEach((w,i) => { const cx = ml + slot*(i+.5);
    s += `<g><title>W${w.week}: gepland ${fmt(w.plLoad,0)} TSS · uitgevoerd ${w.gelogd?fmt(w.uLoad,0)+" TSS":"niet gelogd"}${w.gevoel!=null?" · gevoel "+fmt(w.gevoel):""}${w.dRpe!=null?" · ΔRPE "+sgnN(w.dRpe):""}</title>
      <rect x="${cx-bw-1}" y="${sy(w.plLoad)}" width="${bw}" height="${Math.max(0,sy(0)-sy(w.plLoad))}" rx="2" fill="var(--beige)"/>
      ${w.gelogd?`<rect x="${cx+1}" y="${sy(w.uLoad)}" width="${bw}" height="${Math.max(0,sy(0)-sy(w.uLoad))}" rx="2" fill="var(--or)"/>`:""}
      <rect x="${cx-slot/2}" y="${mt}" width="${slot}" height="${ih}" fill="transparent"/></g>
      ${i % Math.max(1, Math.ceil(W0.length/16))===0 ? `<text x="${cx}" y="${H-8}" text-anchor="middle">W${w.week}</text>` : ""}`; });
  return `<div class="legende"><span><i style="background:var(--beige);height:10px"></i>gepland</span><span><i style="background:var(--or);height:10px"></i>uitgevoerd</span></div><div class="scroll">${s}</svg></div>`;
}

function renderSporter(naam){

  if (!x.inv.length) h += `<div class="melding">${esc(naam)} heeft ${S.log?"nog niets":"(nog) niets"} ingevuld in het logboek. Hieronder zie je enkel de planning.</div>`;

    <div class="tile"><div class="k">RPE t.o.v. plan (14 d)</div><div class="v">${sgnN(x.dRpe14)}</div><div class="f">gemeld − verwacht, ${x.nDRpe14} trainingen; gevoel 7 d ${fmt(x.gevoel7)}</div></div>
